function pitchHTML(p, opts={}){
  const {interactive=false, mini=false} = opts;
  const pend = p.pending;
  return `<div class="pitch ${mini?"mini":""}"><div class="ln half"></div><div class="ln circ"></div><div class="ln boxT"></div><div class="ln boxB"></div>
    ${POS.map(pos=>{
      const t=p.team?.[pos.id], aimed = interactive && p.aim===pos.id;
      const mode = interactive ? (S.ui.pick==="swap" ? "swap" : (S.ui.pick==="pos" && pend ? "pos" : "aim")) : null;
      const can = mode==="swap" ? !!t : mode==="pos" ? !t : (interactive && !pend && !t);
      const act = mode==="swap" ? "swapsel" : mode==="pos" ? "reaim" : "aim";
      const sel = mode==="swap" && S.ui.swapA===pos.id, hit = p.hit && p.hit.pos===pos.id && Date.now()-p.hit.at<8000;
      return `<button class="slot ${hit?"hit":""} ${t&&t.unk?"unkp":""} ${t?"full":""} ${t&&t.ok===false?"off":""} ${t&&t.a?"adapt":""} ${can?"can":""} ${aimed||sel?"aim":""}" ${can?`data-act="${act}" data-pos="${pos.id}"`:"disabled"} style="left:${pos.x}%;top:${pos.y}%" aria-pressed="${aimed?"true":"false"}" aria-label="${pos.l}${t?": "+esc(t.n):" vazia"}">
        ${t?`<span class="lt">${esc(t.l)}</span><span class="ov ${ovrTier(slotOvr(t))}">${slotOvr(t)}</span>${t.inj?'<span class="injb" title="Lesionado: -10 de overall">−10</span>':""}${t.unk?'<span class="unkb" title="Fora da lista">?</span>':""}`:""}<span class="pos">${pos.l}${t&&t.ok===false?(t.a?" · adapt.":" · fora"):""}${t&&t.inj?" · lesão":""}</span>${t?`<span class="nm">${esc(t.n)}</span>`:""}${aimed && pend?`<span class="nm">${esc(pend.letter)}…</span>`:""}</button>`;
    }).join("")}</div>`;
}
function boardHTML(p, mine){
  const pend=p.pending;
  return `<div class="board">${p.board.map((v,i)=>{
    const open=p.revealed.includes(i), cur=pend && pend.idx===i, c=open && (p.cards||[])[i];
    const can = mine && !pend && !open && !!p.aim;
    const label = open ? "Letra "+v+(c?" com a cartinha "+CARD_NAME[c]:"") : "Número "+(i+1);
    return `<button class="tile ${open?"open":""} ${cur?"cur":""}" ${can?`data-act="reveal" data-i="${i}"`:"disabled"} aria-label="${label}" title="${label}">${open ? v : i+1}${c?`<span class="cbadge">${CARD_ICONS[c]}</span>`:""}</button>`;
  }).join("")}</div>`;
}
function handHTML(p, mine){
  const hand = validCards(p), r=S.room, pend=p.pending;
  let picker="";
  if(mine && S.ui.pick==="pos"){
    picker = `<p class="note" style="margin:0"><b>Trocar posição:</b> toque numa posição vazia do campo para levar a letra ${esc(pend?.letter||"")} para lá.</p>`;
  } else if(mine && S.ui.pick==="swap"){
    picker = `<p class="note" style="margin:0"><b>Trocar jogadores:</b> ${S.ui.swapA ? "agora toque no segundo jogador. Os dois trocam de lugar." : "toque em dois jogadores do seu time para trocar os dois de lugar."}</p>`;
  } else if(mine && S.ui.pick){
    const opts = (S.ui.pick==="repeat" ? pastLetters(p) : AL.split("")).filter(L=>!(p.blocked||[]).includes(L));
    picker = `<div class="stack" style="gap:6px"><span class="lbl">${S.ui.pick==="repeat"?"Escolha uma letra que você já usou no seu time":"Escolha qualquer letra"}</span>${opts.length?`<div class="letters">${opts.map(X=>`<button data-act="pickL" data-l="${X}">${X}</button>`).join("")}</div>`:'<p class="note" style="margin:0">Você ainda não escalou ninguém, então não tem letra para repetir.</p>'}</div>`;
  }
  if(!hand.length) return `<div class="stack" style="gap:6px"><p class="note" style="margin:0">Nenhuma ainda. Dezessete números do seu quadro trazem uma cartinha junto com a letra.</p></div>`;
  return `<div class="stack" style="gap:8px"><div class="cards">${hand.map(c=>{
    const usable = mine && (isAtk(c.t) ? atkTargets(c.t).length>0 : c.t==="swap" ? teamCount(p)>=2 : c.t==="pos" ? !!pend && teamCount(p)<10 : !!p.aim && (c.t==="reroll" ? !!pend : (c.t==="repeat" ? pastLetters(p).length>0 : true)));
    const act = isAtk(c.t) ? "atk" : c.t==="reroll" ? "cReroll" : "cPick";
    const [bcls, btxt] = expBadge(c, r);
    return `<button class="card ${isAtk(c.t)?"atkcard":""} ${usable?"":"dim"}" data-act="cInfo" data-k="${c.t}" data-u="${usable?1:""}" aria-pressed="${S.ui.pick===c.t?"true":"false"}"><span class="expb ${bcls}">${btxt}</span>${CARD_ICONS[c.t]}<b>${CARD_NAME[c.t]}</b><span class="cdesc">${CARD_SHORT[c.t]}</span>${!usable ? `<small class="why">${!mine ? "Use na sua vez" : "Agora não dá para usar"}</small>` : ""}</button>`;
  }).join("")}</div>${picker}${(p.blocked||[]).length?`<p class="note" style="margin:0">Letras bloqueadas para você: <b>${p.blocked.join(", ")}</b></p>`:""}</div>`;
}
function stepOf(p){ if(p.deyPend) return "dey"; if(S.ui.pick==="pos" && p.pending) return "reaim"; if(!p.aim) return "aim"; if(!p.pending) return "reveal"; return "name"; }
function stepperHTML(step){
  const st=[["aim","Posição"],["reveal","Número"],["name","Jogador"]], idx={dey:0,aim:0,reveal:1,name:2,reaim:2}[step];
  return `<ol class="stepper">${st.map(([k,l],i)=>`<li class="${i<idx?"done":i===idx?"now":""}"><span>${i+1}</span>${l}</li>`).join("")}</ol>`;
}
function actionHTML(p){
  const step=stepOf(p), lab=p.aim ? POS.find(x=>x.id===p.aim).l : "";
  if(step==="reaim") return `${stepperHTML(step)}<div class="panel stack"><h3 class="stage-h">Trocar posição</h3><p class="note" style="margin:0">Toque numa posição vazia para levar a letra <b>${esc(p.pending.letter)}</b> para lá.</p>${pitchHTML(p,{interactive:true})}<button class="btn ghost" data-act="cancelPick">Cancelar</button></div>`;
  if(step==="dey"){ const dv=lookup("Deyverson");
    return `${stepperHTML(step)}<div class="panel stack"><h3 class="stage-h">Escale o Deyverson</h3><p class="note" style="margin:0"><b>${esc(pname(p.deyPend.by))}</b> usou a cartinha Deyverson em você. Escolha a posição onde ele vai jogar: quem estiver lá sai do time. Depois a sua vez continua normalmente.</p><div class="stack" style="gap:6px">${deySlots(p).map(x=>{ const t=p.team?.[x.id]; return `<button class="btn" data-act="deyPlace" data-a="${x.id}">${x.l}: ${t ? "tirar "+esc(t.n)+" ("+slotOvr(t)+")" : "vazio"} → Deyverson (${effOvr(dv,x.id)})</button>`; }).join("")}</div></div>`; }
  if(step==="aim") return `${stepperHTML(step)}<div class="panel stack"><h3 class="stage-h">Toque na posição que você quer preencher</h3>${pitchHTML(p,{interactive:true})}</div>`;
  if(step==="reveal"){
    if(p.revealed.length>=26) return `${stepperHTML(step)}<div class="panel stack"><h3 class="stage-h">O quadro acabou</h3><p class="note" style="margin:0">Escolha uma letra para o ${lab}.</p><div class="letters">${AL.split("").filter(L=>!(p.blocked||[]).includes(L)).map(L=>`<button data-act="free" data-l="${L}">${L}</button>`).join("")}</div></div>`;
    return `${stepperHTML(step)}<div class="panel stack"><div class="row" style="justify-content:space-between;align-items:center"><h3 class="stage-h">Abra um número</h3><span class="row" style="gap:6px;align-items:center"><span class="poschip">${lab}</span>${p.forced?"":`<button class="btn mini" data-act="unaim">Trocar posição</button>`}</span></div>
      ${p.forced?`<p class="note" style="margin:0">Um adversário escolheu a sua posição desta vez: você tem que escalar o <b>${lab}</b>.</p>`:""}
      ${boardHTML(p,true)}
      ${(p.blocked||[]).length?`<p class="note" style="margin:0">Letras bloqueadas para você: <b>${p.blocked.join(", ")}</b></p>`:""}</div>`;
  }
  const L=p.pending.letter;
  return `${stepperHTML(step)}<div class="panel action">
    <div class="row" style="flex-wrap:nowrap;align-items:center"><div class="bigletter ${p.pending.at && Date.now()-p.pending.at<1500 ? "flip":""}">${L}</div>
      <div class="stack" style="gap:6px;flex:1;min-width:0"><label class="lbl" for="draft">${lab} com a letra ${L}</label>
      <input id="draft" maxlength="28" placeholder="Digite um jogador com ${L}" value="${esc(S.ui.draft)}" autocomplete="off" autocapitalize="words"></div></div>
    <div id="fitnote">${fitHTML(p)}</div>
    <div id="sugg" class="stack" style="gap:6px">${suggHTML(p)}</div>
    <button class="btn gold big" data-act="place"><span class="balli">${BALL_SVG}</span>Chutar: escalar no ${lab}</button>
    ${(p.passes||0)>=1 ? '<p class="note" style="margin:0">Você já usou o seu passe nesta partida.</p>' : '<button class="linkbtn" data-act="pass">Não lembro de ninguém: passar a vez (só 1 vez por partida)</button>'}
    <div class="mypitch stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="lbl">Seu time · ${teamCount(p)}/11</span>${teamOvr(p)?`<span class="ovrb ${ovrTier(teamOvr(p))}">OVR ${teamOvr(p)}</span>`:""}</div>${pitchHTML(p,{mini:true})}</div>
  </div>`;
}
function cardbarHTML(p, mine){
  const hand=validCards(p); if(!p) return "";
  const atk=hand.filter(c=>isAtk(c.t)).length;
  return `<div class="cardbar"><button class="btn cardbtn ${S.ui.pulse&&hand.length?"pulse":""}" data-act="sheet" ${hand.length?"":"disabled"}><span class="cardicon">${CARD_ICONS.letter}</span>Cartinhas <b>${hand.length}</b>${atk?` <span class="atkdot">${atk} de ataque</span>`:""}</button>
    <span class="note cardhint">${!hand.length ? "Alguns números trazem cartinhas." : mine ? "Toque para ver e usar." : "Você pode usar na sua vez."}</span></div>`;
}
function expBadge(c, r=S.room){ return c.t==="stealcard" ? ["inf","∞ não vence"] : c.r + 1 > r.round ? ["ok","2 rodadas"] : ["last","Última!"]; }
function cardUsable(p, t, mine){ const pend=p.pending; return mine && (isAtk(t) ? atkTargets(t).length>0 : t==="swap" ? teamCount(p)>=2 : t==="pos" ? !!pend && teamCount(p)<10 : !!p.aim && (t==="reroll" ? !!pend : (t==="repeat" ? pastLetters(p).length>0 : true))); }
function cardWhy(p, t, mine){
  if(!mine) return "Você pode usar esta cartinha na sua vez.";
  if(isAtk(t)) return t==="steal" && !teamCount(p) ? "Você precisa ter pelo menos um jogador no time para dar em troca." : t==="rob" && !robSlots(p).length ? "Você não tem posição vazia para colocar o jogador roubado." : t==="dey" && deyPlaced() ? "O Deyverson já está em um time." : "Nenhum adversário pode ser alvo dessa cartinha agora.";
  if(t==="pos") return "Use depois de abrir o número, para levar a letra para outra posição vazia.";
  if(t==="reroll") return "Use depois de abrir o número, para trocar a letra que saiu.";
  if(t==="repeat" && p.aim && !pastLetters(p).length) return "Você ainda não escalou ninguém, então não tem letra para repetir.";
  return "Escolha primeiro a posição no campo.";
}
function sheetHTML(p, mine){
  if(!S.ui.sheet) return "";

document.addEventListener("keydown", e => {
  if(e.key!=="Enter") return;
  if(e.target.id==="localDraft"){ e.preventDefault(); act("addLocal"); }

document.addEventListener("click", e => {

const GAME_ACTS = new Set(["aim","reveal","place","cReroll","cPick","pickL","pass","free","reaim","swapsel","atk","atkTo","atkL","atkGo","sugg"]);
async function act(a, d={}){
  if(GAME_ACTS.has(a) && S.room && isBotTurn() && !S.botActing){ toast("Calma, é a vez do robô."); return; }

    switch(a){
      case "create": S.ui.err=""; return createRoom();
      case "join": S.ui.err=""; return joinRoom();
      case "noInvite": S.ui.invite=null; S.ui.joinCode=""; S.ui.err=""; history.replaceState(null,"",location.pathname); return render();
      case "copyInvite": { const u=inviteURL(S.room.code); try{ await navigator.clipboard.writeText(u); toast("Link copiado! Cole no grupo da galera."); }catch(e){ prompt("Copie o link da sala:", u); } return; }
      case "shareInvite": { const u=inviteURL(S.room.code); if(navigator.share){ try{ await navigator.share({title:"Artilhetra", text:"Bora jogar Artilhetra comigo? Entra na minha sala:", url:u}); }catch(e){} } else { try{ await navigator.clipboard.writeText(u); toast("Link copiado! Cole no grupo da galera."); }catch(e){ prompt("Copie o link da sala:", u); } } return; }
      case "toLocal": S.screen="local"; S.ui.err=""; return render();
      case "muralOpen": return openMural(d.id);
      case "sheet": S.ui.sheet=true; S.ui.pulse=false; return render();
      case "ncKeep": S.ui.newCard=null; return render();
      case "ncUse": S.ui.newCard=null; S.ui.sheet=true; S.ui.pulse=false; return render();
      case "sheetClose": S.ui.sheet=false; S.ui.atk=null; if(S.ui.pick!=="pos") S.ui.pick=null; return render();
      case "evtClose": S.ui.evt=null; return render();
      case "cancelPick": S.ui.pick=null; return render();
      case "unaim": { const p=S.room.players[actor()]; if(p.forced || p.pending) return; await write({players:{[actor()]:{aim:null}}}); return; }
      case "onb": S.ui.onb=0; return render();
      case "onbNext": S.ui.onb=Math.min(ONB.length-1,(S.ui.onb||0)+1); return render();
      case "onbPrev": S.ui.onb=Math.max(0,(S.ui.onb||0)-1); return render();
      case "onbEnd": S.ui.onb=null; lsSet("ae_onb","1"); return render();

      case "addBotLocal": { if(S.ui.localNames.length>=8){ S.ui.err="Máximo de 8 jogadores."; return render(); } S.ui.localNames.push({name:nextBotName(S.ui.localNames.map(x=>x.name)), bot:true, level:d.l}); S.ui.err=""; return render(); }
      case "vsBot": S.screen="bot"; S.ui.err=""; return render();
      case "addBotRoom": { const r=S.room; if(!r || r.hostId!==S.me) return; const ids=Object.keys(r.players); if(ids.length>=8){ toast("Máximo de 8 jogadores."); return; } const id="bot"+Math.random().toString(36).slice(2,8); await write({players:{[id]:{name:nextBotName(ids.map(x=>r.players[x].name)), bot:true, level:d.l, joinedAt:Date.now()}}}); return; }
      case "rmBotRoom": { if(S.room?.hostId!==S.me) return; await write({players:{[d.id]:null}}); return; }

      case "cUse": { const k=d.k; S.ui.cardInfo=null; if(isAtk(k)) return act("atk",{k}); if(k==="reroll") return act("cReroll",{k}); return act("cPick",{k}); }
      case "atkBackStep": S.ui.atk={k:S.ui.atk.k}; return render();
      case "leaveAsk": if(S.screen==="game"){ S.ui.leaveAsk=true; return render(); } return leave();
      case "leaveNo": S.ui.leaveAsk=false; return render();
      case "mute": S.ui.mute=!S.ui.mute; lsSet("ae_mute", S.ui.mute?"1":""); if(!S.ui.mute) sfx("card"); return render();
      case "shareTeam": return shareTeam(d.id);
      case "botLevel": S.ui.botLevel=d.v; return render();
      case "botCount": S.ui.botCount=+d.v; return render();
      case "hintsBot": S.ui.hints=d.v; return render();
      case "startBot": { const me=(S.ui.name||"").trim(); if(!me){ S.ui.err="Digite seu nome."; return render(); } lsSet("ae_name", me); const names=[{name:me}]; for(let i=0;i<(S.ui.botCount||1);i++) names.push({name:nextBotName(names.map(x=>x.name)), bot:true, level:S.ui.botLevel||"medio"}); S.ui.localNames=names; return startLocal(); }
      case "atkTo": S.ui.atk = {...S.ui.atk, to:d.id, letters:[], his:null}; return render();
      case "atkPick": S.ui.atk = {...S.ui.atk, his:d.a||null}; return render();
      case "atkL": { const a=S.ui.atk; const set=new Set(a.letters||[]); set.has(d.l)?set.delete(d.l):(set.size<3&&set.add(d.l)); a.letters=[...set]; return render(); }
      case "atkGo": S.ui.sheet=false; return atkDo(S.ui.atk.k, S.ui.atk.to, S.ui.atk.k==="block" ? S.ui.atk.letters : d.a);
      case "atkCancel": S.ui.atk=null; return render();
      case "deyPlace": return deyPlace(d.a);
      case "swapsel": return cardSwap(d.pos);
      case "pickL": S.ui.sheet=false; return cardPick(S.ui.pick, d.l);
      case "sugg": S.ui.draft=d.n; render(); return;
      case "free": return freeLetter(d.l);
      case "pass": return pass();
      case "skip": return skipTurn();
      case "vote": return vote(d.id);
      case "rematch": return rematch();
    }
  }catch(e){ console.error(e); }
}
window.addEventListener("mqtt-ready", ()=>{ if(S.screen==="home") render(); });
{ const sala=(new URLSearchParams(location.search).get("sala")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); if(sala.length===4){ S.ui.invite=sala; S.ui.joinCode=sala; } }
if(!lsGet("ae_onb") && !/^#mural/.test(location.hash) && !S.ui.invite) S.ui.onb=0;
render();
if(/^#mural/.test(location.hash)) openMural(location.hash.slice(7)||null);
window.addEventListener("hashchange", ()=>{ if(/^#mural/.test(location.hash)) openMural(location.hash.slice(7)||null); });
</script>
