<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rumo ao Céu</title>
<meta name="description" content="Rumo ao Céu: tabuleiro de peregrinação a Santiago ou Aparecida. Avance respondendo perguntas, rezando e partilhando.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,700;0,800;1,700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: console de jogo de tabuleiro — jogadores e credencial à esquerda, tabuleiro-paisagem ao centro, jornada e eventos à direita, carta de pergunta e dado embaixo. Tema único escuro e deliberado (azul-marinho, rubi, dourado, pergaminho). */
:root{
  color-scheme:dark;
  --navy:#09152F; --royal:#173B83; --gold:#D8A637; --gold2:#FFD76A; --ruby:#A92332; --parch:#F3E3BD; --warm:#FFF9EC;
  --panel:#0e1d40; --panel2:#132a5a; --deep:#0a1734; --ink:#FFF9EC; --muted:#b8c3db;
  --parch-ink:#3a2610; --parch-mute:#7a5f38;
  --t-oracao:#7b4fc9; --t-acao:#d9572b; --t-reflexao:#2a83cf; --t-companheiro:#e09a16;
  --t-descanso:#b5302c; --t-bolha:#c03a2e; --t-atalho:#16977f; --city:#173B83;
  --display:"Alegreya",Georgia,serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 520px at 50% -8%,#1c3c86 0%,transparent 62%),radial-gradient(800px 500px at 100% 100%,#3a0f1c55 0%,transparent 60%),var(--navy);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 28px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;top:-70px;width:230px;height:230px;border-radius:50%;pointer-events:none;z-index:0;opacity:.2;
  background:conic-gradient(from 10deg,#a92332 0 12%,#173b83 0 25%,#d8a637 0 37%,#1d6b4a 0 50%,#a92332 0 62%,#173b83 0 75%,#d8a637 0 87%,#5a2a7a 0);
  -webkit-mask:repeating-conic-gradient(#000 0 11.2%,transparent 0 12.5%);mask:repeating-conic-gradient(#000 0 11.2%,transparent 0 12.5%)}
body::before{left:-90px}body::after{right:-90px}
@media (max-width:900px){body::before,body::after{display:none}}
.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app{display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

.frame{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:18px;position:relative;border:1.5px solid #c99a3a;box-shadow:inset 0 0 0 3px #0a1530,inset 0 0 0 4px #d8a63755,0 10px 30px rgba(0,0,0,.45)}
.ttl{font-family:var(--ui);font-weight:700;font-size:21px;letter-spacing:.02em;text-align:center;padding:8px 10px;border-bottom:1.5px solid #c99a3a88;background:linear-gradient(180deg,#0a1532,#14295a);border-radius:16px 16px 0 0}
.ttl .step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3a2404;font-size:17px;margin-right:8px;vertical-align:2px}

.gbtn{font-family:var(--ui);font-weight:700;color:#3a2404;border:0;border-radius:18px;padding:12px 22px;font-size:23px;line-height:1.02;
  background:linear-gradient(180deg,#fff0b8 0%,var(--gold2) 22%,var(--gold) 70%,#b8800f 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(0,0,0,.22),0 0 0 2px #7a4f08,0 6px 0 #6b4306,0 10px 20px rgba(216,166,55,.35);display:inline-flex;align-items:center;gap:10px;justify-content:center;text-align:center;transition:transform .08s}
.gbtn:hover:not(:disabled){filter:brightness(1.06)}
.gbtn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.2),0 0 0 2px #7a4f08,0 3px 0 #6b4306}
.gbtn:disabled{filter:grayscale(.75) brightness(.65);cursor:default}
.gbtn.sm{font-size:19px;padding:10px 18px}
.gbtn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(0,0,0,.22),0 0 0 2px #7a4f08,0 6px 0 #6b4306,0 0 30px 6px rgba(255,215,106,.7)}}
.tri{width:0;height:0;border-left:13px solid #3a2404;border-top:8px solid transparent;border-bottom:8px solid transparent;flex:none}
.obtn{font-family:var(--ui);font-weight:600;font-size:17px;background:var(--deep);border:1.5px solid #c99a3a;border-radius:12px;padding:8px 14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.obtn:hover:not(:disabled){border-color:var(--gold2);background:#10214a}
.obtn:disabled{opacity:.45;cursor:default}
.obtn svg{width:16px;height:16px}
.ibtn{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1d3a78,#0a1734);border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold2);font-family:var(--ui);font-weight:700;font-size:21px;flex:none;box-shadow:0 3px 0 #6b4306}
.ibtn:hover{border-color:var(--gold2)}
.ibtn svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--gold2);text-decoration:none;padding:6px 14px;border-radius:999px;border:1.5px solid #c99a3a;background:var(--deep);white-space:nowrap}
.back:hover{border-color:var(--gold2)}

/* tela inicial, sala */
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero .logo{width:clamp(130px,16vw,210px);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.hero .txt{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.hero h1{margin:0;font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(22px,3vw,36px);line-height:1.1;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.resume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--deep);border:1.5px solid var(--gold)}
.resume span{font-family:var(--ui);font-size:18px;font-weight:600;flex:1;min-width:180px}
.setup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.box .in{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:linear-gradient(180deg,#14295a,var(--deep));border:1.5px solid #c99a3a88;text-align:left}
.rcard[aria-pressed="true"]{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold2),0 0 22px rgba(216,166,55,.45)}
.rcard:disabled{cursor:default}
.rcard .h{display:flex;align-items:center;gap:10px}
.rcard .h svg{width:42px;height:42px;flex:none}
.rcard b{display:block;font-family:var(--ui);font-weight:700;font-size:21px;line-height:1}
.rcard b span{color:var(--gold2);font-size:25px}
.rcard small{color:var(--muted);font-size:13px}
.rcard .stops{display:flex;flex-wrap:wrap;gap:4px}
.rcard .stops span{font-family:var(--ui);font-weight:600;font-size:13px;padding:1px 8px;border-radius:999px;background:#0006;border:1px solid #a8730f88;color:var(--muted)}
.rcard .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid #c99a3a;display:grid;place-items:center;color:#3a2404;font-weight:800;flex:none}
.rcard[aria-pressed="true"] .chk{background:var(--gold);border-color:var(--gold2)}
.sub{font-family:var(--ui);font-weight:700;font-size:19px;color:var(--gold2);margin:0}
.sub .step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#3a2404;font-size:15px;margin-right:6px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--deep);border:1.5px solid #c99a3a88}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:9px 10px;background:none;font-family:var(--ui);font-weight:700;font-size:18px;color:var(--muted)}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3a2404}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow input{flex:1;min-width:120px;padding:10px 14px;border-radius:12px;border:1.5px solid #c99a3a;background:var(--deep);color:var(--ink);font-family:var(--ui);font-weight:600;font-size:19px}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;border:1.5px solid #c99a3a;flex:none}
.seg button{border:0;background:var(--deep);padding:8px 10px;font-family:var(--ui);font-weight:600;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#3a2404}
select{font-family:var(--ui);font-weight:600;font-size:15px;background:var(--deep);color:var(--ink);border:1.5px solid #c99a3a;border-radius:10px;padding:7px 8px}
.xbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid #c99a3a;background:var(--deep);font-size:20px;line-height:1;color:var(--muted);flex:none}
.xbtn:hover{border-color:#ff8a7d;color:#ff8a7d}
.hint{font-size:13px;color:var(--muted);margin:0}
.errmsg{margin:0;color:#ff9d92;font-weight:600}
.rowbtns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.how{display:flex;flex-direction:column;gap:10px}
.how2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.online{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-family:var(--ui);font-weight:600;color:var(--muted)}
.fld input,.joinrow input,.linkrow input{padding:10px 14px;border-radius:12px;border:1.5px solid #c99a3a;background:var(--deep);color:var(--ink);font-family:var(--ui);font-weight:600;font-size:19px;min-width:0}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ocard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--deep);border:1.5px solid #c99a3a88;align-items:flex-start}
.ocard b{font-family:var(--ui);font-size:20px}
.ocard small{color:var(--muted);font-size:13px;flex:1}
.joinrow{display:flex;gap:8px;width:100%}
.joinrow input{flex:1;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:22px}
.codebox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:14px;background:var(--deep);border:1.5px solid var(--gold)}
.codebox small{color:var(--muted)}
.codebox b{font-family:var(--display);font-size:52px;letter-spacing:.18em;color:var(--gold2);line-height:1}
.linkrow{display:flex;gap:8px;width:100%}
.linkrow input{flex:1;font-size:14px}
.prow.lobby{padding:6px 10px 6px 6px;border-radius:999px;background:var(--deep);border:1.5px solid #c99a3a88;flex-wrap:nowrap}
.prow.lobby.empty{opacity:.45;border-color:#33415f}
.pname{flex:1;min-width:0;font-family:var(--ui);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.waitbig{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px;text-align:center}

/* topo do jogo */
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gtop .logo{width:64px;height:64px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.rtag{display:inline-flex;align-items:center;gap:10px;padding:5px 16px 5px 6px;border-radius:999px;background:linear-gradient(180deg,#14295a,var(--deep));border:1.5px solid var(--gold);font-family:var(--ui);font-weight:700;font-size:20px;line-height:1.05}
.rtag small{display:block;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.rti{width:38px;height:38px;display:grid;place-items:center}.rti svg{width:34px;height:34px}
.gtop .sp{flex:1}
.gtop .tools{display:flex;gap:8px;align-items:center}
.conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:600;font-size:14px;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--deep)}
.conn i{width:10px;height:10px;border-radius:50%;background:#e2a33b}
.conn.on i{background:#4cd07d}.conn.erro i,.conn.off i{background:#e2564a}

/* grade do jogo */
.game{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;grid-template-areas:"pl board leg" "pl bar leg";grid-template-rows:auto 1fr;gap:14px 16px;align-items:start}
.c-leg{grid-row:1 / span 2}
.c-pl{grid-area:pl;display:flex;flex-direction:column;gap:12px;min-width:0}
.c-board{grid-area:board;min-width:0;display:flex;flex-direction:column;gap:10px}
.c-leg{grid-area:leg;display:flex;flex-direction:column;gap:14px;min-width:0}
.c-bar{grid-area:bar;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch}
@media (max-width:1180px){.game{grid-template-columns:230px minmax(0,1fr);grid-template-areas:"pl board" "pl bar" "leg leg"}.c-leg{grid-row:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}}
@media (max-width:760px){.game{grid-template-columns:minmax(0,1fr);grid-template-areas:"pl" "board" "leg"}.c-leg{display:none}}

/* jogadores */
.players{display:flex;flex-direction:column;gap:9px}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:23px;background:radial-gradient(circle at 35% 28%,#ffffff70,transparent 55%),var(--pc);border:3px solid var(--gold2);color:#fff;text-shadow:0 1px 2px #0008;padding:0;box-shadow:0 3px 0 #0006}
button.av:hover{filter:brightness(1.1)}
.avi{display:grid;place-items:center;width:62%;height:62%}.avi svg{width:100%;height:100%}
.pcard{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 7px;border-radius:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--pc) 70%,#000) 0%,#0b1a3c 78%);border:1.5px solid #c99a3a77;transition:transform .2s,box-shadow .2s}
.pcard.on{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold2),0 0 22px rgba(255,215,106,.45);transform:translateX(4px)}
.pcard .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.pcard .nm{font-family:var(--ui);font-weight:700;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sub2{display:flex;align-items:center;gap:4px;font-family:var(--ui);font-weight:600;font-size:15px;color:#e8e2cf;font-variant-numeric:tabular-nums;white-space:nowrap}
.pcard .sub2 svg{width:14px;height:14px;flex:none}.pcard .sub2 em{color:#ffb0a6;font-style:normal}
.pcard .crown{position:absolute;top:-12px;left:32px;color:var(--gold2);font-size:20px;text-shadow:0 2px 3px #000a}
.pcard .chip{position:absolute;right:8px;top:-9px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:#09152f;border:1px solid #c99a3a88;font-family:var(--ui);font-weight:600;font-size:12px;white-space:nowrap;color:var(--muted)}
.chip svg{width:12px;height:12px}
.chip.you{background:var(--gold);color:#3a2404;border-color:var(--gold2)}

/* credencial (livro) */
.credbook{display:grid;grid-template-columns:44% 56%;border:0;padding:0;border-radius:12px;overflow:hidden;text-align:left;box-shadow:0 8px 18px rgba(0,0,0,.5);transform:rotate(-1.5deg);transition:transform .2s}
.credbook:hover{transform:rotate(0) scale(1.02)}
.credbook .cover{background:radial-gradient(circle at 40% 30%,#8a5328,#4a2810 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-right:3px solid #2a1607;position:relative}
.credbook .cover::after{content:"";position:absolute;inset:6px;border:1.5px solid #d8a63766;border-radius:6px;pointer-events:none}
.credbook .cv-t{font-family:var(--display);font-style:italic;font-weight:700;font-size:15px;line-height:1.1;color:var(--gold2);text-align:center}
.credbook .cover svg{width:44px;height:44px;filter:drop-shadow(0 2px 2px #0008)}
.credbook .pages{background:linear-gradient(90deg,#e6d3a6,var(--parch) 12%);color:var(--parch-ink);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.credbook .pg-t{font-family:var(--ui);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credbook .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.credbook .mini i{aspect-ratio:1;border-radius:50%;border:1.5px dashed #b49a6b}
.credbook .mini i.on{border:2px solid var(--sc);background:radial-gradient(circle,color-mix(in srgb,var(--sc) 40%,transparent) 0 40%,transparent 42%);transform:rotate(-12deg)}
.credbook .pg-c{font-size:11px;color:var(--parch-mute);line-height:1.2}
.diary{border-radius:14px;background:var(--panel);border:1.5px solid #c99a3a66}
.diary summary{cursor:pointer;font-family:var(--ui);font-weight:700;font-size:17px;padding:8px 12px;color:var(--gold2)}
.log{font-size:13px;color:var(--muted);max-height:140px;overflow:auto;display:flex;flex-direction:column;gap:3px;padding:0 12px 10px}

/* tabuleiro */
.bwrap{position:relative;border-radius:20px;padding:8px;background:linear-gradient(180deg,#e9c46a,#a8730f);box-shadow:0 0 0 2px #5a3a06,0 14px 36px rgba(0,0,0,.6)}
.bwrap::before{content:"";position:absolute;inset:4px;border-radius:16px;border:1.5px solid #fff3c8aa;pointer-events:none;z-index:3}
.bscroll{border-radius:14px;overflow:auto;position:relative;background:#4c7a37;max-height:min(66vh,760px);overscroll-behavior:contain;scrollbar-width:thin}
.bstage{position:relative;aspect-ratio:1000/640;container-type:inline-size;min-width:100%}
.bwrap.fitw{width:100%;max-width:max(560px,calc((100vh - 430px) * 1.5625 + 16px));margin:0 auto}
@media (max-width:760px){.bwrap.fitw{max-width:none}}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.tiles,.pawns{position:absolute;inset:0}
.pawns{pointer-events:none;z-index:5}
.tile{position:absolute;width:6.2cqw;height:6.2cqw;transform:translate(-50%,-50%);border:0;padding:0;background:none;z-index:2}
.tile .slab{position:absolute;inset:0;border-radius:1.4cqw;transform:rotate(var(--a));display:grid;place-items:center;
  background:radial-gradient(circle at 30% 22%,#fffdf5 0%,transparent 50%),linear-gradient(160deg,#fbf1d6,var(--parch) 55%,#d9bf86);border:.22cqw solid #8a6a36;
  box-shadow:inset 0 -.45cqw 0 #b59b62,inset 0 .2cqw 0 #fff,0 .45cqw 0 #5e4521,0 .8cqw 1cqw rgba(0,0,0,.45);transition:transform .15s}
.tile:hover .slab{transform:rotate(var(--a)) translateY(-.3cqw);filter:brightness(1.05)}
.tile .ico{transform:rotate(calc(var(--a) * -1));display:grid;place-items:center;width:100%;height:100%}
.tile .badge{width:4.2cqw}
.tile .n{position:absolute;top:.25cqw;left:.5cqw;font-family:var(--ui);font-weight:700;font-size:1.05cqw;color:#8b7650}
.dotc{width:1cqw;height:1cqw;border-radius:50%;background:#a48d5f}

.arr-body h4{margin:0;font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.sum{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 45%,#0b1a3c),#0b1a3c 70%);border:1px solid #c99a3a66}
.srow .av{width:40px;height:40px;font-size:18px}
.srow .nm{flex:1;min-width:0;font-family:var(--ui);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .st{display:flex;flex-direction:column;align-items:center;min-width:48px}
.srow .st b{font-family:var(--ui);font-size:18px;color:var(--gold2);font-variant-numeric:tabular-nums}
.srow .st small{font-size:11px;color:var(--muted)}
@media (max-width:520px){.srow .st:nth-of-type(n+5){display:none}}
.seals.done{padding:12px;border-radius:8px;background:linear-gradient(180deg,#f7ead0,var(--parch));box-shadow:inset 0 0 0 1px #b8955a;grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.seals.done .sealb .seal{width:64px;height:64px}
.pray{padding:14px;border-radius:12px;background:linear-gradient(180deg,#1d3f8a55,#0b1a3c);border:1px solid #c99a3a66}
.pray .inv{margin:0 0 8px;font-family:var(--ui);font-weight:600;font-size:17px;color:var(--gold2)}
.salve{margin:0;font-family:var(--display);font-style:italic;font-size:17px;line-height:1.5}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function catmull(pts,seg){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;for(let s=0;s<seg;s++){const t=s/seg,t2=t*t,t3=t2*t;out.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}out.push(pts[pts.length-1]);return out}
const PATH_DENSE=catmull(PATH_CTRL,24);
const TILE_POS=(()=>{const d=[0];for(let i=1;i<PATH_DENSE.length;i++){const a=PATH_DENSE[i-1],b=PATH_DENSE[i];d.push(d[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
 const tot=d[d.length-1],res=[];let j=0;
 for(let k=0;k<36;k++){const target=tot*k/35;while(j<d.length-2&&d[j+1]<target)j++;const f=(target-d[j])/((d[j+1]-d[j])||1),a=PATH_DENSE[j],b=PATH_DENSE[j+1];
  const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f;let ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;res.push({x,y,a:Math.max(-28,Math.min(28,ang))})}
 return res})();
const ROAD_D="M"+PATH_DENSE.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");
function nearPath(x,y,r){for(const p of PATH_DENSE){if(Math.abs(p[0]-x)<r&&Math.abs(p[1]-y)<r&&Math.hypot(p[0]-x,p[1]-y)<r)return true}return false}

 const r=ROUTES[S.route];
 S.stage="game";
 S.players=players.map((p,i)=>({id:p.id,kind:p.kind,nivel:p.nivel,n:(p.n||"").trim()||(p.kind==="robo"?ROBOS[i]:"Jogador "+(i+1)),c:p.c,pos:0,skip:false,gracas:0,stamps:[0]}));
 S.board=buildBoard(S.route);S.deck=shuffle(GERAIS.concat(r.perguntas,r.perguntas));
 S.cur=0;S.die=0;S.q=null;S.card=null;S.over=false;S.winner=-1;S.moving=-1;S.fresh=null;S.rolling=false;
 S.log=[`A peregrinação começa em ${r.cidades[0][0]}.`];
 UI.overSeen=false;
 beginTurn(true);
}
function humansLocal(){return S.players.filter(p=>p.kind==="humano").length}
function beginTurn(first){
 const p=S.players[S.cur];S.q=null;S.card=null;S.die=0;
 if(p.skip){S.phase="rest"}
 else if(UI.mode==="local"&&p.kind==="humano"&&humansLocal()>1){S.phase="handoff";S.first=!!first}
 else S.phase="turn";
 commit();
}
function act(a,v){ /* chamado pela interface deste aparelho */
 if(UI.mode==="guest"){pub("host",{t:"act",id:UI.myId,a,v});return}
 if(!canAct())return;engine(a,v);
}
function engine(a,v){
 if(S.stage!=="game"||S.over)return;
 const p=S.players[S.cur];
 if(a==="draw"&&(S.phase==="turn"||S.phase==="handoff")){
  if(!S.deck.length)S.deck=shuffle(GERAIS.concat(ROUTES[S.route].perguntas));
  S.q={q:S.deck.pop(),order:shuffle([0,1,2,3]),done:false};S.phase="question";commit();
 } else if(a==="answer"&&S.phase==="question"){
  const q=S.q;q.done=true;q.pick=v;q.ok=v===q.q[2];if(q.ok)p.acertos=(p.acertos||0)+1;S.phase="answered";ev(q.ok?"ok":"no");commit();
 } else if(a==="go"&&S.phase==="answered"){
  const q=S.q;S.q=null;
  if(q.ok){const d=1+Math.floor(Math.random()*6);S.die=d;S.rolling=true;S.phase="moving";S.log.push(`${p.n} acertou e tirou ${d}.`);ev("roll");commit();setTimeout(()=>{S.rolling=false;move(S.cur,d,land)},650)}
  else{S.die=1;S.phase="moving";S.log.push(`${p.n} errou e deu um passo de fé.`);commit();move(S.cur,1,land)}
 } else if(a==="ack"){
  if(S.phase==="city"){S.log.push(`${p.n} chegou a ${S.board[p.pos].nome}.`);endTurn()}
  else if(S.phase==="card"){const k=S.card.k;S.card=null;applyEffect(S.cur,k)}
  else if(S.phase==="rest"){p.skip=false;S.log.push(`${p.n} descansou no albergue.`);endTurn()}
  else if(S.phase==="handoff"){engine("draw")}
 }
}
function move(pi,steps,cb){
 const p=S.players[pi];S.phase="moving";const dir=steps<0?-1:1;let left=Math.abs(steps);
 const tick=()=>{if(left===0||(dir>0&&p.pos>=L-1)||(dir<0&&p.pos<=0)){S.moving=-1;cb&&cb();return}
  p.pos+=dir;left--;S.moving=pi;ev("step");commit();setTimeout(tick,280)};
 tick();
}
function stampCity(p){const t=S.board[p.pos];if(t.t==="cidade"&&!p.stamps.includes(t.i)){p.stamps.push(t.i);S.fresh={p:S.players.indexOf(p),c:t.i};return true}return false}
function land(){
 const p=S.players[S.cur],t=S.board[p.pos];
 if(p.pos>=L-1){stampCity(p);return finish(S.cur)}
 if(t.t==="cidade"){const novo=stampCity(p);S.card={city:t.i,novo};S.phase="city";if(novo)ev("bell");commit();return}
 const c=CASAS[t.t];
 if(!c)return endTurn();
 S.card={k:t.t,txt:c.cards[Math.floor(Math.random()*c.cards.length)]};S.phase="card";commit();
}
function applyEffect(pi,k){
 const p=S.players[pi];
 const after=()=>{const w=S.players.findIndex(x=>x.pos>=L-1);if(w>=0){stampCity(S.players[w]);return finish(w)}if(stampCity(p))ev("bell");endTurn()};
 if(k==="oracao"){S.log.push(`${p.n} rezou e avançou 1.`);move(pi,1,after)}
 else if(k==="acao"||k==="reflexao"){p.gracas++;S.log.push(`${p.n} ganhou 1 graça.`);endTurn()}
 else if(k==="descanso"){p.skip=true;S.log.push(`${p.n} vai descansar no albergue.`);endTurn()}
 else if(k==="bolha"){S.log.push(`${p.n} voltou 2 casas.`);move(pi,-2,after)}
 else if(k==="atalho"){S.log.push(`${p.n} avançou 2 casas.`);move(pi,2,after)}
 else if(k==="companheiro"){S.players.forEach(o=>{if(o!==p&&o.pos<L-1){o.pos++;stampCity(o)}});S.log.push(`${p.n} partilhou: os outros avançaram 1.`);after()}
 else endTurn();
}
function endTurn(){if(S.over)return;S.cur=(S.cur+1)%S.players.length;S.fresh=null;beginTurn(false)}
function finish(w){S.over=true;S.winner=w;S.phase="over";S.moving=-1;S.log.push(`${S.players[w].n} chegou a ${ROUTES[S.route].meta}!`);ev("win");commit()}

/* robô */
function scheduleBot(){
 clearTimeout(botT);
 if(UI.mode==="guest"||S.stage!=="game"||S.over)return;
 const p=S.players[S.cur];if(!p||p.kind!=="robo")return;
 const ph=S.phase,d={turn:900,question:1800,answered:1000,card:2600,city:2600,rest:2000}[ph];
 if(d==null)return;
 botT=setTimeout(()=>{
  if(S.players[S.cur]!==p||S.phase!==ph)return;
  if(ph==="turn")engine("draw");
  else if(ph==="question"){const ok=Math.random()<NIVEIS[p.nivel||"medio"].p;const wrong=[0,1,2,3].filter(i=>i!==S.q.q[2]);engine("answer",ok?S.q.q[2]:wrong[Math.floor(Math.random()*3)])}
  else if(ph==="answered")engine("go");
  else engine("ack");
 },d);
}

/* quem pode agir neste aparelho */
function canAct(){
 if(S.stage!=="game"||S.over)return false;
 const p=S.players[S.cur];if(!p)return false;
 if(UI.mode==="local")return p.kind==="humano";
 return p.id===UI.myId;
}

/* aplica mudança: desenha, salva, transmite, agenda robô */
function commit(){
 if(UI.mode==="guest")return;
 if(UI.mode==="host")pub("state",{t:"state",s:view()},true);
 render();save();scheduleBot();
}
function view(){const v=Object.assign({},S);delete v.deck;return v}

async function hostRoom(code,resumeS){
 UI.mode="host";UI.code=code||rid(4);UI.screen=resumeS?"game":"lobby";
 if(resumeS)S=resumeS;
 else{const nome=(UI.nome||"").trim()||"Anfitrião";S={stage:"lobby",route:S.route||"santiago",code:UI.code,players:[{id:UI.myId,kind:"online",n:nome,c:PALETA[0]}]}}
 S.code=UI.code;
 history.replaceState(null,"",location.pathname+"?sala="+UI.code);
 render();
 await netStart(UI.code,["host"],onHostMsg,()=>{pub("state",{t:"state",s:view()},true)});
 render();scheduleBot();
}
function onHostMsg(sub,m){
 if(sub!=="host")return;
 if(m.t==="join"){
  let p=S.players.find(x=>x.id===m.id);
  if(!p&&S.stage==="lobby"&&S.players.length<4){const used=S.players.map(x=>x.c);S.players.push({id:m.id,kind:"online",n:(m.n||"Peregrino").slice(0,16),c:PALETA.find(c=>!used.includes(c))});}
  else if(p&&m.n&&S.stage==="lobby")p.n=m.n.slice(0,16);
  if(!p&&S.stage!=="lobby")pub("to/"+m.id,{t:"full",why:"started"});
  else if(!p&&S.players.length>=4)pub("to/"+m.id,{t:"full",why:"cheia"});
  commit();
 } else if(m.t==="act"){
  if(S.stage!=="game")return;
  const seat=S.players.findIndex(x=>x.id===m.id);
  if(seat===S.cur)engine(m.a,m.v);
 } else if(m.t==="leave"&&S.stage==="lobby"){S.players=S.players.filter(x=>x.id!==m.id);commit()}
}
function lobbyStart(){
 if(S.players.length<2)return;
 newGame(S.players);
}

function onGuestMsg(sub,m){

 }

function leaveRoom(keepErr){

  html=`<div class="evtop" style="--ec:${p.c}"><span class="evk">${S.first?"A peregrinação começa":"Próximo peregrino"}</span></div><div class="in center">${avatar(p,S.cur)}<h3>Vez de ${who}</h3><p class="muted">Passe o aparelho para ${who}. Peão na casa ${p.pos}.</p><div class="actions center">${btn("Estou pronto",true)}</div></div>`;
 } else if(S.phase==="rest"){
  html=`<div class="evtop" style="--ec:var(--t-descanso)">${badge("bed","var(--t-descanso)")}<span class="evk">Imprevisto · Albergue</span></div><div class="in center">${avatar(p,S.cur)}<h3>${who} está descansando</h3><p class="fact">Passou a noite no albergue e volta a caminhar na próxima rodada.</p><div class="actions center">${btn("Seguir")}</div></div>`;
 } else if(S.phase==="city"){cls="evcard citycard";
  const t=S.board[p.pos];
  html=`<div class="evtop" style="--ec:var(--royal)"><span class="evk">${S.card.novo?"Novo selo na credencial":"Cidade já carimbada"}</span></div><div class="in"><div class="stampwrap ${S.card.novo?"anim":""}">${sealSVG(t.i,true,p.c,true)}</div><small class="muted center">${who} chegou a</small><h3 class="center">${esc(t.nome)}</h3><p class="fact">${esc(t.fact)}</p><div class="actions">${btn("Seguir caminho")}</div></div>`;
 } else if(S.phase==="card"){
  const c=CASAS[S.card.k];
  html=`<div class="evtop" style="--ec:${COR[S.card.k]}">${badge(c.ic,COR[S.card.k])}<span class="evk">${c.grupo==="esp"?"Casa de sugestão":"Imprevisto"} · ${c.nome}</span></div><div class="in"><small class="muted">${who} caiu em</small><h3>${c.nome}</h3><p class="fact">${esc(S.card.txt)}</p><p class="eff">${c.efeito}</p><div class="actions">${btn(c.bt)}</div></div>`;
 } else if(S.phase==="over"){return arrival()}
 const o=el(`<div class="overlay" id="ovs"><div class="card ${cls}" role="dialog" aria-modal="true">${html}</div></div>`);o.dataset.key=key;
 document.body.appendChild(o);
 const ok=o.querySelector("#sok");if(ok){ok.onclick=()=>{ok.disabled=true;act("ack")};ok.focus({preventScroll:true})}
}
function closeStateModal(){const o=document.getElementById("ovs");if(o)o.remove()}

function arrival(){
 const r=ROUTES[S.route],w=S.players[S.winner],rank=S.players.slice().sort((a,b)=>b.pos-a.pos||b.stamps.length-a.stamps.length||b.gracas-a.gracas);
 const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
 const conf=reduce?"":Array.from({length:36},(_,i)=>`<i style="left:${(i*2.8+Math.random()*2).toFixed(1)}%;animation-delay:${(Math.random()*1.4).toFixed(2)}s;background:${["#ffd76a","#d8a637","#fff9ec","#a92332","#173b83"][i%5]}"></i>`).join("");
 const html=`<div class="confetti" aria-hidden="true">${conf}</div><div class="arrive card" role="dialog" aria-modal="true" aria-label="Chegada ao santuário">
  <div class="arr-top"><span class="arr-k">Chegada a ${esc(r.meta)}</span>${avatar(w,S.winner)}<span class="arr-crown">♛</span><h2>${esc(w.n)} chegou primeiro!</h2><p>${S.route==="santiago"?"Abraço no apóstolo e Compostela na mão. Buen Camino!":"Aos pés da Mãe Aparecida, o romeiro agradece cada passo."}</p></div>
  <div class="arr-body">
   <h4>Resumo da jornada</h4>
   <div class="sum">${rank.map((x)=>`<div class="srow" style="--pc:${x.c}">${avatar(x,S.players.indexOf(x))}<span class="nm">${esc(x.n)}</span><span class="st"><b>${x.pos}</b><small>casas</small></span><span class="st"><b>${x.stamps.length}/11</b><small>selos</small></span><span class="st"><b>${x.acertos||0}</b><small>acertos</small></span><span class="st"><b>${x.gracas}</b><small>graças</small></span></div>`).join("")}</div>
   <h4>Credencial de ${esc(w.n)}</h4>
   <div class="seals done">${r.cidades.map((c,ci)=>`<span class="sealb" title="${esc(c[0])}">${sealSVG(ci,w.stamps.includes(ci),w.c)}</span>`).join("")}</div>
   <div class="pray"><p class="inv">Na peregrinação ninguém fica para trás. Esperem juntos os últimos peregrinos chegarem e rezem em ação de graças:</p>
    <p class="salve"><b>Salve, Rainha,</b> Mãe de misericórdia, vida, doçura e esperança nossa, salve! A vós bradamos, os degredados filhos de Eva; a vós suspiramos, gemendo e chorando neste vale de lágrimas. Eia, pois, advogada nossa, esses vossos olhos misericordiosos a nós volvei; e, depois deste desterro, mostrai-nos Jesus, bendito fruto do vosso ventre. Ó clemente, ó piedosa, ó doce sempre Virgem Maria. Rogai por nós, santa Mãe de Deus, para que sejamos dignos das promessas de Cristo. Amém.</p></div>
   <div class="actions"><button class="obtn" id="ver">Ver o tabuleiro</button>${UI.mode==="guest"?"":'<button class="gbtn sm" id="again2">Nova partida <span class="tri"></span></button>'}</div>
  </div></div>`;
 const o=el(`<div class="overlay celebrate" id="ovs">${html}</div>`);o.dataset.key="over";document.body.appendChild(o);
 o.querySelector("#ver").onclick=()=>{UI.overSeen=true;closeStateModal()};
 const a2=o.querySelector("#again2");if(a2)a2.onclick=()=>{UI.overSeen=true;againAfterEnd()};
 o.querySelector(".gbtn,.obtn").focus({preventScroll:true});o.scrollTop=0;
}

/* ---------- janelas de informação (só deste aparelho) ---------- */
function infoModal(html,cls){closeInfo();const o=el(`<div class="overlay info" id="ovi"><div class="card ${cls||"evcard"}" role="dialog" aria-modal="true">${html}</div></div>`);document.body.appendChild(o);
 o.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeInfo);
 o.addEventListener("click",e=>{if(e.target===o)closeInfo()});
 const f=o.querySelector(".gbtn")||o.querySelector("button");if(f)f.focus({preventScroll:true});const cd=o.querySelector(".card");if(cd)cd.scrollTop=0;return o}
function closeInfo(){const o=document.getElementById("ovi");if(o)o.remove()}
function confirmBox(t,txt,ok,fn){infoModal(`<div class="evtop" style="--ec:var(--ruby)"><span class="evk">Confirmar</span></div><div class="in"><h3>${esc(t)}</h3><p class="muted">${esc(txt)}</p><div class="actions"><button class="obtn" data-close>Cancelar</button><button class="gbtn sm" id="cok">${esc(ok)}</button></div></div>`);document.getElementById("cok").onclick=()=>{closeInfo();fn()}}
function helpModal(){infoModal(`<div class="evtop" style="--ec:var(--gold)"><span class="evk">Como jogar</span></div><div class="in"><ol class="rules"><li>Tire uma carta e responda a pergunta.</li><li>Acertou? Jogue o dado e ande o número sorteado.</li><li>Errou? Dê um passo de fé: ande 1 casa.</li><li>Cada casa tem um efeito: cidades dão selos na credencial; as outras trazem sugestões ou imprevistos.</li><li>Quem chegar primeiro ao santuário vence, mas a peregrinação só termina quando todos rezam juntos.</li></ol><div class="leg2">${legendHTML()}</div><div class="actions"><button class="gbtn sm" data-close>Entendi</button></div></div>`)}
function casaInfo(k){const c=CASAS[k];infoModal(`<div class="evtop" style="--ec:${COR[k]}">${badge(c.ic,COR[k])}<span class="evk">${c.grupo==="esp"?"Casa de sugestão":"Imprevisto"}</span></div><div class="in"><h3>${c.nome}</h3><p class="eff">${c.efeito}</p><p class="muted">Exemplo de cartão: ${esc(c.cards[0])}</p><div class="actions"><button class="gbtn sm" data-close>Fechar</button></div></div>`)}
function tileInfo(i){
 const t=S.board[i];
 if(t.t==="cidade")return cityInfo(t.i,i);
 const c=CASAS[t.t];
 const here=S.players.filter(x=>x.pos===i).map(x=>x.n);
 if(!c)return infoModal(`<div class="evtop" style="--ec:var(--gold)"><span class="evk">Casa ${i}</span></div><div class="in"><p class="fact">Um trecho tranquilo do caminho. Nada acontece aqui.</p>${here.length?`<p class="muted">Aqui agora: ${esc(here.join(", "))}</p>`:""}<div class="actions"><button class="gbtn sm" data-close>Fechar</button></div></div>`);
 infoModal(`<div class="evtop" style="--ec:${COR[t.t]}">${badge(c.ic,COR[t.t])}<span class="evk">Casa ${i} · ${c.grupo==="esp"?"Casa de sugestão":"Imprevisto"}</span></div><div class="in"><h3>${c.nome}</h3><p class="eff">${c.efeito}</p>${here.length?`<p class="muted">Aqui agora: ${esc(here.join(", "))}</p>`:""}<div class="actions"><button class="gbtn sm" data-close>Fechar</button></div></div>`);
}
function cityInfo(ci,i){
 const r=ROUTES[S.route],c=r.cidades[ci];
 if(i===undefined)i=S.board.findIndex(t=>t.t==="cidade"&&t.i===ci);
 const quem=S.players.filter(x=>x.stamps.includes(ci)).map(x=>x.n);
 infoModal(`<div class="evtop" style="--ec:var(--royal)"><span class="evk">Casa ${i} · parada ${ci+1} de ${r.cidades.length}</span></div><div class="in"><div class="stampwrap sm">${sealSVG(ci,quem.length>0,quem.length?S.players.find(x=>x.stamps.includes(ci)).c:"#8a7a5a",true)}</div><h3 class="center">${esc(c[0])}</h3><p class="fact">${esc(c[1])}</p><p class="muted">${quem.length?"Carimbada por: "+esc(quem.join(", ")):"Ninguém carimbou ainda."}</p><div class="actions"><button class="gbtn sm" data-close>Fechar</button></div></div>`);
}
function credModal(pi){
 const r=ROUTES[S.route];
 const draw=k=>{const x=S.players[k];return `<div class="credtabs" role="tablist">${S.players.map((y,j)=>`<button role="tab" aria-selected="${j===k}" data-k="${j}" style="--pc:${y.c}">${esc(y.n)}</button>`).join("")}</div>
  <div class="credpage"><div class="credhead"><span>Credencial do Peregrino</span><b>${esc(x.n)}</b><small>${esc(r.nome)} · ${x.stamps.length} de ${r.cidades.length} selos</small></div>
  <div class="seals">${r.cidades.map((c,ci)=>`<button class="sealb" data-c="${ci}" aria-label="${esc(c[0])}${x.stamps.includes(ci)?", carimbado":", ainda não"}">${sealSVG(ci,x.stamps.includes(ci),x.c)}<span>${esc(c[0])}</span></button>`).join("")}</div>
  <p class="muted center">Toque num selo para ler a curiosidade da cidade.</p></div><div class="actions"><button class="gbtn sm" data-close>Fechar</button></div>`};
 const o=infoModal(`<div class="evtop" style="--ec:#6b3f1d"><span class="evk">Credencial do Peregrino</span></div><div class="in" id="credin">${draw(pi)}</div>`,"evcard credcard");
 const wire=()=>{o.querySelectorAll(".credtabs button").forEach(b=>b.onclick=()=>{o.querySelector("#credin").innerHTML=draw(+b.dataset.k);wire()});
  o.querySelectorAll(".sealb").forEach(b=>b.onclick=()=>{const ci=+b.dataset.c;cityInfo(ci)});o.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeInfo)};
 wire();
}

function mobile(){return window.innerWidth<=720}

/* ---------- início ---------- */
(function boot(){
 const qs=new URLSearchParams(location.search).get("sala");
 const sv=loadSave();
 if(qs&&!(sv&&sv.mode==="host"&&sv.code===qs.toUpperCase())){UI.tab="online";UI.joinCode=qs.toUpperCase();if(UI.nome)return joinRoom(UI.joinCode)}
 render();
})();
let rz,lastW=window.innerWidth;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(UI.screen!=="game")return;const w=window.innerWidth;if((w<=760)!==(lastW<=760)){UI.zoom=defaultZoom();lastW=w;render()}lastW=w},150)});
window.addEventListener("beforeunload",()=>{if(UI.mode==="guest"&&S.stage==="lobby")pub("host",{t:"leave",id:UI.myId})});

</script>
</body>
</html>
