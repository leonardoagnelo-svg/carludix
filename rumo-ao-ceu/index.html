<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rumo ao Céu: tabuleiro de peregrinação a Santiago ou Aparecida. Avance respondendo perguntas, rezando e partilhando.">
<link rel="icon" type="image/png" href="logo.png">
<title>Rumo ao Céu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,700;0,800;1,700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: game console — players on the left, illustrated board in the middle, special squares on the right, question bar + die along the bottom. Deliberately single dark theme (night-blue with gold frames). */
:root{
  color-scheme:dark;
  --night:#0b1733; --night2:#13254d; --panel:#0f1f42; --panel2:#182d5c;
  --gold:#f2b632; --gold2:#ffd970; --gold-dk:#a8730f; --ink:#f4f1e8; --muted:#b9c3d9;
  --parch:#efe2c2; --parch-dk:#cdb98c; --parch-ink:#3b2a14;
  --good:#38b26a; --bad:#d9483b;
  --t-oracao:#8e5bd6; --t-acao:#e0612f; --t-reflexao:#2d8fd6; --t-companheiro:#e6a21f;
  --t-descanso:#c23b2e; --t-bolha:#c23b2e; --t-atalho:#1fa58b;
  --display:"Alegreya",Georgia,serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 600px at 50% -10%,#1d3a78 0%,transparent 60%),var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 32px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* gold frame */
.frame{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:18px;position:relative;
  border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 2px var(--gold-dk),0 0 0 4px #2a1c05,0 0 0 5px var(--gold),0 10px 30px rgba(0,0,0,.45)}
.ttl{font-family:var(--ui);font-weight:700;font-size:22px;letter-spacing:.02em;text-align:center;padding:6px 10px;margin:-2px -2px 0;border-bottom:2px solid var(--gold-dk);background:linear-gradient(180deg,#0a1532,#14295a);border-radius:16px 16px 0 0}
.gbtn{font-family:var(--ui);font-weight:700;color:#3a2404;border:0;border-radius:16px;padding:12px 24px;font-size:22px;line-height:1.05;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#d48a10);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 2px #7a4f08,0 6px 18px rgba(242,182,50,.35);display:inline-flex;align-items:center;gap:10px;justify-content:center}
.gbtn:hover:not(:disabled){filter:brightness(1.08)}
.gbtn:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.gbtn .tri{width:0;height:0;border-left:14px solid #3a2404;border-top:9px solid transparent;border-bottom:9px solid transparent}
.obtn{font-family:var(--ui);font-weight:600;font-size:17px;background:#0a1532;border:2px solid var(--gold-dk);border-radius:12px;padding:8px 16px;color:var(--ink)}
.obtn:hover{border-color:var(--gold)}

/* top bar */
.top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.logo{width:clamp(120px,15vw,190px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.topmid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.topmid h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(18px,2.4vw,26px);margin:0;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.routes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rbtn{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:18px;background:linear-gradient(180deg,#14295a,#0a1532);box-shadow:0 0 0 2px var(--gold-dk),0 0 0 4px #000a,0 6px 16px rgba(0,0,0,.4);text-align:left;border:0}
.rbtn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold2),0 0 22px rgba(242,182,50,.55)}
.rbtn .ic{width:44px;height:44px;flex:none}
.rbtn b{display:block;font-family:var(--ui);font-weight:700;font-size:22px;line-height:1;color:var(--ink)}
.rbtn b span{color:var(--gold2);font-size:26px}
.rbtn small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
@media (max-width:640px){.top{grid-template-columns:1fr;justify-items:center}}

/* game grid */
.game{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;grid-template-areas:"pl board leg" "pl bar bar";gap:16px;align-items:start}
.c-pl{grid-area:pl;display:flex;flex-direction:column;gap:12px}
.c-board{grid-area:board;min-width:0}
.c-leg{grid-area:leg}
.c-bar{grid-area:bar;min-width:0}
@media (max-width:1080px){.game{grid-template-columns:minmax(0,1fr) 240px;grid-template-areas:"board leg" "bar bar" "pl pl"}.c-pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
@media (max-width:720px){.game{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "bar" "pl" "leg"}}

/* players */
.pcard{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:linear-gradient(90deg,var(--pc),#0a1532 85%);box-shadow:0 0 0 2px var(--gold-dk),0 4px 12px rgba(0,0,0,.4)}
.pcard.on{box-shadow:0 0 0 3px var(--gold2),0 0 18px rgba(242,182,50,.5)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:radial-gradient(circle at 35% 30%,#fff6,transparent 60%),var(--pc);border:3px solid var(--gold);color:#fff;text-shadow:0 1px 2px #0008}
.pcard .nm{font-family:var(--ui);font-weight:700;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sc{display:flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.pcard .sc svg{width:18px;height:18px}
.pcard .info{min-width:0;flex:1}
.pcard .st{font-size:12px;color:var(--gold2);font-family:var(--ui);letter-spacing:.04em}

/* credential booklet */
.cred{border-radius:14px;padding:14px;background:linear-gradient(135deg,#6b3f1d,#4a2a12);box-shadow:0 0 0 2px #2b1709,0 8px 20px rgba(0,0,0,.5);position:relative}
.cred h3{margin:0 0 8px;font-family:var(--display);font-style:italic;font-weight:700;font-size:19px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.cred .pages{background:var(--parch);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;color:var(--parch-ink)}
.cred .row{display:flex;flex-direction:column;gap:4px}
.cred .row b{font-family:var(--ui);font-size:14px}
.stamps{display:flex;flex-wrap:wrap;gap:4px}
.stamp{width:22px;height:22px;border-radius:50%;border:1.5px dashed #a8946b;display:grid;place-items:center;font-size:10px;font-family:var(--display);font-weight:800;color:#a8946b}
.stamp.on{border:2px solid currentColor;transform:rotate(-10deg);background:rgba(255,255,255,.35)}

/* board */
.boardbox{padding:14px;border-radius:18px;overflow:hidden;position:relative;
  background:
   radial-gradient(160px 60px at 85% 6%,#fff3 0%,transparent 70%),
   radial-gradient(500px 140px at 20% 8%,#6f9a5d 0%,transparent 70%),
   radial-gradient(600px 160px at 75% 10%,#5b8a54 0%,transparent 70%),
   linear-gradient(180deg,#8fb3d9 0%,#b8d0e3 14%,#6e9b58 22%,#4f8044 55%,#3f6d39 100%);
  box-shadow:0 0 0 2px var(--gold-dk),0 0 0 4px #000a,0 0 0 5px var(--gold),0 10px 30px rgba(0,0,0,.45)}
.boardbox::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 70%,#ffffff10 0 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 60% 30%,#00000012 0 3px,transparent 4px) 0 0/46px 46px;pointer-events:none}
.board{display:grid;gap:5px;position:relative;margin-top:40px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;text-align:center;min-width:0;
  background:linear-gradient(160deg,#f6ecd2,var(--parch) 50%,#dcc79a);box-shadow:inset 0 -3px 0 #b49c6a,inset 0 2px 0 #fff8,0 3px 0 #6d5a33,0 5px 8px rgba(0,0,0,.35)}
.tile .n{position:absolute;top:2px;left:5px;font-size:10px;color:#8b7650;font-family:var(--ui);font-weight:600}
.badge{width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 2px 0 #fff6,inset 0 -2px 0 #0003,0 1px 2px #0005}
.badge svg{width:62%;height:62%}
.tile .lbl{font-family:var(--ui);font-weight:700;font-size:clamp(8px,1vw,11px);line-height:1;color:var(--parch-ink);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.caminho .badge{background:transparent;box-shadow:none;color:#a48d5f}
.tile.cidade{background:linear-gradient(160deg,#fff2c4,#f3cf6a 60%,#c99627);box-shadow:inset 0 -3px 0 #9a6c12,inset 0 2px 0 #fff9,0 3px 0 #5c3e06,0 0 0 2px var(--gold2),0 6px 12px rgba(0,0,0,.45)}
.tile.cidade .badge{background:radial-gradient(circle at 35% 30%,#6a8fd8,#22468f);}
.tile.cidade .lbl{color:#3a2404}
.tile.fim{background:linear-gradient(160deg,#ffe28a,var(--gold) 60%,#b8770c);}
.tile.fim .badge{background:radial-gradient(circle at 35% 30%,#ff7a6b,#b21f1f)}
.tile.inicio .badge{background:radial-gradient(circle at 35% 30%,#6a8fd8,#22468f)}
.tokens{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:1px;padding-bottom:6%;pointer-events:none}
.pawn{width:clamp(12px,1.9vw,22px);height:clamp(16px,2.6vw,30px);transition:transform .2s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.pawn.cur{transform:translateY(-4px) scale(1.15)}
.flag{position:absolute;top:8px;font-family:var(--display);font-weight:800;font-size:clamp(13px,1.6vw,18px);color:#fff;padding:3px 14px;border-radius:6px;background:linear-gradient(180deg,#d33b2b,#9c1f16);box-shadow:0 0 0 2px var(--gold),0 3px 8px #0007;z-index:2}
.flag.a{left:14px}.flag.b{right:14px}

/* legend */
.leg{display:flex;flex-direction:column}
.leg .sec{padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.li{display:flex;gap:10px;align-items:center}
.li .badge{width:40px;flex:none}
.li b{font-family:var(--ui);font-weight:700;font-size:17px;display:block;line-height:1.05}
.li small{color:var(--muted);font-size:13px;line-height:1.2;display:block}
.leg .ttl.mid{border-radius:0;border-top:2px solid var(--gold-dk);margin:0 -2px}

/* bottom bar */
.bar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px}
@media (max-width:900px){.bar{grid-template-columns:1fr}}
.qbox{border-radius:14px;padding:12px 16px;background:#0a1532;box-shadow:0 0 0 2px var(--gold-dk);min-height:110px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.qbox .qh{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-weight:700;font-size:20px;color:var(--gold2)}
.qbox .qh svg{width:24px;height:24px}
.qbox p{margin:0;font-family:var(--ui);font-weight:600;font-size:clamp(17px,1.7vw,21px);line-height:1.2;text-wrap:balance}
.qbox .expl{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.verdict{font-family:var(--ui);font-weight:700;font-size:18px}
.verdict.ok{color:#6fe39b}.verdict.no{color:#ff8a7d}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:6px 14px 6px 8px;border-radius:999px;border:2px solid var(--gold-dk);background:linear-gradient(180deg,#14295a,#0a1532);font-family:var(--ui);font-weight:600;font-size:17px;min-height:36px}
.opt .k{width:24px;text-align:center;font-weight:700;color:var(--gold2)}
.opt .tx{flex:1;min-width:0}
.opt:hover:not(:disabled){border-color:var(--gold2)}
.opt:disabled{cursor:default}
.opt.right{background:linear-gradient(180deg,#3fc172,#1f8a48);border-color:#bff2cf}
.opt.right .k{color:#fff}
.opt.wrong{background:linear-gradient(180deg,#e0594b,#a62a20);border-color:#ffc4bc}
.opt.wrong .k{color:#fff}
.opt .ck{font-weight:700}
.opts.empty .opt{opacity:.35}
.diebox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.diewrap{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffe7a0 0%,#f2b632 30%,transparent 68%);}
.die{width:70px;height:70px;border-radius:14px;background:linear-gradient(145deg,#fff,#dcdcdc);box-shadow:inset 0 -4px 0 #0002,0 6px 14px #0007;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px}
.die i{width:12px;height:12px;border-radius:50%;background:#1b1b1b;place-self:center;visibility:hidden}
.die.roll{animation:spin .55s}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(.85)}100%{transform:rotate(360deg) scale(1)}}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.setup{grid-template-columns:1fr}}
.box{padding:0 0 16px}
.box .in{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;gap:10px;align-items:center}
.prow input{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:2px solid var(--gold-dk);background:#0a1532;color:var(--ink);font-family:var(--ui);font-weight:600;font-size:19px}
.stops{display:flex;flex-wrap:wrap;gap:6px}
.stops span{font-family:var(--ui);font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px;background:#0a1532;border:1px solid var(--gold-dk);color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lead{font-size:15px;color:var(--muted);margin:0}

/* log */
.log{font-size:13px;color:var(--muted);max-height:120px;overflow:auto;display:flex;flex-direction:column;gap:3px;padding:10px 14px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,9,22,.7);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{max-width:500px;width:100%;padding:0 0 20px;max-height:calc(100vh - 40px);overflow:auto}
.card .in{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px}
.card .kind{display:flex;align-items:center;gap:12px}
.card .kind .badge{width:58px;flex:none}
.card .kind small{font-family:var(--ui);color:var(--gold2);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.fact{font-family:var(--display);font-style:italic;font-size:20px;margin:0;line-height:1.35}
.eff{font-family:var(--ui);font-weight:700;font-size:18px;color:var(--gold2);margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.rank{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-family:var(--ui);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--gold2);text-decoration:none;padding:6px 14px;border-radius:999px;border:2px solid var(--gold-dk);background:#0a1532}
.back:hover{border-color:var(--gold2)}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(h){const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function badge(k,bg){return `<span class="badge" style="background:radial-gradient(circle at 35% 30%,#fff5,transparent 55%),${bg}">${SVG[k]}</span>`}
function pawn(c){return `<svg class="pawn" viewBox="0 0 20 28"><ellipse cx="10" cy="25" rx="9" ry="3" fill="${c}"/><path d="M4 25c0-6 3-9 3-12h6c0 3 3 6 3 12z" fill="${c}"/><circle cx="10" cy="7" r="5" fill="${c}"/><circle cx="8.3" cy="5.4" r="1.6" fill="#fff8"/><path d="M7 13h6" stroke="#0003" stroke-width="2"/></svg>`}
function dieHTML(n){const on=PIPS[n]||[];return `<div class="die" id="die" aria-label="Dado: ${n||"sem valor"}">${Array.from({length:9},(_,i)=>`<i style="${on.includes(i)?"visibility:visible":""}"></i>`).join("")}</div>`}

function buildBoard(rk){
 const r=ROUTES[rk],b=new Array(L).fill(null),n=r.cidades.length;
 r.cidades.forEach((c,i)=>{b[Math.round(i*(L-1)/(n-1))]={t:"cidade",i,nome:c[0],fact:c[1]}});
 let pool=shuffle([].concat(Array(5).fill("oracao"),Array(4).fill("acao"),Array(4).fill("reflexao"),Array(2).fill("descanso"),Array(3).fill("bolha"),Array(3).fill("atalho"),Array(2).fill("companheiro")));
 for(let i=0;i<L;i++) if(!b[i]) b[i]={t:pool.pop()||"caminho"};
 return b;
}

function topBar(){
 const t=el(`<header class="top"><img class="logo" src="${LOGO}" alt="Rumo ao Céu, o jogo da peregrinação"><div class="topmid"><h2>Escolha a rota da peregrinação</h2><div class="routes"></div></div></header>`);
 const rs=t.querySelector(".routes");
 for(const k of Object.keys(ROUTES)){const r=ROUTES[k];
  const b=el(`<button class="rbtn" aria-pressed="${S.route===k}"><span class="ic">${SVG[r.ic]}</span><span><b>${r.l1}<br><span>${r.l2}</span></b><small>${r.sub}</small></span></button>`);
  b.onclick=()=>{if(S.screen==="game"&&k===S.route)return;S.route=k;S.screen="setup";render()};rs.appendChild(b)}
 return t;
}

function render(){

 app.appendChild(topBar());
 if(S.screen==="setup") renderSetup(app); else renderGame(app);
}

 p.querySelector("#add").onclick=()=>{if(S.players.length<4){S.players.push({n:"Jogador "+(S.players.length+1)});render()}};

function startGame(){
 const r=ROUTES[S.route];
 S.players=S.players.map((p,i)=>({n:(p.n||"").trim()||"Jogador "+(i+1),c:COLORS[i],pos:0,skip:false,gracas:0,stamps:[0]}));
 S.board=buildBoard(S.route);
 S.deck=shuffle(GERAIS.concat(r.perguntas,r.perguntas));
 S.cur=0;S.die=0;S.q=null;S.log=[`A peregrinação começa em ${r.cidades[0][0]}.`];S.busy=false;S.over=false;
 S.screen="game";render();
}

function cols(){const w=window.innerWidth;return w<520?6:w<720?7:w<1080?8:9}

function renderGame(app){
 const r=ROUTES[S.route],p=S.players[S.cur];
 const g=el(`<section class="game"><div class="c-pl"></div><div class="c-board"><div class="boardbox"><span class="flag a">Início</span><span class="flag b">Chegada</span><div class="board" id="board"></div></div></div><aside class="c-leg frame leg">${legend()}</aside><div class="c-bar frame"><div class="bar"></div></div></section>`);
 // players
 const pl=g.querySelector(".c-pl");
 S.players.forEach((x,i)=>pl.appendChild(el(`<div class="pcard ${i===S.cur&&!S.over?"on":""}" style="--pc:${x.c}"><span class="av">${esc(x.n[0]||"?").toUpperCase()}</span><span class="info"><span class="nm" style="display:block">${esc(x.n)}</span><span class="sc">${SVG.shell.replace('fill="currentColor"','fill="#f2b632"')} ${x.pos} casas · ${x.gracas} graça${x.gracas===1?"":"s"}</span>${x.skip?'<span class="st">DESCANSANDO</span>':""}</span></div>`)));
 pl.appendChild(el(`<div class="cred"><h3><span style="width:22px;height:22px;display:inline-block">${SVG.shell.replace('fill="currentColor"','fill="#f2b632"')}</span>Credencial do Peregrino</h3><div class="pages">${S.players.map(x=>`<div class="row"><b style="color:${x.c}">${esc(x.n)} · ${x.stamps.length}/${r.cidades.length}</b><div class="stamps" style="color:${x.c}">${r.cidades.map((c,ci)=>`<span class="stamp ${x.stamps.includes(ci)?"on":""}" title="${esc(c[0])}">${esc(c[0][0])}</span>`).join("")}</div></div>`).join("")}</div></div>`));
 pl.appendChild(el(`<div class="frame"><div class="ttl" style="font-size:17px">Diário do caminho</div><div class="log">${S.log.slice(-25).reverse().map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>`));
 // board
 const board=g.querySelector("#board"),C=cols();
 board.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;
 S.board.forEach((t,i)=>{
  const row=Math.floor(i/C),col=row%2?C-1-i%C:i%C, c=CASAS[t.t], isEnd=i===L-1, isStart=i===0;
  let inner,cls=t.t;
  if(t.t==="cidade"){cls+=isEnd?" fim":isStart?" inicio":"";inner=badge(isEnd?"cross":"pin",isEnd?"#b21f1f":"#22468f")+`<span class="lbl">${esc(t.nome)}</span>`}
  else if(c){inner=badge(c.ic,COR[t.t])}
  else inner=`<span class="badge">${SVG.dot}</span>`;
  const tile=el(`<div class="tile ${cls}" style="grid-row:${row+1};grid-column:${col+1}"><span class="n">${i}</span>${inner}<div class="tokens"></div></div>`);
  tile.title=t.t==="cidade"?t.nome:(c?c.nome+": "+c.efeito:"Caminho");
  S.players.forEach((x,pi)=>{if(x.pos===i){const tk=el(pawn(x.c));if(pi===S.cur)tk.classList.add("cur");tile.querySelector(".tokens").appendChild(tk)}});
  board.appendChild(tile);
 });
 // bar
 const bar=g.querySelector(".bar");
 const q=S.q;
 let qhtml,ohtml;
 if(S.over){qhtml=`<div class="qh">${SVG.cross} Peregrinação concluída</div><p>${esc(S.players.find(x=>x.pos>=L-1)?.n||"")} chegou a ${esc(r.meta)}!</p>`;ohtml=`<div class="opts" style="justify-content:center"><button class="gbtn" id="again" style="font-size:19px">Nova peregrinação</button></div>`}
 else if(!q){qhtml=`<div class="qh">${SVG.book} Pergunta</div><p>Vez de <span style="color:${p.c};filter:brightness(1.4)">${esc(p.n)}</span>. ${p.skip?"Está descansando no albergue nesta rodada.":"Tire uma pergunta para caminhar."}</p>`;
  ohtml=`<div class="opts empty">${["A","B","C","D"].map(k=>`<div class="opt"><span class="k">${k}</span><span class="tx">&nbsp;</span></div>`).join("")}</div>`}
 else{qhtml=`<div class="qh">${SVG.book} Pergunta para ${esc(p.n)}</div><p>${esc(q.q[0])}</p>${q.done?`<div class="verdict ${q.ok?"ok":"no"}">${q.ok?"Isso mesmo!":"Não foi dessa vez."}</div><div class="expl">${esc(q.q[3])}</div>`:""}`;
  ohtml=`<div class="opts">${q.order.map((oi,j)=>{let c="";if(q.done){if(oi===q.q[2])c="right";else if(oi===q.pick)c="wrong"}return `<button class="opt ${c}" data-i="${oi}" ${q.done?"disabled":""}><span class="k">${"ABCD"[j]}</span><span class="tx">${esc(q.q[1][oi])}</span>${c==="right"?'<span class="ck">✓</span>':""}</button>`}).join("")}</div>`}
 let btn;
 if(S.over) btn="";
 else if(!q) btn=`<button class="gbtn" id="act" ${S.busy?"disabled":""}>${p.skip?"Passar a vez":"Tirar<br>pergunta"} <span class="tri"></span></button>`;
 else if(!q.done) btn=`<button class="gbtn" disabled>Responda <span class="tri"></span></button>`;
 else btn=`<button class="gbtn" id="act" ${S.busy?"disabled":""}>${q.ok?"Jogar<br>o dado":"Passo<br>de fé"} <span class="tri"></span></button>`;
 bar.appendChild(el(`<div class="qbox">${qhtml}</div>`));
 bar.appendChild(el(ohtml));
 bar.appendChild(el(`<div class="diebox"><div class="diewrap">${dieHTML(S.die)}</div>${btn}</div>`));
 app.appendChild(g);

 g.querySelectorAll(".opt[data-i]").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 const act=document.getElementById("act"); if(act) act.onclick=action;
 const ag=document.getElementById("again"); if(ag) ag.onclick=()=>{S.players=S.players.map(x=>({n:x.n}));S.screen="setup";render()};
}

function log(t){S.log.push(t)}
function action(){
 const p=S.players[S.cur],q=S.q;
 if(!q){
  if(p.skip){p.skip=false;log(`${p.n} descansou no albergue.`);return nextPlayer()}
  if(!S.deck.length) S.deck=shuffle(GERAIS.concat(ROUTES[S.route].perguntas));
  S.q={q:S.deck.pop(),order:shuffle([0,1,2,3]),done:false};render();
  const f=document.querySelector(".opt[data-i]");if(f)f.focus();return;
 }
 if(q.done){
  S.q=null;
  if(q.ok){const d=1+Math.floor(Math.random()*6);S.die=d;log(`${p.n} acertou e tirou ${d}.`);render();const de=document.getElementById("die");if(de)de.classList.add("roll");S.busy=true;setTimeout(()=>move(p,d,land),560)}
  else{S.die=1;log(`${p.n} errou e deu um passo de fé.`);move(p,1,land)}
 }
}
function answer(i){const q=S.q;if(!q||q.done)return;q.done=true;q.pick=i;q.ok=i===q.q[2];render();const a=document.getElementById("act");if(a)a.focus()}

function move(p,steps,cb){
 S.busy=true;const dir=steps<0?-1:1;let left=Math.abs(steps);
 const tick=()=>{if(left===0||(dir>0&&p.pos>=L-1)||(dir<0&&p.pos<=0)){S.busy=false;render();cb&&cb();return}
  p.pos+=dir;left--;render();setTimeout(tick,230)};
 tick();
}
function stampCity(p){const t=S.board[p.pos];if(t.t==="cidade"&&!p.stamps.includes(t.i)){p.stamps.push(t.i);return true}return false}

function modal(html){closeModal();const o=el(`<div class="overlay" id="ov"><div class="card frame" role="dialog" aria-modal="true">${html}</div></div>`);document.body.appendChild(o);const f=o.querySelector("button");if(f)f.focus();return o}
function closeModal(){const o=document.getElementById("ov");if(o)o.remove()}

function land(){
 const p=S.players[S.cur],t=S.board[p.pos];
 if(p.pos>=L-1){stampCity(p);return finish(p)}
 if(t.t==="cidade"){
  const novo=stampCity(p);
  modal(`<div class="ttl">${novo?"Carimbo na credencial":"Cidade já carimbada"}</div><div class="in"><div class="kind">${badge("pin","#22468f")}<div><small>${esc(p.n)} chegou a</small><h3>${esc(t.nome)}</h3></div></div><p class="fact">${esc(t.fact)}</p><div class="actions"><button class="gbtn" id="ok" style="font-size:19px">Seguir caminho <span class="tri"></span></button></div></div>`);
  document.getElementById("ok").onclick=()=>{closeModal();log(`${p.n} chegou a ${t.nome}.`);nextPlayer()};return;
 }
 const c=CASAS[t.t];
 if(!c) return nextPlayer();
 const txt=c.cards[Math.floor(Math.random()*c.cards.length)];
 modal(`<div class="ttl">${c.grupo==="esp"?"Casa especial":"Imprevisto"}</div><div class="in"><div class="kind">${badge(c.ic,COR[t.t])}<div><small>${esc(p.n)} caiu em</small><h3>${c.nome}</h3></div></div><p class="fact">${esc(txt)}</p><p class="eff">${c.efeito}</p><div class="actions"><button class="gbtn" id="ok" style="font-size:19px">${c.bt} <span class="tri"></span></button></div></div>`);
 document.getElementById("ok").onclick=()=>{closeModal();applyEffect(p,t.t)};
}

function applyEffect(p,k){
 const after=()=>{const w=S.players.find(x=>x.pos>=L-1);if(w){stampCity(w);return finish(w)}stampCity(p);nextPlayer()};
 if(k==="oracao"){log(`${p.n} rezou e avançou 1.`);move(p,1,after)}
 else if(k==="acao"||k==="reflexao"){p.gracas++;log(`${p.n} ganhou 1 graça.`);nextPlayer()}
 else if(k==="descanso"){p.skip=true;log(`${p.n} vai descansar no albergue.`);nextPlayer()}
 else if(k==="bolha"){log(`${p.n} voltou 2 casas.`);move(p,-2,after)}
 else if(k==="atalho"){log(`${p.n} avançou 2 casas.`);move(p,2,after)}
 else if(k==="companheiro"){S.players.forEach(o=>{if(o!==p&&o.pos<L-1){o.pos++;stampCity(o)}});log(`${p.n} partilhou: os outros avançaram 1.`);after()}
 else nextPlayer();
}
function nextPlayer(){if(S.over)return;S.cur=(S.cur+1)%S.players.length;render()}

function finish(w){
 S.over=true;S.cur=S.players.indexOf(w);render();const r=ROUTES[S.route];
 const rank=S.players.slice().sort((a,b)=>b.pos-a.pos||b.gracas-a.gracas);
 log(`${w.n} chegou a ${r.meta}!`);
 modal(`<div class="ttl">Chegada</div><div class="in"><div class="kind">${badge("cross","#b21f1f")}<div><small>Peregrinação concluída</small><h3>${esc(w.n)} chegou a ${esc(r.meta)}!</h3></div></div><p class="fact">${S.route==="santiago"?"Abraço no apóstolo e Compostela na mão. Buen Camino!":"Aos pés da Mãe Aparecida, o romeiro agradece cada passo."}</p>
  <div class="rank">${rank.map((x,i)=>`<div class="pcard" style="--pc:${x.c}"><span class="av">${i+1}</span><span class="info"><span class="nm" style="display:block">${esc(x.n)}</span><span class="sc">${x.stamps.length} carimbos · ${x.gracas} graças</span></span></div>`).join("")}</div>
  <p style="margin:0;color:var(--muted)">Na peregrinação ninguém perde: esperem juntos os últimos chegarem e rezem uma Salve-Rainha em ação de graças.</p>
  <div class="actions"><button class="obtn" id="ver">Ver tabuleiro</button><button class="gbtn" id="again2" style="font-size:19px">Nova peregrinação</button></div></div>`);
 document.getElementById("ver").onclick=closeModal;
 document.getElementById("again2").onclick=()=>{closeModal();S.players=S.players.map(x=>({n:x.n}));S.screen="setup";render()};
}

let rz,lastC=0;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.screen==="game"&&cols()!==lastC){lastC=cols();render()}},150)});
render();
</script>

</body>
</html>
