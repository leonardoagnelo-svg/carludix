<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rumo ao Céu</title>
<meta name="description" content="Rumo ao Céu: tabuleiro de peregrinação a Santiago ou Aparecida. Avance respondendo perguntas, rezando e partilhando.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,700;0,800;1,700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: game console — compact header, players left, board with a drawn trail in the middle, special squares right, question bar pinned under the board. Deliberately single dark theme (night-blue with gold frames). */
:root{
  color-scheme:dark;
  --night:#0b1733; --panel:#0f1f42; --panel2:#182d5c; --deep:#0a1532;
  --gold:#f2b632; --gold2:#ffd970; --gold-dk:#a8730f; --ink:#f4f1e8; --muted:#b9c3d9;
  --parch:#efe2c2; --parch-ink:#3b2a14;
  --t-oracao:#8e5bd6; --t-acao:#e0612f; --t-reflexao:#2d8fd6; --t-companheiro:#e6a21f;
  --t-descanso:#c23b2e; --t-bolha:#c23b2e; --t-atalho:#1fa58b; --city:#22468f;
  --display:"Alegreya",Georgia,serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 600px at 50% -10%,#1d3a78 0%,transparent 60%),var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app{display:flex;flex-direction:column;gap:14px}

.frame{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:18px;position:relative;
  box-shadow:0 0 0 2px var(--gold-dk),0 0 0 4px #000a,0 0 0 5px var(--gold),0 10px 30px rgba(0,0,0,.45)}
.ttl{font-family:var(--ui);font-weight:700;font-size:21px;letter-spacing:.02em;text-align:center;padding:6px 10px;border-bottom:2px solid var(--gold-dk);background:linear-gradient(180deg,#0a1532,#14295a);border-radius:16px 16px 0 0}
.ttl.mid{border-radius:0;border-top:2px solid var(--gold-dk)}
.ttl .step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3a2404;font-size:17px;margin-right:8px;vertical-align:2px}
.gbtn{font-family:var(--ui);font-weight:700;color:#3a2404;border:0;border-radius:16px;padding:12px 22px;font-size:22px;line-height:1.05;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#d48a10);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 2px #7a4f08,0 6px 18px rgba(242,182,50,.35);display:inline-flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.gbtn:hover:not(:disabled){filter:brightness(1.08)}
.gbtn:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.gbtn.sm{font-size:18px;padding:10px 18px}
.tri{width:0;height:0;border-left:13px solid #3a2404;border-top:8px solid transparent;border-bottom:8px solid transparent;flex:none}
.obtn{font-family:var(--ui);font-weight:600;font-size:17px;background:var(--deep);border:2px solid var(--gold-dk);border-radius:12px;padding:8px 14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.obtn:hover{border-color:var(--gold)}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--deep);border:2px solid var(--gold-dk);display:grid;place-items:center;color:var(--gold2);font-family:var(--ui);font-weight:700;font-size:20px;flex:none}
.ibtn:hover{border-color:var(--gold2)}
.ibtn svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--gold2);text-decoration:none;padding:6px 14px;border-radius:999px;border:2px solid var(--gold-dk);background:var(--deep);white-space:nowrap}
.back:hover{border-color:var(--gold2)}

/* setup header */
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero .logo{width:clamp(130px,16vw,200px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.hero .txt{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.hero h1{margin:0;font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(22px,3vw,34px);line-height:1.1;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.resume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--deep);box-shadow:0 0 0 2px var(--gold)}
.resume span{font-family:var(--ui);font-size:18px;font-weight:600;flex:1;min-width:180px}

/* compact game header */
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gtop .logo{width:58px;height:58px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.rtag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--deep);box-shadow:0 0 0 2px var(--gold-dk);font-family:var(--ui);font-weight:700;font-size:18px}
.rtag svg{width:28px;height:28px}
.rtag small{font-weight:500;color:var(--muted);font-size:14px}
.gtop .sp{flex:1}
.gtop .tools{display:flex;gap:8px;align-items:center}
@media (max-width:720px){.gtop{gap:8px}.gtop .logo{width:44px;height:44px}.gtop .rtag{order:5;width:100%;justify-content:center}.gtop .sp{display:none}.gtop .tools{margin-left:auto}.gtop .obtn{font-size:15px;padding:6px 10px}}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.box .in{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:linear-gradient(180deg,#14295a,var(--deep));box-shadow:0 0 0 2px var(--gold-dk);border:0;text-align:left}
.rcard[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold2),0 0 22px rgba(242,182,50,.45)}
.rcard .h{display:flex;align-items:center;gap:10px}
.rcard .h svg{width:42px;height:42px;flex:none}
.rcard b{display:block;font-family:var(--ui);font-weight:700;font-size:21px;line-height:1}
.rcard b span{color:var(--gold2);font-size:25px}
.rcard small{color:var(--muted);font-size:13px}
.rcard .stops{display:flex;flex-wrap:wrap;gap:4px}
.rcard .stops span{font-family:var(--ui);font-weight:600;font-size:13px;padding:1px 8px;border-radius:999px;background:#0006;border:1px solid #a8730f88;color:var(--muted)}
.rcard .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--gold-dk);display:grid;place-items:center;color:#3a2404;font-weight:800;flex:none}
.rcard[aria-pressed="true"] .chk{background:var(--gold);border-color:var(--gold2)}
.sub{font-family:var(--ui);font-weight:700;font-size:19px;color:var(--gold2);margin:0}
.prow{display:flex;gap:10px;align-items:center}
.prow input{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:2px solid var(--gold-dk);background:var(--deep);color:var(--ink);font-family:var(--ui);font-weight:600;font-size:19px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:radial-gradient(circle at 35% 30%,#fff6,transparent 60%),var(--pc);border:3px solid var(--gold);color:#fff;text-shadow:0 1px 2px #0008;padding:0}
button.av:hover{border-color:var(--gold2)}
.hint{font-size:13px;color:var(--muted);margin:0}
.rowbtns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.how{display:flex;flex-direction:column;gap:10px}
.how2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

/* game grid */
.game{display:grid;grid-template-columns:230px minmax(0,1fr) 240px;grid-template-areas:"pl board leg" "pl bar leg";gap:16px;align-items:start}
.c-pl{grid-area:pl;display:flex;flex-direction:column;gap:12px}
.c-board{grid-area:board;min-width:0}
.c-leg{grid-area:leg}
.c-bar{grid-area:bar;min-width:0}
@media (min-width:721px){.c-bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5}}
@media (max-width:1080px){.game{grid-template-columns:minmax(0,1fr) 230px;grid-template-areas:"board leg" "bar bar" "pl pl"}.c-pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
@media (max-width:720px){.game{grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "bar" "pl"}.c-leg.leg{display:none}.gtop .rtag small{display:none}}

.pcard{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:linear-gradient(90deg,var(--pc),var(--deep) 85%);box-shadow:0 0 0 2px var(--gold-dk),0 4px 12px rgba(0,0,0,.4)}
.pcard.on{box-shadow:0 0 0 3px var(--gold2),0 0 18px rgba(242,182,50,.5)}
.pcard .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.pcard .nm{font-family:var(--ui);font-weight:700;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:#0008;font-family:var(--ui);font-weight:600;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip svg{width:13px;height:13px}
.chip.warn{background:var(--t-descanso)}

.cred{border-radius:14px;padding:14px;background:linear-gradient(135deg,#6b3f1d,#4a2a12);box-shadow:0 0 0 2px #2b1709,0 8px 20px rgba(0,0,0,.5)}
.cred h3{margin:0 0 8px;font-family:var(--display);font-style:italic;font-weight:700;font-size:19px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.cred h3 svg{width:22px;height:22px}
.cred .pages{background:var(--parch);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;color:var(--parch-ink)}
.cred .row{display:flex;flex-direction:column;gap:4px}
.cred .row b{font-family:var(--ui);font-size:15px}
.cred .tip{font-size:12px;color:#7a6a4a;margin:0}
.stamps{display:flex;flex-wrap:wrap;gap:4px}
.stamp{width:24px;height:24px;border-radius:50%;border:1.5px dashed #a8946b;display:grid;place-items:center;font-size:11px;font-family:var(--ui);font-weight:700;color:#a8946b;background:none;padding:0}
.stamp svg{width:14px;height:14px}
.stamp.on{border:2px solid currentColor;transform:rotate(-10deg);background:rgba(255,255,255,.4)}
.stamp.new{animation:stampIn .7s ease-out}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
.log{font-size:13px;color:var(--muted);max-height:120px;overflow:auto;display:flex;flex-direction:column;gap:3px;padding:10px 14px}

/* board */
.boardbox{padding:0 16px 20px;border-radius:18px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 30% 40%,#6fa35a 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,#5d9450 0%,transparent 50%),linear-gradient(180deg,#5f8f4c 0%,#4f8044 50%,#43733d 100%);
  box-shadow:0 0 0 2px var(--gold-dk),0 0 0 4px #000a,0 0 0 5px var(--gold),0 10px 30px rgba(0,0,0,.45)}
.horizon{display:block;width:calc(100% + 32px);height:clamp(64px,9vw,96px);margin:0 -16px}
@media (max-width:720px){.boardbox{padding:0 10px 14px}.horizon{width:calc(100% + 20px);margin:0 -10px}}
.board{display:grid;gap:26px 12px;position:relative;margin-top:14px}
@media (max-width:720px){.board{gap:18px 6px;margin-top:10px}}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.tile{position:relative;z-index:1;aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;text-align:center;min-width:0;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,#fffaf0 0%,transparent 45%),linear-gradient(160deg,#f6ecd2,var(--parch) 50%,#d6bf8e);border:2px solid #8d6d3c;box-shadow:inset 0 -4px 0 #b49c6a,inset 0 2px 0 #fff8,0 4px 0 #5e4521,0 7px 10px rgba(0,0,0,.4);border-radius:14px}
.tile:hover{filter:brightness(1.05)}
.tile .n{position:absolute;top:2px;left:5px;font-size:10px;color:#8b7650;font-family:var(--ui);font-weight:600}
.badge{width:60%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 2px 0 #fff6,inset 0 -2px 0 #0003,0 1px 2px #0005;flex:none}
.badge svg{width:62%;height:62%}
.tile .lbl{font-family:var(--ui);font-weight:700;font-size:clamp(8px,1vw,12px);line-height:1;color:#3a2404;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.caminho .badge{background:transparent;box-shadow:none;color:#a48d5f}
.tile.cidade{background:linear-gradient(160deg,#fff2c4,#f3cf6a 60%,#c99627);box-shadow:inset 0 -3px 0 #9a6c12,inset 0 2px 0 #fff9,0 3px 0 #5c3e06,0 0 0 2px var(--gold2),0 6px 12px rgba(0,0,0,.45)}
.tile.fim{background:linear-gradient(160deg,#ffe28a,var(--gold) 60%,#b8770c)}
.tile.cur{box-shadow:inset 0 -3px 0 #b49c6a,0 0 0 4px var(--pc),0 0 18px 4px var(--pc)}
.ribbon{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-family:var(--ui);font-weight:700;font-size:clamp(9px,1vw,12px);letter-spacing:.06em;color:#fff;padding:1px 8px;border-radius:5px;background:linear-gradient(180deg,#d33b2b,#9c1f16);box-shadow:0 0 0 1.5px var(--gold),0 2px 4px #0007;white-space:nowrap;z-index:2}
.tokens{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:1px;padding-bottom:6%;pointer-events:none}
.pawn{width:clamp(12px,1.9vw,22px);height:clamp(16px,2.6vw,30px);filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.pawn.cur{transform:translateY(-4px) scale(1.15)}
.pawn.hop{animation:hop .23s ease-out}
@keyframes hop{0%{transform:translateY(-14px) scale(1.15)}100%{transform:translateY(-4px) scale(1.15)}}

.leg{display:flex;flex-direction:column}
.leg .sec{padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.li{display:flex;gap:10px;align-items:center}
.li .badge{width:40px}
.li b{font-family:var(--ui);font-weight:700;font-size:17px;display:block;line-height:1.05}
.li small{color:var(--muted);font-size:13px;line-height:1.2;display:block}

/* bar */
.bar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px}
@media (max-width:900px){.bar{grid-template-columns:1fr}}
.qbox{border-radius:14px;padding:10px 14px;background:var(--deep);box-shadow:0 0 0 2px var(--gold-dk);min-height:96px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.qh{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-weight:700;font-size:19px;color:var(--gold2)}
.qh svg{width:22px;height:22px;flex:none}
.qbox p{margin:0;font-family:var(--ui);font-weight:600;font-size:clamp(17px,1.6vw,21px);line-height:1.2;text-wrap:balance}
.qbox .expl{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.verdict{font-family:var(--ui);font-weight:700;font-size:18px}
.verdict.ok{color:#6fe39b}.verdict.no{color:#ff8a7d}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:6px 14px 6px 8px;border-radius:999px;border:2px solid var(--gold-dk);background:linear-gradient(180deg,#14295a,var(--deep));font-family:var(--ui);font-weight:600;font-size:17px;min-height:36px}
.opt .k{width:24px;text-align:center;font-weight:700;color:var(--gold2);flex:none}
.opt .tx{flex:1;min-width:0}
.opt:hover:not(:disabled){border-color:var(--gold2)}
.opt:disabled{cursor:default}
.opt.right{background:linear-gradient(180deg,#3fc172,#1f8a48);border-color:#bff2cf}
.opt.right .k{color:#fff}
.opt.wrong{background:linear-gradient(180deg,#e0594b,#a62a20);border-color:#ffc4bc}
.opt.wrong .k{color:#fff}
.opts.empty .opt{opacity:.3}
.diebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.diewrap{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffe7a0 0%,#f2b632 30%,transparent 68%)}
.die{width:66px;height:66px;border-radius:14px;background:linear-gradient(145deg,#fff,#dcdcdc);box-shadow:inset 0 -4px 0 #0002,0 6px 14px #0007;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;position:relative}
.die i{width:11px;height:11px;border-radius:50%;background:#1b1b1b;place-self:center;visibility:hidden}
.die.idle{opacity:.55}
.die .qm{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;color:#8a8a8a}
.die.roll{animation:spin .55s}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(.85)}100%{transform:rotate(360deg) scale(1)}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,9,22,.72);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{max-width:500px;width:100%;padding:0 0 20px;max-height:calc(100vh - 40px);overflow:auto}
.card .in{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px}
.kind{display:flex;align-items:center;gap:12px}
.kind .badge{width:58px}
.kind small{font-family:var(--ui);color:var(--gold2);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;text-wrap:balance}
.fact{font-family:var(--display);font-style:italic;font-size:20px;margin:0;line-height:1.35}
.eff{font-family:var(--ui);font-weight:700;font-size:18px;color:var(--gold2);margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.rank{display:flex;flex-direction:column;gap:6px}
.turncard{text-align:center;align-items:center}
.turncard .av{width:84px;height:84px;font-size:40px;border-width:4px}
.turncard h3{font-size:34px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* robô, online */
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--deep);box-shadow:0 0 0 2px var(--gold-dk)}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:9px 10px;background:none;font-family:var(--ui);font-weight:700;font-size:18px;color:var(--muted)}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3a2404}
.sub .step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#3a2404;font-size:15px;margin-right:6px}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{flex-wrap:wrap}
.prow input{min-width:120px}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--gold-dk);flex:none}
.seg button{border:0;background:var(--deep);padding:8px 10px;font-family:var(--ui);font-weight:600;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#3a2404}
select{font-family:var(--ui);font-weight:600;font-size:15px;background:var(--deep);color:var(--ink);border:2px solid var(--gold-dk);border-radius:10px;padding:7px 8px}
.xbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold-dk);background:var(--deep);font-size:20px;line-height:1;color:var(--muted);flex:none}
.xbtn:hover{border-color:#ff8a7d;color:#ff8a7d}
.obtn:disabled{opacity:.45;cursor:default}
.obtn svg{width:16px;height:16px}
.avi{display:grid;place-items:center;width:62%;height:62%}.avi svg{width:100%;height:100%}
.errmsg{margin:0;color:#ff9d92;font-weight:600}
.online{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-family:var(--ui);font-weight:600;color:var(--muted)}
.fld input,.joinrow input,.linkrow input{padding:10px 14px;border-radius:12px;border:2px solid var(--gold-dk);background:var(--deep);color:var(--ink);font-family:var(--ui);font-weight:600;font-size:19px;min-width:0}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ocard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--deep);box-shadow:0 0 0 2px var(--gold-dk);align-items:flex-start}
.ocard b{font-family:var(--ui);font-size:20px}
.ocard small{color:var(--muted);font-size:13px;flex:1}
.joinrow{display:flex;gap:8px;width:100%}
.joinrow input{flex:1;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:22px}
.codebox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:14px;background:var(--deep);box-shadow:0 0 0 2px var(--gold)}
.codebox small{color:var(--muted)}
.codebox b{font-family:var(--display);font-size:52px;letter-spacing:.18em;color:var(--gold2);line-height:1}
.linkrow{display:flex;gap:8px;width:100%}
.linkrow input{flex:1;font-size:14px}
.prow.lobby{padding:6px 10px 6px 6px;border-radius:999px;background:var(--deep);box-shadow:0 0 0 2px var(--gold-dk);flex-wrap:nowrap}
.prow.lobby.empty{opacity:.45;box-shadow:0 0 0 2px #33415f}
.pname{flex:1;min-width:0;font-family:var(--ui);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.you{background:var(--gold);color:#3a2404}
.conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:600;font-size:14px;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--deep)}
.conn i{width:10px;height:10px;border-radius:50%;background:#e2a33b}
.conn.on i{background:#4cd07d}.conn.erro i,.conn.off i{background:#e2564a}
@media (max-width:520px){.conn span{display:none}}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--gold);animation:sp 1s linear infinite;flex:none}
.spin.sm{width:18px;height:18px;border-width:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.waitbig{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px;text-align:center}
.waitline{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--ui);font-weight:600;font-size:17px}
.waitline svg{width:22px;height:22px;color:var(--gold2);flex:none}
.waitbtn{display:flex;align-items:center;gap:8px;max-width:180px;padding:10px 14px;border-radius:14px;background:var(--deep);box-shadow:0 0 0 2px var(--gold-dk);font-family:var(--ui);font-weight:600;font-size:16px;color:var(--muted)}
.waitbtn svg{width:22px;height:22px;color:var(--gold2);flex:none}
.ptag{color:#fff;padding:0 8px;border-radius:6px;text-shadow:0 1px 2px #0006}
.qh{flex-wrap:wrap}
.cat{align-self:flex-start;font-size:12px;font-family:var(--ui);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:1px 8px;border-radius:999px;border:1px solid #a8730f88}
.overlay.info{z-index:30}
.chip svg{width:13px;height:13px}

.tokens{inset:auto -4px auto auto;top:-14px;right:-4px;padding:0;align-items:flex-end;justify-content:flex-end;gap:0;z-index:3}
.tokens .pawn+.pawn{margin-left:-6px}
</style>

function dieHTML(n,roll){const on=PIPS[n]||[];return `<div class="die ${n?"":"idle"} ${roll?"roll":""}" id="die" aria-label="Dado: ${n||"ainda não lançado"}">${Array.from({length:9},(_,i)=>`<i style="${on.includes(i)?"visibility:visible":""}"></i>`).join("")}${n?"":'<span class="qm">?</span>'}</div>`}

/* ---------- som ---------- */
let actx=null;
function beep(f,d,type,vol){if(!SOM)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const SONS={step:()=>beep(520,.08,"triangle",.06),bell:()=>{beep(880,.9,"sine",.09);setTimeout(()=>beep(1320,.7,"sine",.05),90)},ok:()=>{beep(660,.15);setTimeout(()=>beep(880,.25),120)},no:()=>beep(220,.3,"sawtooth",.04),roll:()=>beep(300,.3,"square",.03),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.5,"sine",.08),i*160))};
function ev(k){S.ev={n:((S.ev&&S.ev.n)||0)+1,k}}

/* ---------- rede (MQTT, dois brokers em paralelo) ---------- */
const net={cl:[],seen:new Set(),base:"",onMsg:null,onUp:null};
function loadMqtt(){return new Promise((res,rej)=>{if(window.mqtt)return res();const s=document.createElement("script");s.src=MQTT_LIB;s.onload=res;s.onerror=()=>rej(new Error("lib"));document.head.appendChild(s)})}
async function netStart(code,subs,onMsg,onUp){
 netStop();net.base="carludix/rumo-ao-ceu/"+code+"/";net.onMsg=onMsg;net.onUp=onUp;UI.conn="connecting";
 try{await loadMqtt()}catch(e){UI.conn="erro";render();return}
 BROKERS.forEach(url=>{let c;try{c=mqtt.connect(url,{clientId:"rac_"+rid(10),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30})}catch(e){return}
  net.cl.push(c);
  c.on("connect",()=>{c.subscribe(subs.map(s=>net.base+s));connUpd();net.onUp&&net.onUp()});
  c.on("close",connUpd);c.on("offline",connUpd);c.on("error",connUpd);
  c.on("message",(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}if(!m||!m.mid||net.seen.has(m.mid))return;net.seen.add(m.mid);net.onMsg&&net.onMsg(t.slice(net.base.length),m)});
 });
 setTimeout(()=>{if(UI.conn==="connecting"){UI.conn="erro";render()}},12000);
}
function connUpd(){const up=net.cl.some(c=>c.connected);const was=UI.conn;UI.conn=up?"on":(net.cl.length?(was==="on"?"reconnecting":"connecting"):"off");if(was!==UI.conn)renderConn()}
function netStop(){net.cl.forEach(c=>{try{c.end(true)}catch(e){}});net.cl=[];UI.conn="off"}
function pub(sub,obj,retain){obj.mid=rid(12);const s=JSON.stringify(obj);net.cl.forEach(c=>{if(c.connected)try{c.publish(net.base+sub,s,{qos:0,retain:!!retain})}catch(e){}})}
function renderConn(){const d=document.getElementById("conn");if(d){d.className="conn "+UI.conn;d.title=connTxt();d.querySelector("span").textContent=connTxt()}}
function connTxt(){return {on:"Conectado",connecting:"Conectando…",reconnecting:"Reconectando…",erro:"Sem conexão",off:"Offline"}[UI.conn]}
function shareLink(){return location.origin+location.pathname+"?sala="+UI.code}

 if(S.stage!=="game"||S.over){lsSet(KEY,null);return}
 lsSet(KEY,JSON.stringify({S,mode:UI.mode,code:UI.code}));

/* ---------- motor ---------- */
function buildBoard(rk){
 const r=ROUTES[rk],b=new Array(L).fill(null),n=r.cidades.length;
 r.cidades.forEach((c,i)=>{b[Math.round(i*(L-1)/(n-1))]={t:"cidade",i,nome:c[0],fact:c[1]}});
 let pool=shuffle([].concat(Array(5).fill("oracao"),Array(4).fill("acao"),Array(4).fill("reflexao"),Array(2).fill("descanso"),Array(3).fill("bolha"),Array(3).fill("atalho"),Array(2).fill("companheiro")));
 for(let i=0;i<L;i++) if(!b[i]) b[i]={t:pool.pop()||"caminho"};
 return b;
}
function newGame(players){
 const r=ROUTES[S.route];
 S.stage="game";
 S.players=players.map((p,i)=>({id:p.id,kind:p.kind,nivel:p.nivel,n:(p.n||"").trim()||(p.kind==="robo"?ROBOS[i]:"Jogador "+(i+1)),c:p.c,pos:0,skip:false,gracas:0,stamps:[0]}));
 S.board=buildBoard(S.route);S.deck=shuffle(GERAIS.concat(r.perguntas,r.perguntas));
 S.cur=0;S.die=0;S.q=null;S.card=null;S.over=false;S.winner=-1;S.moving=-1;S.fresh=null;S.rolling=false;
 S.log=[`A peregrinação começa em ${r.cidades[0][0]}.`];
 UI.overSeen=false;
 beginTurn(true);
}
function humansLocal(){return S.players.filter(p=>p.kind==="humano").length}
function beginTurn(first){
 const p=S.players[S.cur];S.q=null;S.card=null;S.die=0;
 if(p.skip){S.phase="rest"}
 else if(UI.mode==="local"&&p.kind==="humano"&&humansLocal()>1){S.phase="handoff";S.first=!!first}
 else S.phase="turn";
 commit();
}
function act(a,v){ /* chamado pela interface deste aparelho */
 if(UI.mode==="guest"){pub("host",{t:"act",id:UI.myId,a,v});return}
 if(!canAct())return;engine(a,v);
}
function engine(a,v){
 if(S.stage!=="game"||S.over)return;
 const p=S.players[S.cur];
 if(a==="draw"&&(S.phase==="turn"||S.phase==="handoff")){
  if(!S.deck.length)S.deck=shuffle(GERAIS.concat(ROUTES[S.route].perguntas));
  S.q={q:S.deck.pop(),order:shuffle([0,1,2,3]),done:false};S.phase="question";commit();
 } else if(a==="answer"&&S.phase==="question"){
  const q=S.q;q.done=true;q.pick=v;q.ok=v===q.q[2];S.phase="answered";ev(q.ok?"ok":"no");commit();
 } else if(a==="go"&&S.phase==="answered"){
  const q=S.q;S.q=null;
  if(q.ok){const d=1+Math.floor(Math.random()*6);S.die=d;S.rolling=true;S.phase="moving";S.log.push(`${p.n} acertou e tirou ${d}.`);ev("roll");commit();setTimeout(()=>{S.rolling=false;move(S.cur,d,land)},650)}
  else{S.die=1;S.phase="moving";S.log.push(`${p.n} errou e deu um passo de fé.`);commit();move(S.cur,1,land)}
 } else if(a==="ack"){
  if(S.phase==="city"){S.log.push(`${p.n} chegou a ${S.board[p.pos].nome}.`);endTurn()}
  else if(S.phase==="card"){const k=S.card.k;S.card=null;applyEffect(S.cur,k)}
  else if(S.phase==="rest"){p.skip=false;S.log.push(`${p.n} descansou no albergue.`);endTurn()}
  else if(S.phase==="handoff"){engine("draw")}
 }
}
function move(pi,steps,cb){
 const p=S.players[pi];S.phase="moving";const dir=steps<0?-1:1;let left=Math.abs(steps);
 const tick=()=>{if(left===0||(dir>0&&p.pos>=L-1)||(dir<0&&p.pos<=0)){S.moving=-1;cb&&cb();return}
  p.pos+=dir;left--;S.moving=pi;ev("step");commit();setTimeout(tick,280)};
 tick();
}
function stampCity(p){const t=S.board[p.pos];if(t.t==="cidade"&&!p.stamps.includes(t.i)){p.stamps.push(t.i);S.fresh={p:S.players.indexOf(p),c:t.i};return true}return false}
function land(){
 const p=S.players[S.cur],t=S.board[p.pos];
 if(p.pos>=L-1){stampCity(p);return finish(S.cur)}
 if(t.t==="cidade"){const novo=stampCity(p);S.card={city:t.i,novo};S.phase="city";if(novo)ev("bell");commit();return}
 const c=CASAS[t.t];
 if(!c)return endTurn();
 S.card={k:t.t,txt:c.cards[Math.floor(Math.random()*c.cards.length)]};S.phase="card";commit();
}
function applyEffect(pi,k){
 const p=S.players[pi];
 const after=()=>{const w=S.players.findIndex(x=>x.pos>=L-1);if(w>=0){stampCity(S.players[w]);return finish(w)}if(stampCity(p))ev("bell");endTurn()};
 if(k==="oracao"){S.log.push(`${p.n} rezou e avançou 1.`);move(pi,1,after)}
 else if(k==="acao"||k==="reflexao"){p.gracas++;S.log.push(`${p.n} ganhou 1 graça.`);endTurn()}
 else if(k==="descanso"){p.skip=true;S.log.push(`${p.n} vai descansar no albergue.`);endTurn()}
 else if(k==="bolha"){S.log.push(`${p.n} voltou 2 casas.`);move(pi,-2,after)}
 else if(k==="atalho"){S.log.push(`${p.n} avançou 2 casas.`);move(pi,2,after)}
 else if(k==="companheiro"){S.players.forEach(o=>{if(o!==p&&o.pos<L-1){o.pos++;stampCity(o)}});S.log.push(`${p.n} partilhou: os outros avançaram 1.`);after()}
 else endTurn();
}
function endTurn(){if(S.over)return;S.cur=(S.cur+1)%S.players.length;S.fresh=null;beginTurn(false)}
function finish(w){S.over=true;S.winner=w;S.phase="over";S.moving=-1;S.log.push(`${S.players[w].n} chegou a ${ROUTES[S.route].meta}!`);ev("win");commit()}

/* robô */
function scheduleBot(){
 clearTimeout(botT);
 if(UI.mode==="guest"||S.stage!=="game"||S.over)return;
 const p=S.players[S.cur];if(!p||p.kind!=="robo")return;
 const ph=S.phase,d={turn:900,question:1800,answered:1000,card:2600,city:2600,rest:2000}[ph];
 if(d==null)return;
 botT=setTimeout(()=>{
  if(S.players[S.cur]!==p||S.phase!==ph)return;
  if(ph==="turn")engine("draw");
  else if(ph==="question"){const ok=Math.random()<NIVEIS[p.nivel||"medio"].p;const wrong=[0,1,2,3].filter(i=>i!==S.q.q[2]);engine("answer",ok?S.q.q[2]:wrong[Math.floor(Math.random()*3)])}
  else if(ph==="answered")engine("go");
  else engine("ack");
 },d);
}

/* quem pode agir neste aparelho */
function canAct(){
 if(S.stage!=="game"||S.over)return false;
 const p=S.players[S.cur];if(!p)return false;
 if(UI.mode==="local")return p.kind==="humano";
 return p.id===UI.myId;
}

/* aplica mudança: desenha, salva, transmite, agenda robô */
function commit(){
 if(UI.mode==="guest")return;
 if(UI.mode==="host")pub("state",{t:"state",s:view()},true);
 render();save();scheduleBot();
}
function view(){const v=Object.assign({},S);delete v.deck;return v}

/* ---------- online: anfitrião ---------- */
async function hostRoom(code,resumeS){
 UI.mode="host";UI.code=code||rid(4);UI.screen=resumeS?"game":"lobby";
 if(resumeS)S=resumeS;
 else{const nome=(UI.nome||"").trim()||"Anfitrião";S={stage:"lobby",route:S.route||"santiago",code:UI.code,players:[{id:UI.myId,kind:"online",n:nome,c:PALETA[0]}]}}
 S.code=UI.code;
 history.replaceState(null,"",location.pathname+"?sala="+UI.code);
 render();
 await netStart(UI.code,["host"],onHostMsg,()=>{pub("state",{t:"state",s:view()},true)});
 render();scheduleBot();
}
function onHostMsg(sub,m){
 if(sub!=="host")return;
 if(m.t==="join"){
  let p=S.players.find(x=>x.id===m.id);
  if(!p&&S.stage==="lobby"&&S.players.length<4){const used=S.players.map(x=>x.c);S.players.push({id:m.id,kind:"online",n:(m.n||"Peregrino").slice(0,16),c:PALETA.find(c=>!used.includes(c))});}
  else if(p&&m.n&&S.stage==="lobby")p.n=m.n.slice(0,16);
  if(!p&&S.stage!=="lobby")pub("to/"+m.id,{t:"full",why:"started"});
  else if(!p&&S.players.length>=4)pub("to/"+m.id,{t:"full",why:"cheia"});
  commit();
 } else if(m.t==="act"){
  if(S.stage!=="game")return;
  const seat=S.players.findIndex(x=>x.id===m.id);
  if(seat===S.cur)engine(m.a,m.v);
 } else if(m.t==="leave"&&S.stage==="lobby"){S.players=S.players.filter(x=>x.id!==m.id);commit()}
}
function lobbyStart(){
 if(S.players.length<2)return;
 newGame(S.players);
}

/* ---------- online: convidado ---------- */
async function joinRoom(code){
 code=(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
 if(code.length!==4){UI.err="O código da sala tem 4 letras.";return render()}
 const nome=(UI.nome||"").trim();if(!nome){UI.err="Escreva seu nome para entrar.";return render()}
 lsSet(KEY_NOME,nome);
 UI.mode="guest";UI.code=code;UI.screen="lobby";UI.err="";S={stage:"connecting",route:S.route,players:[]};
 history.replaceState(null,"",location.pathname+"?sala="+code);
 render();
 await netStart(code,["state","to/"+UI.myId],onGuestMsg,sendJoin);
 clearInterval(UI.joinT);UI.joinT=setInterval(()=>{if(!S.players.some(p=>p.id===UI.myId))sendJoin();else clearInterval(UI.joinT)},2500);
}
function sendJoin(){pub("host",{t:"join",id:UI.myId,n:UI.nome})}
function onGuestMsg(sub,m){
 if(sub==="state"&&m.t==="state"&&m.s&&m.s.code===UI.code){
  const prev=S;S=m.s;
  UI.screen=S.stage==="game"?"game":"lobby";
  if(S.stage==="game"&&prev.stage!=="game")UI.overSeen=false;
  render();
 } else if(sub==="to/"+UI.myId&&m.t==="full"){
  if(!S.players.some(p=>p.id===UI.myId)){UI.err=m.why==="started"?"Essa partida já começou.":"A sala está cheia (máximo 4).";leaveRoom(true)}
 }
}
function leaveRoom(keepErr){
 if(UI.mode==="guest")pub("host",{t:"leave",id:UI.myId});
 clearInterval(UI.joinT);clearTimeout(botT);netStop();
 const err=keepErr?UI.err:"";
 if(UI.mode==="host")lsSet(KEY,null);
 UI.mode="local";UI.code="";UI.screen="setup";UI.tab="online";UI.err=err;
 S={stage:"setup",route:S.route||"santiago",players:[]};
 history.replaceState(null,"",location.pathname);render();
}

function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function tree(x,y,s,r){const k=r();if(k<.45)return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-1.6" y="2" width="3.2" height="7" rx="1" fill="#6b4423"/><circle cy="-1" r="7.5" fill="#2f6b34"/><circle cx="-3.5" cy="1" r="5" fill="#3d8540"/><circle cx="3" cy="-3.5" r="4.5" fill="#4f9a4c"/><circle cx="-2" cy="-4" r="2.2" fill="#7cc06d" opacity=".7"/></g>`;
 if(k<.7)return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-1.3" y="3" width="2.6" height="6" fill="#6b4423"/><path d="M0,-12 L7,3 L-7,3Z" fill="#245a33"/><path d="M0,-16 L5.5,-3 L-5.5,-3Z" fill="#2f7040"/></g>`;
 if(k<.85)return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="4" rx="8" ry="4.5" fill="#3d8540"/><ellipse cx="-3" cy="2" rx="4.5" ry="3.5" fill="#55a34f"/>${[[-5,1,"#f6d55c"],[0,0,"#fff"],[4,2,"#ef7b9c"]].map(([a,b,c])=>`<circle cx="${a}" cy="${b}" r="1.5" fill="${c}"/>`).join("")}</g>`;
 return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="6" rx="7" ry="2" fill="#0003"/><path d="M-6,6 L-6,-2 L0,-7 L6,-2 L6,6Z" fill="#f2e6cc"/><path d="M-7.5,-1.5 L0,-8.5 L7.5,-1.5" fill="none" stroke="#b5532e" stroke-width="2.6" stroke-linejoin="round"/><rect x="-1.5" y="1" width="3" height="5" fill="#6b4423"/></g>`}
function drawTrail(){
 const board=document.getElementById("board"),svg=document.getElementById("trail");if(!board||!svg)return;
 const br=board.getBoundingClientRect(),pts=[];let tw=0;
 board.querySelectorAll(".tile").forEach(t=>{const r=t.getBoundingClientRect();tw=r.width;pts[+t.dataset.i]=[r.left-br.left+r.width/2,r.top-br.top+r.height/2]});
 if(pts.length<2)return;
 svg.setAttribute("viewBox",`0 0 ${br.width} ${br.height}`);
 const d="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L");
 /* decoração entre as fileiras */
 const C=cols(),rows=Math.ceil(L/C),R=rnd(7+S.route.length*31),gapY=[],deco=[];
 for(let r=0;r<rows-1;r++){const a=pts[r*C],b=pts[(r+1)*C];if(!a||!b)continue;gapY.push((a[1]+b[1])/2);}
 const turnRight=r=>r%2===0; /* fileira par vira pela direita */
 gapY.forEach((y,r)=>{const n=Math.max(3,Math.round(br.width/70));for(let k=0;k<n;k++){const x=(k+.5+(R()-.5)*.7)*br.width/n;const turnX=turnRight(r)?br.width-tw*.9:tw*.9;if(Math.abs(x-turnX)<tw*.75)continue;deco.push(tree(x,y+(R()-.5)*4,Math.max(.7,Math.min(1.6,tw/62))*(.8+R()*.4),R))}});
 let arrows="";
 for(let i=0;i<pts.length-1;i++){const [x1,y1]=pts[i],[x2,y2]=pts[i+1],mx=(x1+x2)/2,my=(y1+y2)/2,a=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  arrows+=`<path d="M-4,-5 L4,0 L-4,5" transform="translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${a.toFixed(0)})" fill="none" stroke="#f2b632" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`}
 const rw=tw*.58;
 svg.innerHTML=`<defs><pattern id="cob" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="#cfae74"/><path d="M0,5H14M7,0V5M0,5V10M14,5V10" stroke="#a9874f" stroke-width="1.2"/></pattern></defs>
  ${deco.join("")}
  <path d="${d}" fill="none" stroke="#00000040" stroke-width="${rw+8}" stroke-linejoin="round" stroke-linecap="round" transform="translate(0,3)"/>
  <path d="${d}" fill="none" stroke="#7a5a2a" stroke-width="${rw+5}" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="${d}" fill="none" stroke="url(#cob)" stroke-width="${rw}" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="${d}" fill="none" stroke="#fff3d6" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>${arrows}`;
 drawHorizon();
}
function drawHorizon(){
 const h=document.getElementById("horizon");if(!h)return;
 const w=Math.max(300,h.getBoundingClientRect().width||600),H=90;h.setAttribute("viewBox",`0 0 ${w} ${H}`);
 const sant=S.route==="santiago",cx=w*.82;
 const church=sant
  ?`<g transform="translate(${cx},${H-26})" fill="#6c4a6e"><rect x="-26" y="-22" width="52" height="30"/><rect x="-24" y="-50" width="12" height="40"/><rect x="12" y="-50" width="12" height="40"/><path d="M-24,-50 L-18,-64 L-12,-50Z M12,-50 L18,-64 L24,-50Z"/><rect x="-19" y="-70" width="2" height="8"/><rect x="17" y="-70" width="2" height="8"/><path d="M-12,-22 L0,-36 L12,-22Z"/><circle cx="0" cy="-12" r="4" fill="#ffd970" opacity=".85"/></g>`
  :`<g transform="translate(${cx},${H-26})" fill="#5b4a78"><rect x="-40" y="-14" width="80" height="22"/><path d="M-18,-14 A18,18 0 0 1 18,-14Z"/><rect x="-3" y="-44" width="6" height="12"/><rect x="-1" y="-52" width="2" height="9"/><rect x="-8" y="-49" width="16" height="2"/><rect x="34" y="-42" width="9" height="50"/><path d="M34,-42 L38.5,-54 L43,-42Z"/><circle cx="0" cy="-4" r="4" fill="#ffd970" opacity=".85"/></g>`;
 h.innerHTML=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf7a"/><stop offset=".55" stop-color="#ffe9b8"/><stop offset="1" stop-color="#cfe3c8"/></linearGradient><radialGradient id="sun"><stop offset="0" stop-color="#fff7d6"/><stop offset=".4" stop-color="#ffe08a" stop-opacity=".9"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient></defs>
  <rect width="${w}" height="${H}" fill="url(#sky)"/>
  <circle cx="${cx}" cy="${H*.38}" r="48" fill="url(#sun)"/>
  <g fill="#fff" opacity=".85"><ellipse cx="${w*.18}" cy="20" rx="26" ry="7"/><ellipse cx="${w*.24}" cy="16" rx="16" ry="7"/><ellipse cx="${w*.52}" cy="26" rx="22" ry="5"/></g>
  <path d="M0,${H-30} C${w*.12},${H-62} ${w*.22},${H-58} ${w*.32},${H-40} S${w*.5},${H-70} ${w*.64},${H-44} S${w*.86},${H-62} ${w},${H-38} V${H} H0Z" fill="#9db7c9"/>
  ${church}
  <path d="M0,${H-18} C${w*.15},${H-36} ${w*.3},${H-30} ${w*.45},${H-20} S${w*.75},${H-34} ${w},${H-16} V${H} H0Z" fill="#7aa463"/>
  <path d="M0,${H-6} C${w*.2},${H-16} ${w*.5},${H-4} ${w*.7},${H-12} S${w*.9},${H-8} ${w},${H-10} V${H} H0Z" fill="#5f8f4c"/>`;
}

/* ---------- janela do estado (carta, cidade, albergue, vez, fim) ---------- */
function stateModalKey(){
 if(UI.screen!=="game")return "";
 const ph=S.phase;
 if(ph==="over")return UI.overSeen?"":"over";
 if(["card","city","rest","handoff"].includes(ph))return ph+"|"+S.cur+"|"+(S.card?JSON.stringify(S.card):"")+"|"+canAct();
 return "";
}
function syncStateModal(){
 const key=stateModalKey(),cur=document.getElementById("ovs");
 if(cur&&cur.dataset.key===key)return;
 if(cur)cur.remove();
 if(!key)return;
 const p=S.players[S.cur],mine=canAct(),isBot=p.kind==="robo",who=esc(p.n);
 const waitTxt=isBot?`<div class="waitline">${SVG.robot}<span>${who} vai seguir sozinho…</span></div>`:`<div class="waitline"><div class="spin sm"></div><span>Aguardando ${who}…</span></div>`;
 const btn=(t,big)=>mine?`<button class="gbtn ${big?"":"sm"}" id="sok">${t} <span class="tri"></span></button>`:waitTxt;
 let html;
 if(S.phase==="handoff"){
  html=`<div class="ttl">${S.first?"A peregrinação começa":"Próximo peregrino"}</div><div class="in turncard">${avatar(p,S.cur)}<h3>Vez de ${who}</h3><p style="margin:0;color:var(--muted)">Passe o aparelho para ${who}. Peão na casa ${p.pos}.</p><div class="actions" style="justify-content:center">${btn("Estou pronto",true)}</div></div>`;
 } else if(S.phase==="rest"){
  html=`<div class="ttl">Albergue</div><div class="in turncard">${avatar(p,S.cur)}<h3>${who} está descansando</h3><p class="fact">Passou a noite no albergue e volta a caminhar na próxima rodada.</p><div class="actions" style="justify-content:center">${btn("Seguir")}</div></div>`;
 } else if(S.phase==="city"){
  const t=S.board[p.pos];
  html=`<div class="ttl">${S.card.novo?"Carimbo na credencial":"Cidade já carimbada"}</div><div class="in"><div class="kind">${badge("pin","var(--city)")}<div><small>${who} chegou a</small><h3>${esc(t.nome)}</h3></div></div><p class="fact">${esc(t.fact)}</p><div class="actions">${btn("Seguir caminho")}</div></div>`;
 } else if(S.phase==="card"){
  const c=CASAS[S.card.k];
  html=`<div class="ttl">${c.grupo==="esp"?"Casa especial":"Imprevisto"}</div><div class="in"><div class="kind">${badge(c.ic,COR[S.card.k])}<div><small>${who} caiu em</small><h3>${c.nome}</h3></div></div><p class="fact">${esc(S.card.txt)}</p><p class="eff">${c.efeito}</p><div class="actions">${btn(c.bt)}</div></div>`;
 } else if(S.phase==="over"){
  const r=ROUTES[S.route],w=S.players[S.winner],rank=S.players.slice().sort((a,b)=>b.pos-a.pos||b.gracas-a.gracas);
  html=`<div class="ttl">Chegada</div><div class="in"><div class="kind">${badge("cross","#b21f1f")}<div><small>Peregrinação concluída</small><h3>${esc(w.n)} chegou a ${esc(r.meta)}!</h3></div></div><p class="fact">${S.route==="santiago"?"Abraço no apóstolo e Compostela na mão. Buen Camino!":"Aos pés da Mãe Aparecida, o romeiro agradece cada passo."}</p>
   <div class="rank">${rank.map((x,i)=>`<div class="pcard" style="--pc:${x.c}"><span class="av">${i+1}</span><span class="info"><span class="nm">${esc(x.n)}</span><span class="chips"><span class="chip">${x.stamps.length} carimbos</span><span class="chip">${x.gracas} graças</span></span></span></div>`).join("")}</div>
   <p style="margin:0;color:var(--muted)">Na peregrinação ninguém perde: esperem juntos os últimos chegarem e rezem uma Salve-Rainha em ação de graças.</p>
   <div class="actions"><button class="obtn" id="ver">Ver tabuleiro</button>${UI.mode==="guest"?"":'<button class="gbtn sm" id="again2">Nova peregrinação</button>'}</div></div>`;
 }
 const o=el(`<div class="overlay" id="ovs"><div class="card frame" role="dialog" aria-modal="true">${html}</div></div>`);o.dataset.key=key;
 document.body.appendChild(o);
 const ok=o.querySelector("#sok");if(ok){ok.onclick=()=>{ok.disabled=true;act("ack")};ok.focus()}
 const ver=o.querySelector("#ver");if(ver)ver.onclick=()=>{UI.overSeen=true;closeStateModal()};
 const a2=o.querySelector("#again2");if(a2)a2.onclick=()=>{UI.overSeen=true;againAfterEnd()};
}
function closeStateModal(){const o=document.getElementById("ovs");if(o)o.remove()}

/* ---------- janelas de informação (só deste aparelho) ---------- */
function infoModal(html){closeInfo();const o=el(`<div class="overlay info" id="ovi"><div class="card frame" role="dialog" aria-modal="true">${html}</div></div>`);document.body.appendChild(o);
 o.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeInfo);
 o.addEventListener("click",e=>{if(e.target===o)closeInfo()});
 const f=o.querySelector(".gbtn")||o.querySelector("button");if(f)f.focus();return o}
function closeInfo(){const o=document.getElementById("ovi");if(o)o.remove()}
function confirmBox(t,txt,ok,fn){infoModal(`<div class="ttl">Confirmar</div><div class="in"><h3>${esc(t)}</h3><p style="margin:0;color:var(--muted)">${esc(txt)}</p><div class="actions"><button class="obtn" data-close>Cancelar</button><button class="gbtn sm" id="cok">${esc(ok)}</button></div></div>`);document.getElementById("cok").onclick=()=>{closeInfo();fn()}}
function tileInfo(i){
 const t=S.board[i];
 if(t.t==="cidade")return cityInfo(t.i,i);
 const c=CASAS[t.t];
 if(!c)return infoModal(`<div class="ttl">Casa ${i}</div><div class="in"><p class="fact">Um trecho tranquilo do caminho. Nada acontece aqui.</p><div class="actions"><button class="gbtn sm" data-close>Fechar</button></div></div>`);
 infoModal(`<div class="ttl">Casa ${i}</div><div class="in"><div class="kind">${badge(c.ic,COR[t.t])}<div><small>${c.grupo==="esp"?"Casa especial":"Imprevisto"}</small><h3>${c.nome}</h3></div></div><p class="eff">${c.efeito}</p><div class="actions"><button class="gbtn sm" data-close>Fechar</button></div></div>`);
}
function cityInfo(ci,i){
 const r=ROUTES[S.route],c=r.cidades[ci];
 if(i===undefined)i=S.board.findIndex(t=>t.t==="cidade"&&t.i===ci);
 const quem=S.players.filter(x=>x.stamps.includes(ci)).map(x=>x.n);
 infoModal(`<div class="ttl">Casa ${i} · parada ${ci+1} de ${r.cidades.length}</div><div class="in"><div class="kind">${badge(i===L-1?"cross":"pin",i===L-1?"#b21f1f":"var(--city)")}<div><small>Cidade do caminho</small><h3>${esc(c[0])}</h3></div></div><p class="fact">${esc(c[1])}</p><p class="hint" style="margin:0">${quem.length?"Carimbada por: "+esc(quem.join(", ")):"Ninguém carimbou ainda."}</p><div class="actions"><button class="gbtn sm" data-close>Fechar</button></div></div>`);
}
function mobile(){return window.innerWidth<=720}

/* ---------- início ---------- */
(function boot(){
 const qs=new URLSearchParams(location.search).get("sala");
 const sv=loadSave();
 if(qs&&!(sv&&sv.mode==="host"&&sv.code===qs.toUpperCase())){UI.tab="online";UI.joinCode=qs.toUpperCase();if(UI.nome)return joinRoom(UI.joinCode)}
 render();
})();
let rz,lastC=cols();window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(UI.screen!=="game")return;if(cols()!==lastC){lastC=cols();render()}else drawTrail()},120)});
window.addEventListener("beforeunload",()=>{if(UI.mode==="guest"&&S.stage==="lobby")pub("host",{t:"leave",id:UI.myId})});

</script>
</body>
</html>
