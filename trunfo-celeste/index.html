<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trunfo Celeste</title>
<meta name="description" content="Jogo de cartas católico: escolha uma categoria, compare com a carta do Carlo e conquiste 81 santos. Nossa Senhora e São José são os trunfos!">
<meta name="theme-color" content="#0a1736">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:title" content="Trunfo Celeste · CARLUDIX PLAY">
<meta property="og:description" content="Desafie o Carlo num jogo de cartas com 81 santos, São José e Nossa Senhora.">
<meta property="og:image" content="capa.png">
<style>
/* Trunfo Celeste: céu noturno azul-marinho, ouro polido e cartas de pergaminho.
   Uma mesa só para celular e computador: as duas cartas lado a lado com o selo VS. */
@font-face{font-family:"Cinzel";src:url(fontes/cinzel-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Cinzel";src:url(fontes/cinzel-latin-900-normal.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Barlow Semi Condensed";src:url(fontes/barlow-semi-condensed-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow Semi Condensed";src:url(fontes/barlow-semi-condensed-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Semi Condensed";src:url(fontes/barlow-semi-condensed-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Playfair Display";src:url(fontes/playfair-display-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Playfair Display";src:url(fontes/playfair-display-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url(fontes/cormorant-garamond-latin-700-italic.woff2) format("woff2");font-weight:700;font-style:italic;font-display:swap}
:root{
  --noite:#081331; --navy:#0a1736; --azul:#13306f; --azul2:#1c43a0; --ouro:#e0b54d; --ouro-claro:#ffe7a3; --ouro-esc:#9c7419;
  --perg:#fff6dc; --perg2:#f3dfa6; --tinta:#152150; --verde:#2f9a5f; --vermelho:#c23b45; --cinza:#b6bed8;
  --f-titulo:"Cinzel",Georgia,"Times New Roman",serif;
  --f-texto:"Barlow Semi Condensed","Arial Narrow",Arial,system-ui,sans-serif;
  --f-italico:"Cormorant Garamond",Georgia,serif;
  --f-nome:"Playfair Display",Georgia,"Times New Roman",serif;
  --moldura:linear-gradient(180deg,#fff1b8,#e9be55 35%,#b98a22 70%,#f5d77f);
  --gutter:max(14px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--f-texto);font-weight:500;color:#eef2ff;font-size:16px;
  background:
    radial-gradient(ellipse 90% 45% at 50% 0%,rgba(52,98,200,.55),transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 100%,rgba(28,67,160,.45),transparent 75%),
    linear-gradient(180deg,#0d2156,#0a1736 40%,#070f27);
  background-color:var(--navy);background-attachment:fixed;
  padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) var(--gutter);
}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ouro-claro);outline-offset:3px}
img{display:block;max-width:100%}
.ouro{position:relative;border:2px solid transparent;
  background:linear-gradient(180deg,#1a3c93,#0d225a) padding-box,var(--moldura) border-box;
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 16px rgba(255,214,110,.22),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -8px 16px rgba(0,0,0,.25)}

/* ---------- Barra superior ---------- */
.barra{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:1120px;margin:0 auto;padding:10px 0 6px;position:relative;z-index:3}
.voltar,.sair{justify-self:start;white-space:nowrap;color:var(--ouro-claro);text-decoration:none;font-weight:700;font-size:.86rem;letter-spacing:.05em;
  padding:6px 12px;border-radius:999px;border:1.5px solid rgba(224,181,77,.6);background:rgba(8,19,49,.55)}
.voltar:hover,.sair:hover{background:rgba(224,181,77,.16)}
.voltar[hidden],.sair[hidden]{display:none}
.marca{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.86rem;letter-spacing:.09em;color:#fff;white-space:nowrap}
.marca svg{width:26px;height:26px}

.tela{display:none;max-width:440px;margin:0 auto}
.tela.ativa{display:block;animation:surge .35s ease}
@keyframes surge{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Botões ---------- */
.mbtn{display:grid;grid-template-columns:50px 1fr 50px;align-items:center;width:100%;min-height:64px;padding:6px 14px;border-radius:999px;text-align:center;color:#fff;transition:transform .1s,filter .2s}
.mbtn:hover{filter:brightness(1.15)}
.mbtn:active{transform:scale(.98)}
.mbtn svg{width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.mbtn strong{display:block;font-size:1.32rem;font-weight:600;line-height:1.05;text-shadow:0 2px 2px rgba(0,0,0,.35)}
.mbtn small{display:block;font-size:.98rem;color:#e6ebfb;line-height:1.15}
.menu{display:grid;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:54px;padding:10px 16px;border-radius:999px;
  font-weight:700;font-size:1.25rem;color:var(--ouro-claro);text-decoration:none;transition:transform .1s,filter .2s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.98)}
.btn svg{width:26px;height:26px}
.btn-cheio{border:2px solid #fff3c4;background:linear-gradient(180deg,#ffe08a,#e2ad38 55%,#b9861c);color:#2a1c02;
  box-shadow:0 0 18px rgba(255,214,110,.35),inset 0 1px 0 #fff8d8,0 6px 16px rgba(0,0,0,.45)}
.btn-escuro{border:2px solid transparent;background:linear-gradient(180deg,#0f245c,#0a1940) padding-box,var(--moldura) border-box;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.btn-contorno{border:1.5px solid rgba(224,181,77,.6);color:#eef2ff;font-size:1.05rem;min-height:48px}

/* ---------- Início ---------- */
.heroi{--pt:56px;--logo:min(300px,76cqw);position:relative;container-type:inline-size;margin:-52px calc(-1*var(--gutter)) 0;padding:var(--pt) var(--gutter) 6px;background:var(--navy)}
.heroi>*{position:relative;z-index:1}
.heroi::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:url(fundo.jpg) center calc(var(--pt) - 30px + var(--logo) - 64.5cqw)/100% auto no-repeat}
.heroi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--navy));pointer-events:none}
.capa{display:flex;flex-direction:column;align-items:center}
.capa img{position:relative;z-index:1;width:var(--logo);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.capa .basilica{height:calc(45cqw - 40px)}
.col-dir .menu{position:relative;z-index:1;margin-top:-4px}
.placar-geral{text-align:center;color:var(--cinza);font-size:.95rem;margin-top:14px}
.btn-regras{margin-top:16px;font-family:var(--f-titulo);font-size:1.02rem;letter-spacing:.08em}
.links-rodape{display:flex;justify-content:center;gap:22px;margin:16px 0 18px;font-size:1rem}
.links-rodape a{color:var(--ouro-claro);text-decoration:none}
.links-rodape a:hover{text-decoration:underline}

/* ---------- Janela (regras, sair, carta, dicas) ---------- */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(4,9,26,.72);backdrop-filter:blur(4px);animation:surge .2s ease}
.modal[hidden]{display:none}
.janela{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;border-radius:22px;padding:20px 18px 18px}
.janela h2{font-family:var(--f-titulo);font-weight:700;color:var(--ouro-claro);font-size:1.15rem;letter-spacing:.06em;text-align:center;margin-bottom:12px}
.janela h3{font-family:var(--f-titulo);font-size:.95rem;color:var(--ouro-claro);letter-spacing:.06em;margin:16px 0 8px}
.janela p.texto{color:#e3e8f7;font-size:1.08rem;line-height:1.4;text-align:center}
.janela .fechar{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;font-size:1.5rem;line-height:1;color:var(--ouro-claro);background:rgba(255,255,255,.08)}
.janela .acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.janela.carta-aberta{width:min(380px,100%);padding:30px 14px 14px;background:transparent;box-shadow:none;border:0}
.janela.carta-aberta .fechar{top:-6px;right:-2px;background:rgba(8,19,49,.85);border:1.5px solid rgba(224,181,77,.6)}
.passos{list-style:none;display:grid;gap:10px}
.passos li{display:flex;gap:10px;align-items:flex-start;line-height:1.35;color:#e3e8f7;font-size:1.02rem}
.passos b{color:var(--ouro-claro);font-weight:700}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--moldura);color:var(--tinta);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats div{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.06);border-radius:12px;padding:9px 10px;font-size:.95rem;line-height:1.3;color:#e3e8f7}
.cats svg{flex:0 0 24px;height:24px;background:var(--ouro-claro);border-radius:6px;padding:2px}
.cats b{display:block;color:var(--ouro-claro);font-weight:700}
.nota{color:var(--cinza);font-size:.9rem;line-height:1.4;margin-top:12px;text-align:center}
.dica-passo{font-family:var(--f-titulo);text-align:center;color:var(--ouro-claro);font-size:.8rem;letter-spacing:.12em;margin-bottom:6px}
.dica-icone{font-size:2.6rem;text-align:center;margin-bottom:6px}

/* ---------- Placar ---------- */
.placar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:2px 0 8px}
.pill{position:relative;display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border-radius:22px;transition:box-shadow .3s}
.pill.cpu{justify-content:flex-end;padding:5px 6px 5px 12px;text-align:right}
.pill.vez{box-shadow:0 0 0 3px #fff3c4,0 0 24px rgba(255,214,110,.75)}
.pill .info{line-height:1}
.pill .info small{display:block;font-size:.98rem;font-weight:600;color:#fff}
.pill .info strong{display:inline-block;font-family:var(--f-titulo);font-size:2.1rem;color:var(--ouro-claro);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.pill .tag{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:700;font-size:.72rem;letter-spacing:.1em;
  color:#2a1c02;background:linear-gradient(180deg,#ffe08a,#e2ad38);padding:2px 9px;border-radius:999px;opacity:0;transition:opacity .25s}
.pill.vez .tag{opacity:1}
.pula{animation:pula .45s ease}
@keyframes pula{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.centro{display:grid;gap:6px;justify-items:center}
.rod{display:grid;place-items:center;padding:4px 12px;border-radius:16px;text-align:center;line-height:1}
.rod small{font-size:.8rem;font-weight:600;color:#fff}
.rod strong{font-family:var(--f-titulo);font-size:1.25rem;color:var(--ouro-claro);font-weight:700;margin-top:2px}
.pote{display:flex;align-items:center;gap:5px;font-weight:700;font-size:.85rem;color:var(--ouro-claro)}
.pote[hidden]{display:none}
.pote .pilha{width:20px;height:26px;border-radius:4px;background:url(verso.jpg) center/cover;box-shadow:3px -3px 0 -1px #0a1736,3px -3px 0 0 #e0b54d,6px -6px 0 -1px #0a1736,6px -6px 0 0 #e0b54d}
.pote.novo{animation:pula .5s ease 2}
.avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  border:2px solid transparent;background:radial-gradient(circle at 50% 35%,#2c56b0,#0d214f) padding-box,var(--moldura) border-box}
.avatar svg{width:28px;height:28px}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- Faixa de status (instrução, fala do Carlo e resultado) ---------- */
.status{display:flex;align-items:center;gap:10px;min-height:60px;margin:14px 0 18px;padding:7px 14px;border-radius:20px;text-align:left;line-height:1.2;color:#fff}
.status .rosto{flex:0 0 38px;width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--ouro)}
.status .rosto img{width:100%;height:100%;object-fit:cover}
.status .txt{flex:1;min-width:0}
.status .txt strong{display:block;font-size:1.18rem;font-weight:700}
.status .txt span{display:block;font-size:.98rem;color:#dfe6fa}
.status b{color:var(--ouro-claro);font-weight:700}
.status.bom{background:linear-gradient(180deg,#22774f,#145034) padding-box,var(--moldura) border-box}
.status.ruim{background:linear-gradient(180deg,#86283a,#561722) padding-box,var(--moldura) border-box}
.status.emp{background:linear-gradient(180deg,#4a3f86,#2c255a) padding-box,var(--moldura) border-box}

/* ---------- Mesa ---------- */
.mesa{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
.lado.eu{grid-column:1;grid-row:1}
.lado.cpu{grid-column:2;grid-row:1;position:relative}
.vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  font-family:var(--f-titulo);font-weight:900;font-size:1rem;color:var(--tinta);
  background:radial-gradient(circle at 35% 30%,#fff6cf,#e9be55 55%,#a87c1c);box-shadow:0 0 0 3px #0a1736,0 0 0 5px #f5d77f,0 0 22px rgba(255,214,110,.6)}
.carlo-fig{display:none}
.curio-faixa{margin:14px 2px 0;padding:9px 12px;border-radius:14px;background:rgba(255,246,220,.1);border:1px dashed rgba(224,181,77,.5);color:#e7ecfa;font-size:.98rem;line-height:1.3;min-height:3.2em}
.curio-faixa b{color:var(--ouro-claro)}
.curio-faixa:empty{visibility:hidden}
.acao{position:sticky;bottom:0;z-index:8;margin:14px calc(-1*var(--gutter)) 0;padding:10px var(--gutter) calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(10,23,54,0),rgba(10,23,54,.92) 35%);min-height:76px}
.acao .btn{display:none}
.acao .btn.on{display:flex}

/* ---------- Cartas (o tamanho interno acompanha a largura da carta) ---------- */
.cena{perspective:1200px;container-type:inline-size;padding-top:18px}
.carta{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1),filter .35s,opacity .35s}
.carta.virada{transform:rotateY(180deg)}
.carta.chega{animation:chega .35s ease-out}
@keyframes chega{from{transform:translateY(40px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.carta.vence{transform:scale(1.04);filter:drop-shadow(0 0 18px rgba(255,220,120,.85))}
.carta.perde{filter:saturate(.55) brightness(.82)}
.face,.verso{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px}
.verso{position:absolute;inset:0;transform:rotateY(180deg);overflow:hidden;border-radius:14px;
  background:url(verso.jpg) center/100% 100% no-repeat,linear-gradient(160deg,#1c43a0,#0a1736);
  box-shadow:0 0 0 2px #f5d77f,0 0 20px rgba(255,214,110,.35),0 10px 26px rgba(0,0,0,.5)}
.carta.virada .face{visibility:hidden}
.face{position:relative;color:var(--tinta);padding:max(3px,1.1cqw);
  background:linear-gradient(180deg,var(--perg),var(--perg2)) padding-box,var(--moldura) border-box;border:max(2px,.8cqw) solid transparent;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 24px rgba(255,214,110,.28),0 12px 28px rgba(0,0,0,.5)}
.face::before{content:"";position:absolute;inset:max(3px,1.1cqw);border-radius:12px;border:1.5px solid rgba(185,138,34,.55);pointer-events:none;z-index:1}
.retrato{position:relative;height:clamp(104px,64cqw,232px);overflow:hidden;border-radius:12px 12px 0 0;
  background:radial-gradient(circle at 50% 36%,#fffef4 0 16%,#fff0c2 38%,#f6d67e 70%,#e9bd57 100%)}
.retrato::before{content:"";position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,.3) 0 4deg,transparent 4deg 11deg)}
.retrato img{position:absolute;left:50%;top:4px;height:178%;width:auto;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 4px 6px rgba(80,50,0,.25))}
.retrato .emb{position:absolute;inset:0;display:grid;place-items:center}
.retrato .emb span{display:grid;place-items:center;width:46cqw;max-width:112px;aspect-ratio:1;border-radius:50%;font-size:clamp(1.8rem,18cqw,3.4rem);
  background:radial-gradient(circle at 40% 35%,#fff 0 10%,transparent 45%),var(--c,#1c43a0);box-shadow:0 0 0 4px #fff6d6,0 0 0 7px var(--ouro)}
.fita{position:relative;z-index:2;margin:calc(-1*clamp(20px,10cqw,38px)) -2px 0;padding:0 clamp(8px,5.5cqw,22px);filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.fita .faixa{position:relative;padding:clamp(4px,2.2cqw,8px) 6px clamp(3px,2cqw,7px);text-align:center;
  background:linear-gradient(180deg,#f8db86,#c7962c);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.fita .faixa::before{content:"";position:absolute;inset:2px;background:linear-gradient(180deg,#1d44a3,#0c2160);
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%)}
.fita h3,.fita p{position:relative}
.fita h3{font-family:var(--f-nome);font-weight:700;font-size:clamp(.92rem,8.4cqw,1.42rem);line-height:1.06;color:#fff;text-wrap:balance;text-shadow:0 2px 2px rgba(0,0,0,.4)}
.fita p{font-family:var(--f-italico);font-style:italic;font-weight:700;font-size:clamp(.8rem,6.6cqw,1.12rem);line-height:1.1;color:var(--ouro-claro);margin-top:1px}
.stats{display:grid;gap:clamp(4px,1.8cqw,7px);padding:clamp(6px,2.6cqw,10px) clamp(4px,2cqw,8px) clamp(5px,2cqw,8px)}
.stat{position:relative;display:grid;grid-template-columns:clamp(16px,9cqw,26px) 1fr auto;align-items:center;gap:clamp(4px,2cqw,8px);width:100%;min-height:clamp(40px,22cqw,44px);text-align:left;
  background:linear-gradient(180deg,#fffdf3,#fbefc9);border:1.5px solid #dcbc69;border-radius:999px;padding:3px 4px 3px clamp(6px,3.4cqw,11px);color:var(--tinta);
  font-size:clamp(.82rem,5.6cqw,1.02rem);font-weight:600;line-height:1.05;box-shadow:inset 0 1px 0 #fff;transition:background .2s,border-color .2s,opacity .2s,box-shadow .2s,transform .1s}
.stat svg{width:clamp(16px,9cqw,24px);height:clamp(16px,9cqw,24px)}
.stat .sn-c{display:none}
.stat .sv{min-width:clamp(46px,26cqw,76px);text-align:right;font-weight:700;font-size:clamp(.88rem,6.4cqw,1.12rem);font-variant-numeric:tabular-nums;padding:2px clamp(6px,3cqw,12px);border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,#fbe8a8,#eec65f);color:#251800;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.stat .marca-res{display:none}
@container (max-width:250px){
  .stat .sn-l{display:none}
  .stat .sn-c{display:inline}
  .curio{display:none}
}
button.stat{cursor:pointer}
.carta.escolher .stat{border-color:var(--ouro-esc);animation:pulsa 1.6s infinite}
.carta.escolher .stat::after{content:"›";position:absolute;right:-12px;top:50%;transform:translateY(-50%);font-size:1.2rem;font-weight:700;color:var(--ouro-claro);text-shadow:0 1px 2px #000}
.carta.escolher .stat:hover{background:#fff1c4}
.carta.escolher .stat:active{transform:scale(.97)}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(224,181,77,.7)}70%{box-shadow:0 0 0 6px rgba(224,181,77,0)}100%{box-shadow:0 0 0 0 rgba(224,181,77,0)}}

<template id="tplRegras">
  <button class="fechar" data-fechar aria-label="Fechar">×</button>
  <h2 id="janelaTitulo">COMO JOGAR</h2>
  <ol class="passos">
    <li><span class="num">1</span><span>Você e o Carlo recebem uma carta por rodada. Cada um vê <b>só a própria carta</b>.</span></li>
    <li><span class="num">2</span><span>Quem tem a vez <b>escolhe uma categoria</b>. O <b>maior número vence</b>. Em Nascimento, vence quem nasceu mais recente.</span></li>
    <li><span class="num">3</span><span>Quem vence <b>leva as duas cartas</b> e escolhe a próxima categoria. No empate, as cartas vão para um monte e quem vencer a rodada seguinte leva tudo.</span></li>
    <li><span class="num">4</span><span><b>Nossa Senhora (hiperdulia)</b> vence todas as cartas. <b>São José (protodulia)</b> vence qualquer santo e só perde para Nossa Senhora.</span></li>
    <li><span class="num">5</span><span>No fim das rodadas, vence quem tiver <b>mais cartas</b>.</span></li>
  </ol>
  <h3>AS QUATRO CATEGORIAS</h3>
  <div class="cats" id="listaCats"></div>
  <p class="nota">Em datas antigas, o ano de nascimento é aproximado (c.). A distância é em linha reta, da cidade natal até Roma. É só um jogo: santidade não se mede em números.</p>
  <p class="nota so-pc">No computador: teclas <b>1 a 4</b> escolhem a categoria e <b>Enter</b> passa para a próxima rodada.</p>
</template>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="dados.js"></script>
<script>
/* ===================== CÁLCULOS ===================== */
const ROMA = {lat:41.9028, lon:12.4964};
function distanciaKm(a,b){
  const R=6371, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
SO_SANTOS.forEach(s=>{ s.espera=s.canon-s.morte; s.dist=Math.round(distanciaKm(ROMA,s)/10)*10; });

const CATS = [
  {k:'idade',  nome:'Anos de vida',          curto:'Anos de vida',  icone:'i-ampulheta',  desc:'Idade ao partir para o Céu', fmt:s=>s.idade+' anos', un:' anos'},
  {k:'nasc',   nome:'Nascimento (ano)',       curto:'Nascimento',    icone:'i-calendario', desc:'Ano em que nasceu (mais recente vence)', fmt:s=>(s.aprox?'c. ':'')+s.nasc, un:''},
  {k:'espera', nome:'Anos até a canonização', curto:'Até canonizar', icone:'i-coroa',      desc:'Anos entre a morte e a canonização', fmt:s=>String(s.espera), un:' anos'},
  {k:'dist',   nome:'Distância de Roma (km)', curto:'Até Roma (km)', icone:'i-globo',      desc:'Da cidade natal até Roma, em linha reta', fmt:s=>s.dist.toLocaleString('pt-BR'), un:' km'}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.k,c]));
const PERC = {};
CATS.forEach(c=>{
  const vals = SO_SANTOS.map(s=>s[c.k]);
  PERC[c.k] = v => { let m=0,i=0; vals.forEach(x=>{ if(x<v) m++; else if(x===v) i++; }); return (m+(i-1)/2)/(vals.length-1); };
});
const BRASIL = new Set(['dulce','galvao','paulina','anchieta','ns-aparecida']);
const NIVEL = {2:'hiperdulia', 1:'protodulia'};

/* ===================== UTILIDADES ===================== */
const $ = id => document.getElementById(id);
const PREFIXO = 'trunfo-celeste:';
function ler(k,p){ try{ const v=localStorage.getItem(PREFIXO+k); return v?JSON.parse(v):p; }catch(e){ return p; } }
function gravar(k,v){ try{ localStorage.setItem(PREFIXO+k, JSON.stringify(v)); }catch(e){} }
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(t){ return String(t).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
const calmo = (()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2200); }
function mostrar(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.toggle('ativa', t.id===id));
  const jogando = id==='tJogo';
  $('btnTopo').hidden = !jogando; $('lnkPortal').hidden = jogando;
  window.scrollTo({top:0, behavior: calmo?'auto':'smooth'});
}
function pular(el){ el.classList.remove('pula'); void el.offsetWidth; el.classList.add('pula'); }

/* ===================== CARTA ===================== */
const LOURO = '<svg class="louro" viewBox="0 0 40 70" aria-hidden="true"><use href="#i-louro"/></svg>';
function retratoHTML(s){
  return `<img src="santos/${s.id}.png" alt="" loading="lazy" onerror="this.remove()">
    <div class="emb"><span style="--c:${s.cor}">${s.icone}</span></div>`;
}
document.addEventListener('load', e=>{
  const im=e.target; if(im.tagName==='IMG' && im.nextElementSibling && im.nextElementSibling.classList && im.nextElementSibling.classList.contains('emb')) im.nextElementSibling.remove();
}, true);
function valorTexto(s,c){ return s.trunfo ? 'Trunfo' : c.fmt(s); }
function rotuloValor(s,c){ return s.trunfo ? (s.nivel===2?'vence todas as cartas':'vence qualquer santo') : c.fmt(s); }
function cartaHTML(s, clicavel){
  const linhas = CATS.map((c,i)=>`
    <${clicavel?'button type="button"':'div'} class="stat" data-k="${c.k}" ${clicavel?`aria-label="${i+1}. ${esc(c.nome)}: ${esc(rotuloValor(s,c))}"`:''}>
      <i class="marca-res" aria-hidden="true"></i><svg aria-hidden="true"><use href="#${c.icone}"/></svg><span><span class="sn-l">${c.nome}</span><span class="sn-c">${c.curto}</span></span><span class="sv">${esc(valorTexto(s,c))}</span>
    </${clicavel?'button':'div'}>`).join('');
  const sub = s.nivel===2 ? 'Hiperdulia · vence todas' : s.nivel===1 ? 'Protodulia · só perde p/ Maria' : s.titulo;
  return `
    <div class="face${s.nivel===2?' trunfo':''}${s.nivel===1?' proto':''}">
      ${s.nivel?`<div class="faixa-trunfo" aria-hidden="true">${LOURO}<b>TRUNFO</b>${LOURO.replace('class="louro"','class="louro dir"')}</div>`:''}
      <div class="retrato">${retratoHTML(s)}</div>
      <div class="fita"><div class="faixa"><h3>${esc(s.nome)}</h3><p>${esc(sub)}</p></div></div>
      <div class="stats">${linhas}</div>
      ${s.cur?`<p class="curio"><b>✦ Você sabia?</b> ${esc(s.cur)}</p>`:''}
    </div>
    <div class="verso" aria-label="Carta virada do Carlo"></div>`;
}
function miniHTML(s, abrir){
  const img = `<img src="santos/${s.id}.png" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${s.icone}'))">`;
  return `<${abrir?'button type="button"':'div'} class="mcard${s.nivel?' t':''}" ${abrir?`data-id="${s.id}" aria-label="Ver a carta de ${esc(s.nome)}"`:''}><div class="r">${img}</div><p>${esc(s.nome)}</p></${abrir?'button':'div'}>`;
}

/* Carlo */
document.querySelectorAll('.carlo-av').forEach(a=>a.innerHTML='<img src="carlo.png" alt="">');
const ROSTO_CARLO = '<div class="rosto"><img src="carlo.png" alt=""></div>';

/* ===================== JANELA ===================== */
let aoFechar=null;
function abrirJanela(html, classe, fechar){
  const j=$('janela'); j.className='janela '+(classe||'ouro'); j.innerHTML=html; $('modal').hidden=false; aoFechar=fechar||null;
  const f=j.querySelector('[data-foco]')||j.querySelector('button'); if(f) f.focus();
}
function fecharJanela(){ $('modal').hidden=true; $('janela').innerHTML=''; const cb=aoFechar; aoFechar=null; if(cb) cb(); }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal'||e.target.closest('[data-fechar]')) fecharJanela(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('modal').hidden){ e.preventDefault(); fecharJanela(); } });

function abrirRegras(){
  abrirJanela($('tplRegras').innerHTML,'ouro');
  $('listaCats').innerHTML = CATS.map(c=>`<div><svg aria-hidden="true"><use href="#${c.icone}"/></svg><span><b>${c.nome}</b>${c.desc}</span></div>`).join('');
}
$('btnRegras').onclick=abrirRegras;

/* ===================== INÍCIO ===================== */
function atualizarPlacarGeral(){
  const e=ler('estatisticas',{v:0,d:0,e:0}), t=e.v+e.d+e.e;
  $('placarGeral').textContent = t ? `Seu histórico contra o Carlo: ${e.v} vitória${e.v===1?'':'s'}, ${e.d} derrota${e.d===1?'':'s'} e ${e.e} empate${e.e===1?'':'s'}.` : '';
}
atualizarPlacarGeral();

/* dicas na primeira partida */
const DICAS=[
  {i:'✨', t:'Esta é a sua carta. Você só vê a sua; a do Carlo fica virada até a revelação.'},
  {i:'👆', t:'Na sua vez, toque na categoria em que seu número parece maior. Em Nascimento, vence quem nasceu mais recente.'},
  {i:'👑', t:'Nossa Senhora vence todas as cartas e São José vence qualquer santo. Torça para elas aparecerem!'}
];
function mostrarDicas(n, depois){
  if(n>=DICAS.length){ gravar('dicas',true); depois(); return; }
  const d=DICAS[n];
  abrirJanela(`<p class="dica-passo">DICA ${n+1} DE ${DICAS.length}</p><div class="dica-icone" aria-hidden="true">${d.i}</div>
    <h2 id="janelaTitulo" class="sr">Dica</h2><p class="texto">${d.t}</p>
    <div class="acoes"><button class="btn btn-contorno" id="dPular">Pular dicas</button><button class="btn btn-cheio" id="dOk" data-foco>${n+1<DICAS.length?'Próxima':'Jogar!'}</button></div>`,
    'ouro');
  $('dOk').onclick=()=>{ $('modal').hidden=true; mostrarDicas(n+1, depois); };
  $('dPular').onclick=()=>{ $('modal').hidden=true; gravar('dicas',true); depois(); };
}

/* ===================== JOGO ===================== */
let G=null, ultimaRodadas=10;
function novoJogo(rodadas){
  ultimaRodadas=rodadas;
  const b=embaralhar([...SANTOS]);
  G={rodadas, rodada:0, eu:b.slice(0,rodadas), cpu:b.slice(rodadas,rodadas*2), meuMonte:[], cpuMonte:[], pote:[], ganhos:[],
     vez:Math.random()<.5?'eu':'cpu', cat:null, fase:'', timers:[], venc:0, seq:0, melhorSeq:0, trunfos:0};
  $('cartaCpu').innerHTML='';
  mostrar('tJogo');
  if(!ler('dicas',false)){ G.vez='eu'; proximaRodada(); mostrarDicas(0, ()=>{}); }
  else proximaRodada();
}
function depois(ms,fn){ const t=setTimeout(fn, calmo?Math.min(ms,150):ms); if(G) G.timers.push(t); }
function limparTimers(){ if(G){ G.timers.forEach(clearTimeout); G.timers=[]; } }
function aviso(html,tipo,carlo){ const a=$('aviso'); a.innerHTML=(carlo?ROSTO_CARLO:'')+`<div class="txt">${html}</div>`; a.className='status ouro'+(tipo?' '+tipo:''); }
function botao(id){ ['btnProxima','btnFim'].forEach(b=>$(b).classList.toggle('on', b===id)); }
function atualizarPlacar(pulo){
  $('ptEu').textContent=G.meuMonte.length; $('ptCpu').textContent=G.cpuMonte.length;
  $('txtRodada').textContent=`${G.rodada}/${G.rodadas}`;
  $('plEu').classList.toggle('vez',G.vez==='eu'); $('plCpu').classList.toggle('vez',G.vez==='cpu');
  const p=$('pote'); p.hidden=!G.pote.length; $('poteN').textContent=G.pote.length;
  $('placarSr').textContent=`Placar: você ${G.meuMonte.length}, Carlo ${G.cpuMonte.length}. Rodada ${G.rodada} de ${G.rodadas}.`;
  if(pulo) pular($(pulo==='eu'?'ptEu':'ptCpu'));
}
function curioDe(s){ return s&&s.cur ? `<b>✦ ${esc(s.nome)}:</b> ${esc(s.cur)}` : ''; }
function proximaRodada(){
  limparTimers();
  if(G.rodada>=G.rodadas){ fim(); return; }
  G.rodada++; G.cat=null;
  const meu=G.eu[G.rodada-1], dele=G.cpu[G.rodada-1];
  const cEu=$('cartaEu'), cCpu=$('cartaCpu');
  cEu.className='carta'; cCpu.className='carta virada';
  cEu.innerHTML=cartaHTML(meu,true); void cEu.offsetWidth; cEu.classList.add('chega');
  // troca a carta do Carlo só depois de estar de costas
  depois(cCpu.innerHTML?320:0, ()=>{ cCpu.innerHTML=cartaHTML(dele,false); });
  if(!cCpu.innerHTML) cCpu.innerHTML=cartaHTML(dele,false);
  $('curioFaixa').innerHTML=curioDe(meu);
  atualizarPlacar(); botao(null);
  if(G.vez==='eu'){
    G.fase='escolha'; cEu.classList.add('escolher');
    aviso('<strong>Sua vez!</strong><span>Toque na categoria em que seu número parece maior.</span>');
  } else {
    G.fase='cpu';
    aviso('<strong>Vez do Carlo</strong><span>Ele está escolhendo a categoria…</span>','',true);
    depois(1100, ()=>{
      G.cat=escolhaDoCarlo(dele); marcar(G.cat); G.fase='aguarda';
      aviso(`<strong>“Vou de ${esc(CAT[G.cat].nome.replace(' (ano)','').replace(' (km)',''))}!”</strong><span>Revelando as cartas…</span>`,'',true);
      depois(1300, ()=>{ if(G && G.fase==='aguarda') revelar(); });
    });
  }
}
function escolhaDoCarlo(carta){
  if(carta.trunfo) return CATS[Math.floor(Math.random()*CATS.length)].k;
  let melhor=null, nota=-1;
  CATS.forEach(c=>{ const n=PERC[c.k](carta[c.k])+Math.random()*.04; if(n>nota){ nota=n; melhor=c.k; } });
  return melhor;
}
function marcar(k){ document.querySelectorAll('#cartaEu .stat').forEach(el=>el.classList.toggle('marcada', el.dataset.k===k)); }
$('cartaEu').addEventListener('click', e=>{
  const b=e.target.closest('.stat');
  if(!b || !G || G.fase!=='escolha') return;
  G.cat=b.dataset.k; $('cartaEu').classList.remove('escolher'); marcar(G.cat); revelar();
});
function voar(deEl, paraEl){
  if(calmo) return;
  const a=deEl.getBoundingClientRect(), b=paraEl.getBoundingClientRect();
  const v=document.createElement('div'); v.className='voando'; document.body.appendChild(v);
  const x0=a.left+a.width/2-23, y0=a.top+a.height/2-32, x1=b.left+b.width/2-23, y1=b.top+b.height/2-32;
  v.style.left=x0+'px'; v.style.top=y0+'px';
  const an=v.animate([{transform:'translate(0,0) scale(1.6) rotate(0deg)',opacity:1},{transform:`translate(${x1-x0}px,${y1-y0}px) scale(.5) rotate(-12deg)`,opacity:.6}],{duration:520,easing:'cubic-bezier(.4,.1,.3,1)'});
  an.onfinish=()=>v.remove();
}
function revelar(){
  G.fase='revelado'; botao(null);
  const k=G.cat, c=CAT[k], meu=G.eu[G.rodada-1], dele=G.cpu[G.rodada-1];
  const cEu=$('cartaEu'), cCpu=$('cartaCpu');
  cEu.classList.remove('escolher','chega'); cCpu.classList.remove('virada');
  const nEu=meu.nivel||0, nCpu=dele.nivel||0;
  let res;
  if(nEu||nCpu) res = nEu>nCpu ? 'eu' : nCpu>nEu ? 'cpu' : 'empate';
  else res = meu[k]>dele[k] ? 'eu' : dele[k]>meu[k] ? 'cpu' : 'empate';
  const viaTrunfo = nEu||nCpu;
  const pintar=(sel,estado,simb)=>document.querySelectorAll(sel+' .stat').forEach(el=>{
    el.classList.remove('marcada'); el.classList.add(el.dataset.k===k?estado:'apagada');
    if(el.dataset.k===k) el.querySelector('.marca-res').textContent=simb; });
  depois(380, ()=>{
    pintar('#cartaEu', res==='eu'?'ganhou':res==='cpu'?'perdeu':'empatou', res==='eu'?'✓':res==='cpu'?'✗':'=');
    pintar('#cartaCpu', res==='cpu'?'ganhou':res==='eu'?'perdeu':'empatou', res==='cpu'?'✓':res==='eu'?'✗':'=');
    if(res!=='empate'){ (res==='eu'?cEu:cCpu).classList.add('vence'); (res==='eu'?cCpu:cEu).classList.add('perde'); }
  });
  const naMesa=[meu,dele,...G.pote];
  const extra=G.pote.length?` (e mais ${G.pote.length} do monte)`:'';
  const linhaNum = viaTrunfo ? '' : `Você ${esc(c.fmt(meu))}${c.un&&!c.fmt(meu).endsWith(c.un.trim())?c.un:''} × Carlo ${esc(c.fmt(dele))}${c.un&&!c.fmt(dele).endsWith(c.un.trim())?c.un:''}`;
  if(res==='eu'){
    G.meuMonte.push(...naMesa); G.ganhos.push(...naMesa.filter(s=>G.cpu.includes(s)));
    G.pote=[]; G.vez='eu'; G.venc++; G.seq++; G.melhorSeq=Math.max(G.melhorSeq,G.seq); if(nEu) G.trunfos++;
    aviso(`<strong>Você venceu a rodada!</strong><span>${viaTrunfo?`${esc(meu.nome)} é ${NIVEL[nEu]} e leva ${esc(dele.nome)}`:linhaNum}${extra}</span>`,'bom');
  } else if(res==='cpu'){
    G.cpuMonte.push(...naMesa); G.pote=[]; G.vez='cpu'; G.seq=0;
    aviso(`<strong>Carlo venceu a rodada</strong><span>${viaTrunfo?`Ele tinha ${esc(dele.nome)} (${NIVEL[nCpu]})`:linhaNum}${extra}</span>`,'ruim',true);
  } else {
    G.pote.push(meu,dele); G.seq=0;
    aviso(`<strong>Empate!</strong><span>${viaTrunfo?'Nossa Senhora contra Nossa Senhora':linhaNum}. As cartas vão para o monte.</span>`,'emp');
    $('pote').classList.remove('novo'); void $('pote').offsetWidth; $('pote').classList.add('novo');
  }
  $('curioFaixa').innerHTML=curioDe(dele);
  depois(900, ()=>{
    if(res!=='empate') voar(res==='eu'?cCpu:cEu, res==='eu'?$('plEu'):$('plCpu'));
    depois(480, ()=>atualizarPlacar(res==='empate'?null:res));
    if(navigator.vibrate && res==='eu'){ try{ navigator.vibrate(30); }catch(e){} }
  });
  atualizarPlacar();
  // o placar só muda quando a carta "chega" nele
  $('ptEu').textContent = res==='eu' ? G.meuMonte.length-naMesa.length : G.meuMonte.length;
  $('ptCpu').textContent = res==='cpu' ? G.cpuMonte.length-naMesa.length : G.cpuMonte.length;
  depois(650, ()=>botao(G.rodada>=G.rodadas?'btnFim':'btnProxima'));
}
$('btnProxima').onclick=()=>proximaRodada();
$('btnFim').onclick=()=>fim();

/* sair da partida (janela própria, sem confirm do navegador) */
function pedirSaida(){
  abrirJanela(`<h2 id="janelaTitulo">SAIR DA PARTIDA?</h2><p class="texto">O placar desta partida será perdido.</p>
    <div class="acoes"><button class="btn btn-contorno" data-fechar data-foco>Continuar jogando</button><button class="btn btn-cheio" id="confSair">Sair</button></div>`,'ouro');
  $('confSair').onclick=()=>{ limparTimers(); G=null; $('modal').hidden=true; atualizarPlacarGeral(); mostrar('tInicio'); };
}
$('btnTopo').onclick=pedirSaida;
addEventListener('beforeunload',e=>{ if(G && G.fase && G.fase!=='fim' && G.rodada>1){ e.preventDefault(); e.returnValue=''; } });

/* ===================== FIM ===================== */
function fim(){
  if(!G) return;
  limparTimers();
  const eu=G.meuMonte.length, cpu=G.cpuMonte.length, est=ler('estatisticas',{v:0,d:0,e:0});
  let titulo, frase;
  if(eu>cpu){ est.v++; titulo='Você venceu!'; frase=`Você terminou com ${eu} cartas contra ${cpu} do Carlo.`; }
  else if(cpu>eu){ est.d++; titulo='Quase!'; frase=`O Carlo venceu por ${cpu} a ${eu}. Que tal uma revanche?`; }
  else { est.e++; titulo='Empate!'; frase=`Os dois terminaram com ${eu} cartas.`; }
  if(G.pote.length) frase+=` ${G.pote.length} cartas ficaram no monte do empate.`;
  gravar('estatisticas',est);
  $('vTitulo').textContent=titulo; $('vFrase').textContent=frase; $('vCoroa').toggleAttribute('hidden', eu<=cpu);
  $('fEu').textContent=eu; $('fCpu').textContent=cpu;
  $('dVenc').textContent=G.venc; $('dSeq').textContent=G.melhorSeq; $('dTrunfo').textContent=G.trunfos;
  const ganhos=G.ganhos.filter((s,i,a)=>a.indexOf(s)===i);
  $('conquistados').innerHTML = ganhos.length
    ? ganhos.slice(0,3).map(s=>miniHTML(s,false)).join('')
      + (ganhos.length>3?`<div class="monte" aria-label="e mais ${ganhos.length-3}"><span></span><span></span><span></span><b>+${ganhos.length-3}</b></div>`:'')
    : '<p class="vazio">Nenhum santo do Carlo desta vez. Na próxima eles vêm!</p>';
  G.resumo={eu,cpu}; G.fase='fim';
  mostrar('tFim'); atualizarPlacarGeral();
  if(window.CarludixAds && CarludixAds.render) CarludixAds.render();
}
$('btnDeNovo').onclick=()=>novoJogo(ultimaRodadas);
$('btnInicio').onclick=()=>{ G=null; mostrar('tInicio'); };
$('btnCompartilhar').onclick=async()=>{
  const r=G&&G.resumo; if(!r) return;
  const frase=r.eu>r.cpu?`Venci o Carlo por ${r.eu} a ${r.cpu}`:r.cpu>r.eu?`O Carlo me venceu por ${r.cpu} a ${r.eu}`:`Empatei com o Carlo em ${r.eu} a ${r.cpu}`;
  const texto=`✠ Trunfo Celeste · ${frase}! Desafie você também:`, url=location.origin+location.pathname;
  try{ if(navigator.share){ await navigator.share({title:'Trunfo Celeste',text:texto,url}); return; }
       await navigator.clipboard.writeText(texto+' '+url); toast('Resultado copiado!'); }catch(e){}
};

/* ===================== BARALHO ===================== */
const semAcento=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let filtro='todos';
function montarGaleria(){
  const f=semAcento($('busca').value.trim()), ord=$('ordem').value;
  let lista=SANTOS.filter(s=> filtro==='todos' || (filtro==='trunfos'&&s.nivel) || (filtro==='santos'&&!s.nivel) || (filtro==='brasil'&&BRASIL.has(s.id)))
    .filter(s=>!f||semAcento(s.nome+' '+s.local+' '+s.titulo).includes(f));
  lista.sort(ord==='nome' ? (a,b)=>(b.nivel||0)-(a.nivel||0)||a.nome.localeCompare(b.nome,'pt')
                          : (a,b)=>(b[ord]??-1e9)-(a[ord]??-1e9)||a.nome.localeCompare(b.nome,'pt'));
  $('contagem').textContent = `${lista.length} carta${lista.length===1?'':'s'}${ord!=='nome'?` · maior ${CAT[ord].nome.toLowerCase()} primeiro`:''}`;
  $('galeria').innerHTML = lista.length ? lista.map(s=>miniHTML(s,true)).join('') : '<p class="vazio">Nenhum santo encontrado.</p>';
}
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
  filtro=ch.dataset.f; document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', x===ch?'true':'false')); montarGaleria();
});
$('ordem').onchange=montarGaleria;
$('busca').addEventListener('input',montarGaleria);
$('galeria').addEventListener('click',e=>{
  const b=e.target.closest('.mcard[data-id]'); if(!b) return;
  const s=SANTOS.find(x=>x.id===b.dataset.id);
  abrirJanela(`<button class="fechar" data-fechar aria-label="Fechar">×</button><h2 id="janelaTitulo" class="sr">${esc(s.nome)}</h2>
    <div class="cena"><div class="carta">${cartaHTML(s,false)}</div></div>`,'carta-aberta');
});
$('btnBaralho').onclick=()=>{ montarGaleria(); mostrar('tBaralho'); };
$('btnVoltarBaralho').onclick=()=>mostrar('tInicio');
document.querySelectorAll('[data-rodadas]').forEach(b=>b.onclick=()=>novoJogo(+b.dataset.rodadas));

/* ===================== TECLADO (computador) ===================== */
document.addEventListener('keydown',e=>{
  if(!G || !$('tJogo').classList.contains('ativa') || !$('modal').hidden) return;
  const alvo=e.target;
  if((alvo&&alvo.closest&&alvo.closest('input,textarea,select'))||e.ctrlKey||e.metaKey||e.altKey) return;
  const n='1234'.indexOf(e.key);
  if(n>=0 && G.fase==='escolha'){ e.preventDefault(); $('cartaEu').querySelector(`.stat[data-k="${CATS[n].k}"]`).click(); return; }
  if(e.key==='Enter'||e.key===' '){ const b=['btnProxima','btnFim'].map($).find(x=>x.classList.contains('on')); if(b){ e.preventDefault(); b.click(); } }
});
</script>
