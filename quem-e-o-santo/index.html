<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>Quem é o Santo?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&family=Kaushan+Script&display=swap">
<style>
/* Layout: palco de basílica à noite — vitrine do logo à esquerda, painel dourado do jogo à direita; empilha no celular */
:root{
  --night:#070d24; --navy:#0d1838; --panel:#0f1d44; --panel2:#15275a; --line:#2a3d78;
  --gold:#f7c531; --gold2:#e09a12; --goldhi:#fff1b0; --ink:#f3f5ff; --muted:#a9b4da;
  --green:#22a447; --green2:#147a31; --red:#d63645; --blue:#2f6fe0;
  --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --script:"Kaushan Script", "Brush Script MT", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background:
   radial-gradient(60% 50% at 22% 18%, rgba(47,111,224,.35), transparent 70%),
   radial-gradient(40% 35% at 30% 10%, rgba(247,197,49,.18), transparent 70%),
   radial-gradient(70% 60% at 85% 100%, rgba(47,111,224,.18), transparent 70%),
   var(--night);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.voltar{text-decoration:none;display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:rgba(13,24,56,.85);font-family:var(--display);font-weight:800;font-size:1.1rem;color:#fff}
.voltar span{color:var(--red)}
.voltar:hover{border-color:var(--gold)}
.voltar:focus-visible{outline:3px solid #fff;outline-offset:3px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.02em;line-height:1;color:#fff;
  text-shadow:0 2px 0 #000}
.brand span{color:var(--red)} .brand small{display:block;font-size:.7rem;letter-spacing:.42em;color:var(--gold);text-align:center}
.nav{display:flex;gap:4px;background:rgba(13,24,56,.85);border:1.5px solid var(--line);border-radius:999px;padding:4px}
.nav button{font:inherit;font-weight:700;font-size:.9rem;color:var(--ink);background:transparent;border:0;padding:8px 16px;border-radius:999px;cursor:pointer}
.nav button[aria-pressed="true"]{background:linear-gradient(var(--panel2),var(--panel));box-shadow:inset 0 -3px 0 var(--red)}

/* grade principal */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.hero img{width:100%;max-width:520px;height:auto;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(247,197,49,.25))}
.tag{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.15;margin:0;transform:rotate(-3deg);
  text-wrap:balance;text-shadow:0 3px 0 #000}
.tag b{color:var(--gold);font-style:italic}
.ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;padding:10px 26px;border-radius:999px;border:2px solid var(--goldhi);
  color:#1b1300;background:linear-gradient(180deg,var(--goldhi),var(--gold) 45%,var(--gold2));
  box-shadow:0 5px 0 #7a4f00,0 10px 24px rgba(247,197,49,.25);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a4f00}
.btn.dark{color:var(--ink);background:linear-gradient(180deg,var(--panel2),var(--navy));border-color:#5d75c2;box-shadow:0 5px 0 #030612}
.btn.green{color:#fff;border-color:#7fe39a;background:linear-gradient(180deg,#45c867,var(--green) 50%,var(--green2));box-shadow:0 5px 0 #0b4a1d;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.nav button:focus-visible,.sug button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* painel do jogo */
.board{position:relative;border-radius:22px;padding:22px 18px 18px;background:linear-gradient(180deg,rgba(21,39,90,.92),rgba(10,19,46,.96));
  border:2.5px solid var(--gold);box-shadow:0 0 0 4px rgba(247,197,49,.12),0 20px 50px rgba(0,0,0,.55),inset 0 0 40px rgba(47,111,224,.15);
  display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.ribbon{max-width:100%;display:flex;align-items:center;gap:12px;margin-top:-40px;align-self:flex-start;
  background:linear-gradient(180deg,var(--goldhi),var(--gold) 50%,var(--gold2));color:#1b1300;border-radius:14px;padding:6px 16px 6px 10px;
  box-shadow:0 6px 18px rgba(0,0,0,.45);border:2px solid #fff3c4}
.ribbon .cal{font-size:1.6rem;line-height:1}
.ribbon b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1}
.ribbon small{font-weight:700;font-size:.82rem}
.panes{display:flex;flex-direction:column;gap:8px}
.pane{scroll-margin:90px 0 140px;display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:14px;
  background:rgba(7,13,36,.6);border:1.5px solid var(--line);color:var(--muted)}
.pane .glass{width:80px;height:92px;position:relative;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.vitral{width:100%;height:100%;display:block;overflow:visible}
.pane.on .glass{filter:drop-shadow(0 0 10px rgba(247,197,49,.55)) drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.pane.on .glass::after{content:"";position:absolute;inset:6px 6px 2px;border-radius:40px 40px 4px 4px;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;
  animation:reflexo 5s ease-in-out infinite;mix-blend-mode:screen}
@keyframes reflexo{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
.pane .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pane .lab{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.pane .val{font-weight:700;font-size:1.02rem;color:var(--ink);overflow-wrap:anywhere}
.pane .val.locked{color:var(--muted);font-weight:600;font-style:italic;font-size:.92rem}
.pane:not(.on) .lab{color:#7d88b3}
.pane.on{border-color:rgba(247,197,49,.55);background:linear-gradient(90deg,rgba(247,197,49,.10),rgba(7,13,36,.55) 40%)}
.pane.fresh{animation:acende .9s ease-out}
@keyframes acende{0%{transform:scale(.97);box-shadow:0 0 0 0 rgba(247,197,49,.9)}100%{transform:none;box-shadow:0 0 0 14px rgba(247,197,49,0)}}

.guess{display:flex;flex-direction:column;gap:8px;position:relative}
.row{display:flex;gap:10px}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;font:inherit;font-weight:600;font-size:1.02rem;padding:13px 14px 13px 44px;border-radius:14px;
  border:2px solid #8fa0d6;background:rgba(7,13,36,.75);color:var(--ink)}
.search input::placeholder{color:#8590b8}
.search input:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.sug{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:5;background:var(--panel);border:2px solid var(--gold);border-radius:14px;
  max-height:260px;overflow:auto;display:flex;flex-direction:column;box-shadow:0 -12px 30px rgba(0,0,0,.55)}
.sug button{font:inherit;font-weight:700;text-align:left;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.sug button.act,.sug button:hover{background:var(--panel2);color:var(--gold)}
.msg{min-height:1.2em;margin:0;font-weight:700;color:#ff8a95}
.arcos{display:grid;grid-template-columns:repeat(6,minmax(0,52px));justify-content:center;gap:8px}
.arco{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.arco.lit{filter:drop-shadow(0 0 10px rgba(247,197,49,.7))}
.arco.ok{filter:drop-shadow(0 0 10px rgba(69,200,103,.7))}
.prox{margin:0;font-size:.9rem;font-weight:700;color:var(--muted);padding:2px 4px}
.prox b{color:var(--ink)}
.tries{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.tries:empty{display:none}
.tries li{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding:7px 12px;border-radius:12px;background:rgba(214,54,69,.10);border:1.5px solid rgba(214,54,69,.45);font-size:.9rem}
.tries li.ok{background:rgba(34,164,71,.15);border-color:rgba(34,164,71,.6)}
.tries li.novo{animation:entra .5s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tries .n{font-weight:800;font-size:.98rem}
.tries .tags{color:var(--muted);font-weight:600}
.tries .tags .dir{color:var(--goldhi);font-weight:800}
.result{scroll-margin:16px;border-radius:16px;padding:16px;background:rgba(7,13,36,.6);border:1.5px solid var(--gold);display:flex;flex-direction:column;gap:10px;text-align:center}
.result .kick{margin:0;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;color:var(--gold)}
.result h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05;text-wrap:balance;
  background:linear-gradient(180deg,#fff7cf,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.result p{margin:0}
.result.win{border-width:2.5px;background:radial-gradient(120% 80% at 50% 0%,rgba(247,197,49,.28),rgba(7,13,36,.7) 60%);box-shadow:0 0 0 4px rgba(247,197,49,.15),0 0 40px rgba(247,197,49,.35);animation:festa 1.1s ease-out}
.result.win h2{font-size:2.3rem}
@keyframes festa{0%{transform:scale(.92);box-shadow:0 0 0 0 rgba(247,197,49,.9)}60%{transform:scale(1.02)}100%{transform:none}}
.result.lose{border-color:var(--line)}
.share{font-size:1.5rem;letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums;padding:10px;border-radius:12px;background:rgba(21,39,90,.6);border:1px solid var(--line)}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats small{color:var(--muted);font-weight:700;font-size:.8rem}
.stats b{font-family:var(--display);font-size:1.5rem;line-height:1}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.result .msg{color:var(--ink);font-weight:600;white-space:pre-line}

/* rodapé de destaques */
.feats{display:flex;justify-content:center;padding:18px;border-radius:16px;background:rgba(13,24,56,.75);border:1.5px solid var(--line)}
.feat{display:flex;gap:10px;align-items:center;min-width:0}
.feat i{font-style:normal;font-size:1.6rem;color:var(--gold);text-shadow:0 0 12px rgba(247,197,49,.6)}
.feat b{display:block;color:var(--gold);font-family:var(--display);font-size:1.05rem;line-height:1.1}
.feat span{color:var(--muted);font-size:.88rem;font-weight:600}
.feat b span{color:inherit;font-size:inherit;font-weight:inherit}
.motto{font-family:var(--script);font-size:1.6rem;color:#fff;transform:rotate(-3deg);text-align:center;line-height:1.1}

@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr);gap:30px}
  .hero{flex-direction:row;justify-content:center;text-align:left;gap:12px;padding-top:0}
  .hero img{width:104px;max-width:104px;flex:none}
  .hero .tag{transform:none;font-size:1.08rem}
  .board{padding-top:20px}
  .feats{grid-template-columns:minmax(0,1fr)}
  .motto{text-align:center}
}
@media (max-width:420px){.top{flex-wrap:nowrap;gap:8px}.voltar{padding:7px 12px;font-size:.98rem;flex:none}.nav{flex:none}.nav button{padding:7px 10px;font-size:.8rem}.btn{font-size:1.02rem;padding:10px 18px}.row{flex-direction:column}.pane{grid-template-columns:56px minmax(0,1fr)}.pane .glass{width:56px;height:64px}}
@media (prefers-reduced-motion:reduce){.pane.on .glass::after{animation:none;opacity:0}.pane.fresh{animation:none}.btn{transition:none}}
</style>
</head>

o Tomás Becket": "Inglaterra", "São Pedro Nolasco": "França", "São Raimundo Nonato": "Espanha", "Santa Edwiges": "Alemanha", "Santa Isabel da Hungria": "Hungria", "São Luís IX": "França", "Santo Alberto Magno": "Alemanha", "São Boaventura": "Itália", "Santa Zita": "Itália", "São Roque": "França", "Santa Brígida da Suécia": "Suécia", "São João Nepomuceno": "Tchéquia", "São Nuno de Santa Maria": "Portugal", "São Vicente Ferrer": "Espanha", "São Bernardino de Siena": "Itália", "São Casimiro": "Polônia", "São Francisco de Paula": "Itália", "São Jerônimo Emiliani": "Itália", "Santa Ângela Mérici": "Itália", "São Caetano": "Itália", "São Tomás More": "Inglaterra", "São João de Deus": "Portugal", "São João de Ávila": "Espanha", "São Pedro de Alcântara": "Espanha", "São Francisco de Borja": "Espanha", "São Pascoal Bailão": "Espanha", "São Luís Gonzaga": "Itália", "São Paulo Miki": "Japão", "São Filipe Néri": "Itália", "São Carlos Borromeu": "Itália", "São Pedro Canísio": "Holanda", "São Turíbio de Mogrovejo": "Espanha", "São Francisco Solano": "Espanha", "São Roberto Belarmino": "Itália", "Santa Luísa de Marillac": "França", "São Pedro Claver": "Espanha", "Santa Mariana de Jesus": "Equador", "São Lourenço Ruiz": "Filipinas", "São José de Cupertino": "Itália", "Santa Kateri Tekakwitha": "Estados Unidos", "Santa Margarida Maria Alacoque": "França", "São João Batista de La Salle": "França", "São Luís Maria Grignion de Montfort": "França", "São Paulo da Cruz": "Itália", "São Geraldo Majela": "Itália", "Santo Afonso de Ligório": "Itália", "São Junípero Serra": "Espanha", "São João Maria Vianney": "França", "São Marcelino Champagnat": "França", "Santo André Kim Taegon": "Coreia do Sul", "Santa Bernadete": "França", "São Gabriel da Virgem Dolorosa": "Itália", "São Domingos Sávio": "Itália", "São Carlos Lwanga": "Uganda", "Santa Catarina Labouré": "França", "Santo Antônio Maria Claret": "Espanha", "São Damião de Molokai": "Bélgica", "São Charbel": "Líbano", "Santa Gema Galgani": "Itália", "São Pio X": "Itália", "São Arnaldo Janssen": "Alemanha", "Santa Josefina Bakhita": "Sudão", "Santa Francisca Xavier Cabrini": "Itália", "Santa Maria Goretti": "Itália", "São José Moscati": "Itália", "São Francisco Marto": "Portugal", "Santa Jacinta Marto": "Portugal", "São José Sánchez del Río": "México", "Santa Teresa dos Andes": "Chile", "Santa Paulina": "Itália", "São Leopoldo Mandić": "Montenegro", "Santa Faustina Kowalska": "Polônia", "Santa Teresa Benedita da Cruz": "Polônia", "São Alberto Hurtado": "Chile", "São João XXIII": "Itália", "Santa Gianna Beretta Molla": "Itália", "São Josemaría Escrivá": "Espanha", "São Paulo VI": "Itália", "São Óscar Romero": "El Salvador", "São Gregório de Nazianzo": "Turquia", "São Columba": "Irlanda", "Santo Agostinho de Cantuária": "Itália", "Santa Joana de Chantal": "França", "São Bento José Labre": "França"});
SANTOS.forEach(s=>{s.r=PAIS[s.n]||s.p});
const DICAS=[["Século","st"],["Terra natal","p"],["Padroeiro de","pad"],["Como morreu","m"],["Ordem ou obra fundada","o"],["Atributo na arte","at"]];
const LOCK='<svg viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
const PAL=[
 ["#c0182f","#e8452f","#f59b1f","#ffd23f","#8e1024","#ff7a3d"],
 ["#1747b8","#2f7bea","#5fb6ff","#a8dcff","#0e2f86","#3cc6e8"],
 ["#147a3d","#2fb35a","#7fdc5f","#d8f06a","#0b5a2c","#36c9a0"],
 ["#8c1630","#c92a46","#ef5a6a","#ff9a8a","#5e0d24","#e0364f"],
 ["#4a2392","#7b45d6","#a77df5","#dcc2ff","#30166a","#c058e0"],
 ["#b8760a","#f0a91c","#ffd24a","#fff0a8","#8a5306","#ffbf3d"]];
const PAL_OFF=["#13265e","#1a3277","#22408f","#0f1f4f","#1c3684","#2a4a9e"];
const PAL_ERR=["#9b1f2e","#d63645","#e2596d","#7a1424","#c22a3a","#f07a86"];
const PAL_OK=["#147a31","#22a447","#45c867","#0b5a1f","#7fe39a","#2fb35a"];
const VGEO=(()=>{const cx=40,cy=48,P=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
  const out=[];[[13,25,8],[25,38,12],[38,64,16]].forEach(([r1,r2,n],ri)=>{for(let k=0;k<n;k++){
    const a1=k/n*2*Math.PI-Math.PI/2+(ri%2?Math.PI/n:0),a2=a1+2*Math.PI/n,[x1,y1]=P(r1,a1),[x2,y2]=P(r2,a1),[x3,y3]=P(r2,a2),[x4,y4]=P(r1,a2);
    out.push({d:`M${x1} ${y1}L${x2} ${y2}A${r2} ${r2} 0 0 1 ${x3} ${y3}L${x4} ${y4}A${r1} ${r1} 0 0 0 ${x1} ${y1}Z`,ri,k})}});return out})();
function vitral(pal,sim,on,id){
  const cells=VGEO.map(c=>`<path d="${c.d}" fill="${pal[(c.k*(c.ri+2)+c.ri*3)%pal.length]}"/>`).join("");
  const lead=on?"#1a1206":"#050a1c";
  return `<svg class="vitral" viewBox="0 0 80 92" aria-hidden="true">
   <path d="M7 90V42A33 33 0 0 1 73 42V90Z" fill="${lead}"/>
   <g clip-path="url(#vArco)">${cells}<g fill="none" stroke="${lead}" stroke-width="1.8">${VGEO.map(c=>`<path d="${c.d}"/>`).join("")}</g>
   <rect x="0" y="0" width="80" height="92" fill="url(#${on?"vLuz":"vApagado"})"/>
   ${on?`<g opacity=".35">${[...Array(7)].map((_,k)=>`<path d="M40 48L${(40+70*Math.cos(-Math.PI/2+(k-3)*.32)).toFixed(1)} ${(48+70*Math.sin(-Math.PI/2+(k-3)*.32)).toFixed(1)}" stroke="#fff" stroke-width="${k%2?1:2.2}"/>`).join("")}</g>`:""}</g>
   <circle cx="40" cy="48" r="13" fill="${on?"#fff6d6":"#0b1638"}" stroke="${lead}" stroke-width="2"/>
   <circle cx="40" cy="48" r="10.5" fill="none" stroke="${on?"url(#vOuro)":"url(#vPrata)"}" stroke-width="1.6"/>
   <g transform="translate(40 48)" ${on?"":'color="#8fa0d6"'}>${sim}</g>
   <path d="M7 90V42A33 33 0 0 1 73 42V90Z" fill="none" stroke="${on?"url(#vOuro)":"url(#vPrata)"}" stroke-width="4" stroke-linejoin="round"/>
   <path d="M3 90H77" stroke="${on?"url(#vOuro)":"url(#vPrata)"}" stroke-width="4" stroke-linecap="round"/>
   <path d="M40 6l2 4h-4z" fill="${on?"#fff3b8":"#6d7fb8"}"/></svg>`}
const SLOCK='<g transform="translate(-6 -7)"><rect x="0" y="5.5" width="12" height="8.5" rx="1.6" fill="currentColor"/><path d="M2.6 5.5V3.6a3.4 3.4 0 0 1 6.8 0v1.9" fill="none" stroke="currentColor" stroke-width="1.8"/></g>';
const stxt=t=>`<text x="0" y="0.5" text-anchor="middle" dominant-baseline="central" font-size="12">${t}</text>`;
const sbold=(t,c)=>`<text x="0" y="1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="800" fill="${c}" font-family="Nunito,sans-serif">${t}</text>`;
const ICO=["⌛","🌍","🛡️","✝️","⛪","🎨"];
const MAX=6, LANC=Date.UTC(2026,10,6);
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const $=id=>document.getElementById(id);

function hoje(){const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())}
const numDia=Math.max(1,Math.floor((hoje()-LANC)/864e5)+1);
// embaralha a ordem de forma fixa, para que o santo do dia não siga a lista
function ordem(){const N0=49;const base=embaralha(SANTOS.slice(0,N0).map((_,i)=>i),20261106);const resto=embaralha(base.slice(1).concat(SANTOS.slice(N0).map((_,i)=>N0+i)),777);return [base[0]].concat(resto)}
function embaralha(idx,semente){let x=semente;for(let i=idx.length-1;i>0;i--){x=(x*1103515245+12345)%2147483648;const j=x%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const ORD=ordem();
const idxDia=ORD[(numDia-1)%SANTOS.length];

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let modo="dia", alvo, palpites=[], fim=false, venceu=false;

function iniciar(m){
  modo=m;
  $("mDia").setAttribute("aria-pressed",m==="dia");$("mLivre").setAttribute("aria-pressed",m==="livre");
  if(m==="dia"){
    alvo=idxDia;const salvo=store.get("quem-e-o-santo:dia",null);
    palpites=(salvo&&salvo.n===numDia)?salvo.p:[];
  }else{
    let r;do{r=Math.floor(Math.random()*SANTOS.length)}while(r===idxDia&&SANTOS.length>1);alvo=r;palpites=[];
  }
  fim=palpites.includes(alvo)||palpites.length>=MAX;venceu=palpites.includes(alvo);
  $("msg").textContent="";$("palpite").value="";fecharSug();desenhar(null);
}

function romano(r){const v={I:1,V:5,X:10,L:50,C:100};let n=0;for(let i=0;i<r.length;i++){const a=v[r[i]],c=v[r[i+1]]||0;n+=a<c?-a:a}return n}
function seculo(st){if(st==="I a.C.")return "Século I antes de Cristo";if(st==="I a.C.–I")return "Entre o século I antes de Cristo e o século I";const p=st.split("–").map(x=>x.trim());const ini=romano(p[0]),fim=romano(p[p.length-1]);const anos=fim>=21?`de ${(ini-1)*100+1} até hoje`:`anos ${(ini-1)*100+1} a ${fim*100}`;return p.length>1?`Entre os séculos ${p[0]} e ${p[1]} (${anos})`:`Século ${p[0]} (${anos})`}
function desenhar(anim){
  const s=SANTOS[alvo], abertas=fim?MAX:palpites.length+1;
  $("window").innerHTML=DICAS.slice(0,abertas).map((d,i)=>`<div class="pane on ${anim&&i===abertas-1?"fresh":""}" data-c="${i}" id="dica${i}">
      <div class="glass">${vitral(PAL[i],stxt(ICO[i]),true)}</div>
      <div class="txt"><span class="lab">Dica ${i+1} de ${MAX} · ${d[0]}</span>
      <span class="val">${d[1]==="st"?seculo(s.st):s[d[1]]}</span></div></div>`).join("");
  $("prox").innerHTML=(!fim&&abertas<MAX)?`🔒 Próxima dica: <b>${DICAS[abertas][0]}</b>, se errar este palpite`:"";
  $("arcos").innerHTML=Array.from({length:MAX},(_,i)=>{
    const st=i<palpites.length?(palpites[i]===alvo?"ok":"err"):(!fim&&i===palpites.length?"lit":"");
    const pal=st==="ok"?PAL_OK:st==="err"?PAL_ERR:st==="lit"?PAL[5]:PAL_OFF;
    const sim=st==="ok"?sbold("✓","#147a31"):st==="err"?sbold("✕","#9b1f2e"):st==="lit"?sbold(String(i+1),"#8a5306"):SLOCK;
    const rot=st==="ok"?"acertou":st==="err"?"errou":st==="lit"?"palpite atual":"ainda não usado";
    return `<span class="arco ${st}" title="Palpite ${i+1}: ${rot}">${vitral(pal,sim,!!st)}</span>`}).join("");
  $("tries").innerHTML=palpites.map((i,k)=>{
    const g=SANTOS[i],novo=anim!==null&&k===palpites.length-1?" novo":"";
    if(i===alvo)return `<li class="ok${novo}"><span class="n">${g.n}</span><span class="tags">acertou!</span></li>`;
    const comp=g.s===s.s?"mesmo século":(g.s>s.s?"↑ o santo é mais antigo":"↓ o santo é mais recente");
    const pais=g.r===s.r?"mesmo país de hoje":"outro país";
    return `<li class="${novo}"><span class="n">${g.n}</span><span class="tags">séc. ${g.st} · <span class="dir">${comp}</span> · ${pais}</span></li>`}).reverse().join("");
  $("palpite").disabled=fim;$("enviar").disabled=fim;$("guessBox").hidden=fim;
  const r=$("result");
  if(!fim){r.hidden=true;return}
  r.hidden=false;r.className="result "+(venceu?"win":"lose");
  const quadros=Array.from({length:MAX},(_,i)=>i<palpites.length?(palpites[i]===alvo?"🟩":"🟥"):"⬜").join("");
  const st=store.get("quem-e-o-santo:stats",{j:0,v:0,seq:0,max:0});
  r.innerHTML=`<p class="kick">${venceu?(palpites.length===1?"Acertou de primeira!":"Acertou em "+palpites.length+" de "+MAX+"!"):"Não foi desta vez. Era:"}</p>
    <h2>${s.n}</h2><p>Festa litúrgica: ${s.f}</p>
    <div class="share" aria-label="Resultado">${quadros}</div>
    ${modo==="dia"?`<div class="stats"><div><small>🎮 Jogos</small><b>${st.j}</b></div><div><small>🎯 Acertos</small><b>${st.j?Math.round(st.v/st.j*100):0}%</b></div><div><small>🏆 Seguidas</small><b>${st.seq}</b></div></div>`:""}
    <div class="acts">${modo==="dia"?`<button class="btn green" id="copiar">📲 Copiar resultado</button>`:""}<button class="btn dark" id="outro">${modo==="dia"?"Treinar com outro santo":"Outro santo"}</button></div>
    <p class="msg" id="msgR" aria-live="polite"></p>`;
  const txt=`Quem é o Santo? Nº ${numDia}\n${quadros} ${venceu?palpites.length:"X"}/${MAX}\n${location.origin+location.pathname}`;
  if($("copiar"))$("copiar").onclick=()=>{
    const pre=()=>{$("msgR").textContent="Copiado. É só colar na conversa."};
    try{navigator.clipboard.writeText(txt).then(pre,()=>{$("msgR").textContent=txt})}catch(e){$("msgR").textContent=txt}};
  $("outro").onclick=()=>{iniciar("livre");rolar($("jogo"),"start")};
}
const calmo=matchMedia("(prefers-reduced-motion: reduce)").matches;
const toque=matchMedia("(pointer: coarse)").matches;
function rolar(el,bloco){if(el)el.scrollIntoView({behavior:calmo?"auto":"smooth",block:bloco||"center"})}

function palpitar(i){
  if(fim||i==null)return;
  if(palpites.includes(i)){$("msg").textContent="Você já tentou esse santo.";$("msg").className="msg bad";return}
  palpites.push(i);$("palpite").value="";fecharSug();
  venceu=i===alvo;fim=venceu||palpites.length>=MAX;
  $("msg").textContent=venceu?"":(fim?"":"Não é esse. Nova dica acesa acima!");$("msg").className="msg bad";
  if(modo==="dia"){
    store.set("quem-e-o-santo:dia",{n:numDia,p:palpites});
    if(fim){const st=store.get("quem-e-o-santo:stats",{j:0,v:0,seq:0,max:0,ult:0});
      if(st.ult!==numDia){st.j++;if(venceu){st.v++;st.seq=(st.ult===numDia-1?st.seq:0)+1;st.max=Math.max(st.max,st.seq)}else st.seq=0;st.ult=numDia;store.set("quem-e-o-santo:stats",st)}}
  }
  desenhar(!fim);
  if(fim){setTimeout(()=>rolar($("result"),"start"),80)}
  else{setTimeout(()=>rolar($("dica"+(palpites.length)),"center"),80);if(!toque)$("palpite").focus()}
}

/* autocomplete */
let sugs=[],ativo=-1;
function buscar(q){const n=norm(q);if(!n)return[];
  return SANTOS.map((s,i)=>({i,s,score:[norm(s.n),...s.a.map(norm)].some(t=>t.startsWith(n))?0:([norm(s.n),...s.a.map(norm)].some(t=>t.includes(n))?1:9)}))
   .filter(x=>x.score<9&&!palpites.includes(x.i)).sort((a,b)=>a.score-b.score||a.s.n.localeCompare(b.s.n)).slice(0,6)}
function abrirSug(){const box=$("sug");sugs=buscar($("palpite").value);ativo=sugs.length?0:-1;
  if(!sugs.length){fecharSug();return}
  box.innerHTML=sugs.map((x,k)=>`<button role="option" data-i="${x.i}" class="${k===ativo?"act":""}">${x.s.n}</button>`).join("");box.hidden=false;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>palpitar(+b.dataset.i))}
function fecharSug(){$("sug").hidden=true;sugs=[];ativo=-1}
$("palpite").addEventListener("input",abrirSug);
$("palpite").addEventListener("focus",()=>{if(toque)setTimeout(()=>rolar($("palpite"),"center"),300)});
$("palpite").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!sugs.length)return;e.preventDefault();ativo=(ativo+(e.key==="ArrowDown"?1:-1)+sugs.length)%sugs.length;
    $("sug").querySelectorAll("button").forEach((b,k)=>b.classList.toggle("act",k===ativo))}
  else if(e.key==="Enter"){e.preventDefault();enviar()}
  else if(e.key==="Escape")fecharSug()});
function enviar(){
  if(ativo>=0&&sugs[ativo])return palpitar(sugs[ativo].i);
  const n=norm($("palpite").value);const ex=SANTOS.findIndex(s=>norm(s.n)===n||s.a.some(a=>norm(a)===n));
  if(ex>=0)return palpitar(ex);
  $("msg").textContent=n?"Esse nome não está no acervo. Escolha um da lista.":"";$("msg").className="msg bad"}
$("enviar").onclick=enviar;
document.addEventListener("click",e=>{if(!e.target.closest(".guess"))fecharSug()});
$("mDia").onclick=()=>iniciar("dia");$("mLivre").onclick=()=>iniciar("livre");

$("numDia").textContent=numDia;
$("dataHoje").textContent=new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"short"});
iniciar("dia");
</script>
