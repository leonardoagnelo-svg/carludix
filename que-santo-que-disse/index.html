<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>Que santo que disse?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Spectral:ital,wght@0,400;1,400;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout do Leo (banner Carludix Play): logo + chamada no topo; à esquerda frase e 4 opções com Confirmar; à direita painel do resultado; faixa de placar embaixo. Visual único: noite azul-marinho e ouro. */
:root{
  color-scheme:dark;
  --bg:#0a1430; --bg2:#0f1d44; --panel:#101f4a; --panel2:#0c1838;
  --gold:#f2c14e; --gold2:#c98d1a; --goldline:rgba(242,193,78,.55);
  --ink:#f3ecd8; --muted:#a9b3cf; --line:#2a3d73;
  --ok:#3fd07a; --no:#ef5a5a;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --quote:"Spectral",Georgia,serif;
  --ui:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;
  background:radial-gradient(1200px 600px at 75% -10%,#1d3a86 0%,transparent 60%),radial-gradient(800px 500px at 0% 30%,rgba(201,141,26,.18),transparent 60%),var(--bg);min-height:100%}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.top{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:20px;align-items:center}
.logo{width:100%;aspect-ratio:1;object-fit:contain;height:auto;display:block;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5))}
.tag{font-family:var(--ui);font-weight:800;font-style:italic;font-size:clamp(18px,2.6vw,28px);line-height:1.2;text-wrap:balance;transform:rotate(-2deg);margin:0}
.tag::after{content:"";display:block;width:220px;max-width:60%;height:3px;margin-top:10px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px}
.feats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;color:var(--muted);font-size:13px;font-weight:700}
.feats b{color:var(--gold);font-size:16px}

.board{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;border:2px solid var(--goldline);border-radius:18px;padding:18px;background:linear-gradient(180deg,rgba(16,31,74,.92),rgba(10,20,48,.92));box-shadow:0 0 0 1px rgba(242,193,78,.12) inset,0 0 40px rgba(242,193,78,.12)}
.play{display:flex;flex-direction:column;gap:16px;min-width:0}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{border:1px solid var(--goldline);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #4a5d93;display:grid;place-items:center;font-size:10px;font-weight:800;color:#0a1430}
.dot.cur{border-color:var(--gold);box-shadow:0 0 8px rgba(242,193,78,.6)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--no);border-color:var(--no)}

.qcard{position:relative;border:1.5px solid var(--goldline);border-radius:14px;padding:28px 26px;background:radial-gradient(400px 200px at 0% 100%,rgba(242,193,78,.14),transparent 70%),var(--panel2);min-height:150px;display:flex;align-items:center}
.qcard blockquote{margin:0;font-family:var(--quote);font-style:italic;font-weight:500;font-size:clamp(20px,2.7vw,28px);line-height:1.35;text-align:center;width:100%;text-wrap:balance}
.qcard blockquote::before,.qcard blockquote::after{font-family:Georgia,serif;font-style:normal;color:var(--gold);font-size:1.5em;line-height:0;vertical-align:-.3em}
.qcard blockquote::before{content:"\201C";margin-right:.15em}
.qcard blockquote::after{content:"\201D";margin-left:.1em}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:12px;border:1.5px solid var(--line);background:linear-gradient(180deg,#14275a,#0f1e48);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s;min-width:0}
.opt:hover:not(:disabled){border-color:var(--goldline)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(242,193,78,.35)}
.opt.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset,0 0 18px rgba(63,208,122,.35)}
.opt.no{border-color:var(--no);box-shadow:0 0 0 1px var(--no) inset}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.55}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#2a1a00;background:radial-gradient(circle at 35% 30%,#ffe7a3,var(--gold) 55%,var(--gold2));box-shadow:0 0 0 2px #0a1430,0 0 0 3.5px var(--gold)}
.ot{display:flex;flex-direction:column;min-width:0}
.on{font-weight:800;font-size:15.5px}
.od{font-size:12px;color:var(--muted)}
.confirm{align-self:center;font:inherit;font-weight:800;font-size:17px;color:#1f1400;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;background:linear-gradient(180deg,#ffd970,var(--gold) 50%,var(--gold2));box-shadow:0 4px 0 #8a5c08,0 0 22px rgba(242,193,78,.35);display:flex;align-items:center;gap:10px}
.confirm:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed;box-shadow:none}
.confirm:focus-visible{outline:2px solid #fff;outline-offset:3px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #8a5c08}
.tri{width:0;height:0;border-left:12px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}

.side{border:1.5px solid var(--goldline);border-radius:14px;background:var(--panel2);padding:20px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side .wait{color:var(--muted);text-align:center;margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.side .wait .av{width:72px;height:72px;font-size:28px;opacity:.5}
.verdict{font-family:var(--ui);font-weight:800;font-size:24px;display:flex;align-items:center;gap:10px;justify-content:center}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.mark{width:32px;height:32px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-size:17px}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.who .av{width:84px;height:84px;font-size:30px}
.who .n{font-family:var(--display);font-weight:800;color:var(--gold);font-size:19px;line-height:1.2}
.who .d{font-size:12.5px;color:var(--muted)}
.info{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px}
.info .ic{color:var(--gold);font-weight:800;font-family:Georgia,serif;font-size:20px;line-height:1}
.info b{display:block;color:var(--gold);font-size:13px}
.next{font:inherit;font-weight:800;color:var(--ink);background:transparent;border:1.5px solid var(--gold);border-radius:999px;padding:10px 18px;cursor:pointer;margin-top:auto}
.next:hover{background:rgba(242,193,78,.12)}
.next:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid var(--line);border-radius:14px;background:rgba(12,24,56,.85)}
.cell{display:flex;align-items:center;gap:12px;padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.cell:first-child{border-left:0}
.cell .k{font-family:var(--display);font-weight:800;color:var(--gold);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.cell .l{font-size:13px;color:var(--muted);font-weight:600;line-height:1.25}

.end{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:10px 0}
.end .big{font-family:var(--display);font-weight:800;font-size:72px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.end h2{font-family:var(--display);margin:0;font-size:24px}
.share{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;white-space:pre-wrap;user-select:all;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left;font-size:14px;max-width:640px;width:100%}
.review li{display:flex;gap:8px}
.review .m{font-weight:800;width:1.2em;flex:none}
.review .m.ok{color:var(--ok)} .review .m.no{color:var(--no)}
.review i{color:var(--ink)} .review span.a{color:var(--muted)}
.back{align-self:flex-start;font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:13px;color:var(--gold);text-decoration:none;border:1.5px solid var(--goldline);border-radius:999px;padding:6px 14px}
.back:hover{background:rgba(242,193,78,.12)}
.back:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{font-size:12px;color:var(--muted);text-align:center}

@media (max-width:860px){
  .top{grid-template-columns:1fr;justify-items:center;text-align:center}
  .logo{max-width:280px}
  .tag{transform:none}.tag::after{margin-inline:auto}
  .feats{justify-content:center}
  .board{grid-template-columns:1fr;padding:14px}
  .strip{grid-template-columns:1fr 1fr}
  .cell:nth-child(3){border-left:0}
  .cell:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .qcard{padding:22px 16px}
  .cell{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="wrap">

</div>

const $ = id => document.getElementById(id);
const shuf = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini = k => { const w = A[k].n.replace(/^(São|Santo|Santa|Papa)\s+/,"").split(/\s+/).filter(x => !/^(de|da|do|dos)$/.test(x)); return (w[0][0] + (w[1] ? w[1][0] : "")).toUpperCase(); };

function options(q) {
  const keys = Object.keys(A).filter(k => k !== q.a);
  const same = shuf(keys.filter(k => A[k].g === A[q.a].g));
  const other = shuf(keys.filter(k => A[k].g !== A[q.a].g));
  return shuf([q.a, ...[...same.slice(0, 2), ...other].slice(0, 3)]);
}

function start() {
  deck = shuf(Q).slice(0, N).map(q => ({...q, o: options(q)}));
  i = 0; score = 0; streak = 0; best = 0; log = [];
  render();
}

function stats() {
  $("sc").textContent = score; $("st").textContent = streak; $("bs").textContent = best;
}

function dots() {
  return Array.from({length:N}, (_, k) => {
    const l = log[k]; const c = l ? (l.ok ? "ok" : "no") : (k === i ? "cur" : "");
    return `<span class="dot ${c}">${l ? (l.ok ? "✓" : "✕") : ""}</span>`;
  }).join("");
}

function render() {
  sel = null; done = false; stats();
  const q = deck[i];
  $("board").innerHTML = `
  <div class="play">
    <div class="prog"><span class="pill">Frase ${i + 1} de ${N}</span><div class="dots">${dots()}</div></div>
    <div class="qcard"><blockquote>${esc(q.t)}</blockquote></div>
    <div class="opts">${q.o.map(k => `<button class="opt" data-k="${k}"><span class="av">${ini(k)}</span><span class="ot"><span class="on">${A[k].n}</span><span class="od">${A[k].d}</span></span></button>`).join("")}</div>
    <button class="confirm" id="cf" disabled><span class="tri"></span>Confirmar resposta</button>
  </div>
  <aside class="side" id="side"><div class="wait"><span class="av">?</span><span>Escolha um autor e confirme para ver se acertou, a fonte e o contexto da frase.</span></div></aside>`;
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (done) return;
    sel = b.dataset.k;
    document.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o === b));
    $("cf").disabled = false;
  }));
  $("cf").addEventListener("click", confirmA);
}

function confirmA() {
  if (!sel || done) return;
  done = true;
  const q = deck[i], ok = sel === q.a;
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true; b.classList.remove("sel");
    if (b.dataset.k === q.a) b.classList.add("ok");
    else if (b.dataset.k === sel) b.classList.add("no");
  });
  $("cf").disabled = true;
  if (ok) { score++; streak++; best = Math.max(best, streak); } else streak = 0;
  log.push({q, ok}); stats();
  document.querySelector(".dots").innerHTML = dots();
  const last = i === N - 1;
  $("side").innerHTML = `
    <div class="verdict ${ok ? "ok" : "no"}"><span class="mark">${ok ? "✓" : "✕"}</span>${ok ? "Acertou!" : "Errou!"}</div>
    <div class="who"><span class="av">${ini(q.a)}</span><span class="n">${A[q.a].n}</span><span class="d">${A[q.a].d}</span></div>
    <div class="info"><span class="ic">§</span><div><b>Fonte</b>${esc(q.s)}</div></div>
    <div class="info"><span class="ic">“</span><div><b>Contexto</b>${esc(q.c)}</div></div>
    <button class="next" id="nx">${last ? "Ver resultado" : "Próxima frase"}</button>`;
  $("nx").addEventListener("click", () => { i++; i < N ? render() : end(); });
  $("nx").focus();
}

function end() {
  const msg = score === N ? "Doutor da Igreja!" : score >= 8 ? "Leitor assíduo da Liturgia das Horas." : score >= 5 ? "Bom catequista." : "Hora de abrir o Catecismo.";
  const grid = log.map(l => l.ok ? "🟩" : "🟥").join("");
  const share = `Que santo que disse? ${score}/${N}\n${grid}\nMaior sequência: ${best}`;
  $("board").innerHTML = `<div class="end">
    <span class="pill">Resultado</span>
    <div class="dots">${dots()}</div>
    <div class="big">${score}<span style="font-size:.4em;color:var(--muted)">/${N}</span></div>
    <h2>${msg}</h2>
    <div class="share" id="sh">${esc(share)}</div>
    <div class="row"><button class="confirm" id="again"><span class="tri"></span>Jogar de novo</button><button class="next" id="cp" style="margin:0">Copiar resultado</button></div>
    <ul class="review">${log.map(l => `<li><span class="m ${l.ok ? "ok" : "no"}">${l.ok ? "✓" : "✕"}</span><span><i>${esc(l.q.t.length > 64 ? l.q.t.slice(0, 62) + "…" : l.q.t)}</i> <span class="a">— ${A[l.q.a].n} · ${esc(l.q.s)}</span></span></li>`).join("")}</ul>
  </div>`;
  $("again").addEventListener("click", start);
  $("cp").addEventListener("click", () => {
    const b = $("cp");
    navigator.clipboard.writeText(share).then(() => b.textContent = "Copiado").catch(() => {
      const r = document.createRange(); r.selectNodeContents($("sh")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Texto selecionado";
    });
  });
}

$("fq").textContent = Q.length;
start();
</script>
</body>
</html>
