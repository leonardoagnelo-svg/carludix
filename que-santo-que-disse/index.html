<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>Que santo que disse?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Quiz católico: leia a frase de um santo ou papa e descubra quem disse. Cada frase com a fonte.">
<meta name="theme-color" content="#081128">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Direção: catedral à noite. Navy profundo, ouro metálico, rubi; vitrais nas laterais (canvas); pergaminho para a frase; painel de revelação com fita rubi.
   Layout: cabeçalho compacto (logo + chamada + ícones) → tabuleiro em 2 colunas (pergunta | revelação) → placar com ícones. Celular: 1 coluna. */
:root{
  color-scheme:dark;
  --night:#060d22; --navy:#0b1838; --navy2:#10224d; --navy3:#162d63; --line:#2b4180;
  --gold:#f3c552; --gold-hi:#ffe9a8; --gold-lo:#b07a14; --goldline:rgba(243,197,82,.55);
  --ruby:#a3182f; --ruby-hi:#d23a4f; --ruby-lo:#5e0b18;
  --parch:#f3e3bd; --parch2:#e2c68c; --ink-dark:#2a1a0c; --ink-brown:#6b4a22;
  --ink:#f6efdc; --muted:#b9c2dc;
  --ok:#41d483; --ok-bg:rgba(65,212,131,.14); --no:#ff6b6b; --no-bg:rgba(255,107,107,.13); --hint:#f3c552;
  --metal:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 38%,var(--gold-lo) 100%);
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --quote:"Cormorant Garamond","Garamond",Georgia,serif;
  --ui:"Alegreya Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{font-family:var(--ui);font-size:16px;line-height:1.45;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;
  background:
    radial-gradient(900px 520px at 50% -8%,rgba(52,92,200,.45),transparent 65%),
    radial-gradient(700px 700px at 50% 120%,rgba(163,24,47,.22),transparent 60%),
    linear-gradient(180deg,#0a1636,var(--night) 70%);}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* Vitrais laterais */
.glass{position:fixed;top:0;bottom:0;width:calc((100vw - 1140px)/2);max-width:260px;pointer-events:none;z-index:0;opacity:.55}
.glass canvas{width:100%;height:100%;display:block}
.glass.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.glass.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 55%,transparent);mask-image:linear-gradient(270deg,#000 55%,transparent)}
@media (max-width:1300px){.glass{display:none}}

.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* Cabeçalho */
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 22px;padding:6px 18px 10px;border-radius:22px;
  background:linear-gradient(180deg,rgba(16,34,77,.85),rgba(9,20,48,.6));border:1px solid rgba(243,197,82,.25);box-shadow:inset 0 1px 0 rgba(255,233,168,.12)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.logo{width:178px;height:auto;aspect-ratio:1;object-fit:contain;margin:-26px 0 -26px -8px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
.back{font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:12px;color:var(--gold);text-decoration:none;border:1px solid var(--goldline);border-radius:999px;padding:5px 12px;background:rgba(6,13,34,.6);position:relative;z-index:2}
.back:hover{background:rgba(243,197,82,.14)}
.pitch{min-width:0}
.tag{margin:0;font-family:var(--quote);font-style:italic;font-weight:700;font-size:clamp(20px,2.4vw,27px);line-height:1.15;text-wrap:balance;color:var(--gold-hi);text-shadow:0 2px 14px rgba(243,197,82,.25)}
.tag .nb{white-space:nowrap}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:8px 0 10px;max-width:420px}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(270deg,transparent,var(--gold))}
.orn svg{width:12px;height:16px;flex:none}
.feats{display:flex;flex-wrap:wrap;gap:8px 20px}
.feat{display:flex;align-items:center;gap:9px;font-size:14px;line-height:1.15;color:var(--muted);font-weight:500}
.feat b{color:var(--ink);font-family:var(--display);font-size:17px;display:block}
.ring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--gold);border:1.5px solid var(--goldline);background:radial-gradient(circle at 50% 35%,rgba(243,197,82,.18),rgba(6,13,34,.4))}
.ring svg{width:20px;height:20px}
.tools{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#3b2500;border:0;background:var(--metal);box-shadow:0 0 0 2px var(--navy),0 0 0 3.5px var(--gold-lo),0 4px 12px rgba(0,0,0,.45);transition:transform .15s,box-shadow .15s}
.iconbtn svg{width:21px;height:21px}
.iconbtn:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--navy),0 0 0 3.5px var(--gold),0 6px 18px rgba(243,197,82,.35)}

/* Tabuleiro */
.board{position:relative;border-radius:24px;padding:16px 18px 16px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:8px;
  background:radial-gradient(800px 400px at 30% 0%,rgba(40,80,180,.25),transparent 70%),linear-gradient(180deg,var(--navy2),var(--navy) 60%,#09142f);
  border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px rgba(255,233,168,.15) inset,0 18px 50px rgba(0,0,0,.55)}
.board::before{content:"";position:absolute;inset:-2px;border-radius:24px;padding:2px;background:linear-gradient(160deg,var(--gold-hi),var(--gold-lo) 30%,var(--gold) 55%,var(--gold-lo) 80%,var(--gold-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.board::after{content:"";position:absolute;inset:7px;border-radius:18px;border:1px solid rgba(243,197,82,.18);pointer-events:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;position:relative;z-index:1}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(6,13,34,.7)}
.mode{background:transparent;border:0;color:var(--muted);font-weight:700;font-size:15px;padding:7px 16px;border-radius:999px;cursor:pointer;min-height:38px;transition:background .2s,color .2s}
.mode[aria-selected="true"]{background:var(--metal);color:#2b1900;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

.game{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"play side" "act side";gap:14px 20px;align-items:start}
.game.over{display:block}
.play{grid-area:play;display:flex;flex-direction:column;gap:14px;min-width:0}

/* Progresso */
.prog{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.scroll-tag{position:relative;font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink-dark);padding:6px 18px 6px 30px;white-space:nowrap;
  background:linear-gradient(180deg,#fbeecb,var(--parch2));border-radius:4px 10px 10px 4px;box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 0 0 1px rgba(107,74,34,.35)}
.scroll-tag::before{content:"";position:absolute;left:-6px;top:-4px;bottom:-4px;width:20px;border-radius:8px;background:linear-gradient(90deg,#c9a35a,#f7e3b0 45%,#b58b3e);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #4b62a3;background:rgba(6,13,34,.6);display:grid;place-items:center;font-size:10px;font-weight:800;color:#06210f;transition:transform .3s}
.dot.cur{border-color:var(--gold);background:radial-gradient(circle,var(--gold-hi),var(--gold));box-shadow:0 0 10px rgba(243,197,82,.8)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.hint{background:var(--hint);border-color:var(--hint);color:#3b2500}
.dot.no{background:var(--no);border-color:var(--no);color:#3a0606}
.dot.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.45)}}

/* Pergaminho */
.parch{position:relative;padding:30px 34px 24px;border-radius:6px;color:var(--ink-dark);text-align:center;
  background:
    radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(120,80,30,.35)),
    radial-gradient(40% 30% at 20% 25%,rgba(255,255,255,.35),transparent 70%),
    linear-gradient(180deg,#f8ebc9,var(--parch) 45%,#e7cf98);
  box-shadow:0 10px 28px rgba(0,0,0,.45),inset 0 0 0 1px rgba(107,74,34,.35),inset 0 0 0 7px rgba(255,248,226,.35),inset 0 0 0 8px rgba(176,122,20,.45)}
.parch .c{position:absolute;width:26px;height:26px;color:var(--gold-lo)}
.parch .c svg{width:100%;height:100%}
.parch .tl{top:6px;left:6px}.parch .tr{top:6px;right:6px;transform:scaleX(-1)}
.parch .bl{bottom:6px;left:6px;transform:scaleY(-1)}.parch .br{bottom:6px;right:6px;transform:scale(-1)}
.parch blockquote{margin:0;font-family:var(--quote);font-style:italic;font-weight:700;font-size:clamp(23px,3vw,34px);line-height:1.22;text-wrap:balance}
.parch blockquote .q:first-child{margin-right:.08em}
.parch blockquote .q:last-child{margin-left:.06em}
.parch blockquote .q{font-family:Georgia,serif;font-style:normal;font-weight:700;font-size:1.35em;line-height:0;vertical-align:-.28em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(90,55,5,.6))}
.parch .orn{color:var(--ink-brown);margin:14px auto 0;max-width:240px}
.parch .orn::before{background:linear-gradient(90deg,transparent,var(--ink-brown))}
.parch .orn::after{background:linear-gradient(270deg,transparent,var(--ink-brown))}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.985)}}

/* Alternativas */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;min-width:0;min-height:76px;padding:10px 14px 10px 10px;cursor:pointer;border-radius:14px;
  background:linear-gradient(180deg,#183470,#0f2252);border:1.5px solid rgba(243,197,82,.45);box-shadow:inset 0 1px 0 rgba(255,233,168,.12),0 6px 16px rgba(0,0,0,.35);
  transition:transform .18s ease,border-color .18s,box-shadow .18s,background .18s,opacity .3s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,233,168,.18),0 10px 22px rgba(0,0,0,.45),0 0 16px rgba(243,197,82,.18)}
.opt:active:not(:disabled){transform:translateY(0) scale(.99)}
.letter{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#2b1900;background:var(--metal);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.med{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#3a2600;
  background:radial-gradient(circle at 35% 28%,var(--gold-hi),var(--gold) 50%,var(--gold-lo));box-shadow:0 0 0 2px var(--navy),0 0 0 3.5px var(--gold),0 4px 12px rgba(0,0,0,.45)}
.med svg{width:56%;height:56%}
.ot{display:flex;flex-direction:column;min-width:0}
.on{font-weight:800;font-size:18px;line-height:1.15}
.od{font-size:14px;color:var(--muted);line-height:1.25;margin-top:2px}
.opts:not(.reveal) .od{display:none}
.opt[aria-pressed="true"]{border-color:var(--gold-hi);background:linear-gradient(180deg,#22428a,#16306a);box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(243,197,82,.45)}
.opt[aria-pressed="true"] .letter{background:var(--ruby);color:#fff;box-shadow:0 0 0 2px var(--gold)}
.opt.ok{border-color:var(--ok);background:linear-gradient(180deg,rgba(65,212,131,.22),rgba(15,34,82,.95));box-shadow:0 0 0 2px var(--ok),0 0 28px rgba(65,212,131,.4);animation:glow .7s ease}
.opt.ok .letter{background:var(--ok);color:#06210f}
.opt.no{border-color:var(--no);background:linear-gradient(180deg,rgba(255,107,107,.2),rgba(15,34,82,.95));box-shadow:0 0 0 2px var(--no);animation:shake .45s ease}
.opt.no .letter{background:var(--no);color:#3a0606}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.62;filter:saturate(.6)}
.badge{position:absolute;top:-9px;right:12px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.opt.ok .badge{background:var(--ok);color:#06210f}
.opt.no .badge{background:var(--no);color:#3a0606}
@keyframes glow{40%{transform:scale(1.02)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* Botão de ação */
.act{grid-area:act;justify-self:center;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 38px;border:0;border-radius:999px;cursor:pointer;
  font-weight:800;font-size:20px;color:#2b1900;background:var(--metal);box-shadow:0 0 0 2px var(--gold-lo),0 5px 0 #7c5208,0 10px 26px rgba(243,197,82,.35);transition:transform .12s,box-shadow .12s,filter .2s}
.act:hover:not(:disabled){filter:brightness(1.07)}
.act:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 2px var(--gold-lo),0 2px 0 #7c5208,0 6px 16px rgba(243,197,82,.3)}
.act:disabled{background:rgba(6,13,34,.55);color:var(--gold);box-shadow:none;border:1.5px dashed var(--goldline);cursor:default;font-size:17px}
.tri{width:0;height:0;border-left:13px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
.act:disabled .tri{display:none}
.ghost{min-height:52px;padding:0 24px;border-radius:999px;border:1.5px solid var(--gold);background:rgba(6,13,34,.5);color:var(--ink);font-weight:800;font-size:17px;cursor:pointer}
.ghost:hover{background:rgba(243,197,82,.14)}

/* Painel de revelação */
.side{grid-area:side;position:relative;border-radius:18px;padding:34px 18px 18px;min-width:0;scroll-margin-top:14px;
  background:radial-gradient(100% 60% at 50% 0%,rgba(163,24,47,.25),transparent 70%),linear-gradient(180deg,#1a1e48,#121433 60%,#0d1028);
  border:1.5px solid var(--goldline);box-shadow:inset 0 0 0 6px rgba(6,13,34,.6),inset 0 0 0 7px rgba(243,197,82,.25),0 12px 30px rgba(0,0,0,.45)}
.ribbon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;padding:8px 22px;border-radius:8px;
  font-family:var(--display);font-weight:700;font-size:16px;color:var(--gold-hi);background:linear-gradient(180deg,var(--ruby-hi),var(--ruby) 45%,var(--ruby-lo));box-shadow:0 0 0 1.5px var(--gold),0 6px 14px rgba(0,0,0,.5)}
.ribbon svg{width:20px;height:20px}
.face{display:flex;flex-direction:column;gap:14px}
.mystery{align-items:center;text-align:center}
.qmark{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;color:var(--gold);border:2px solid var(--gold);background:radial-gradient(circle,rgba(243,197,82,.16),transparent 70%);box-shadow:0 0 24px rgba(243,197,82,.25);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 40px rgba(243,197,82,.45)}}
.mystery p{margin:0;color:var(--muted);font-size:15.5px}
.hintbtn{min-height:44px;padding:0 20px;border-radius:999px;border:1.5px dashed var(--gold);background:rgba(243,197,82,.08);color:var(--gold-hi);font-weight:800;font-size:16px;cursor:pointer}
.hintbtn:hover:not(:disabled){background:rgba(243,197,82,.18)}
.hintbtn:disabled{color:var(--muted);border-color:var(--line);background:transparent;cursor:default}
.mystery small{font-size:13.5px;color:var(--muted);line-height:1.35}
.hintwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.still{width:100%;max-width:220px;height:auto;margin-top:2px}
.flame{transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
@keyframes flick{25%{transform:scale(1.04,.96) rotate(-2deg)}50%{transform:scale(.97,1.05) rotate(1.5deg)}75%{transform:scale(1.02,.98)}}
.revealed{animation:unveil .65s cubic-bezier(.2,.8,.2,1)}
@keyframes unveil{from{opacity:0;transform:perspective(800px) rotateY(-70deg) scale(.95);filter:brightness(1.8)}}
.verdict{margin:0;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;text-align:center}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}.verdict.hint{color:var(--hint)}
.mark{width:34px;height:34px;flex:none;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-size:17px;font-family:var(--ui)}
.yours{margin:-6px 0 0;text-align:center;font-size:14.5px;color:var(--muted)}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:14px;border-bottom:1px solid rgba(243,197,82,.25)}
.halo{position:relative;display:grid;place-items:center;width:110px;height:110px}
.halo::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(243,197,82,.55) 0 4deg,transparent 4deg 16deg);-webkit-mask:radial-gradient(circle,transparent 42%,#000 44%,transparent 72%);mask:radial-gradient(circle,transparent 42%,#000 44%,transparent 72%);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.halo .med{width:78px;height:78px}
.who .n{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15;color:var(--gold-hi)}
.who .d{font-size:14.5px;color:var(--muted)}
.info{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:15.5px;line-height:1.4}
.info .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid var(--goldline)}
.info .ic svg{width:16px;height:16px}
.info b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--gold)}

/* Placar */
.score{display:grid;grid-template-columns:repeat(4,1fr);border-radius:16px;position:relative;z-index:1;
  background:linear-gradient(180deg,rgba(16,34,77,.9),rgba(8,17,42,.9));border:1px solid rgba(243,197,82,.35);box-shadow:inset 0 1px 0 rgba(255,233,168,.1)}
.cell{display:flex;align-items:center;gap:12px;padding:12px 16px;min-width:0}
.cell+.cell{border-left:1px solid rgba(243,197,82,.18)}
.cell .ci{width:30px;height:30px;color:var(--gold);flex:none}
.cell .k{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;min-width:1.2ch}
.cell .k.bump{animation:pop .45s ease}
.cell .l{font-size:14px;line-height:1.15;color:var(--muted)}

/* Fim de partida */
.end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:8px 0 4px;position:relative}
.trophy{position:relative;width:170px;height:170px;display:grid;place-items:center}
.trophy::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(243,197,82,.35) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 24s linear infinite}
.trophy .disc{position:relative;width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 28%,#1c3a80,var(--navy) 70%);box-shadow:0 0 0 3px var(--gold),0 0 0 9px rgba(6,13,34,.8),0 0 0 11px var(--gold-lo),0 0 50px rgba(243,197,82,.4);animation:enter .6s cubic-bezier(.2,.8,.2,1)}
.trophy .big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}

.end h2{margin:0;font-family:var(--display);font-size:26px;color:var(--gold-hi);text-wrap:balance}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end .act{padding:0 30px;font-size:18px}
.legend{font-size:14px;color:var(--muted);margin:0}
.review{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;width:100%;max-width:720px;text-align:left}
.review li{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(6,13,34,.45);border:1px solid rgba(43,65,128,.7);font-size:15px}
.review .m{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.review .m.ok{background:var(--ok);color:#06210f}.review .m.no{background:var(--no);color:#3a0606}.review .m.hint{background:var(--hint);color:#3b2500}
.review i{font-family:var(--quote);font-weight:700;font-size:18px}
.review .a{color:var(--muted)}
.review .y{display:block;color:var(--no);font-size:14px}
.spark{position:absolute;top:30px;left:50%;width:7px;height:12px;border-radius:2px;pointer-events:none;opacity:0;animation:fall 1.9s ease-out forwards}

/* Painel suspenso (recorde, ajustes, ajuda) */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,7,20,.66);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:18px;padding:30px 22px 22px;background:linear-gradient(180deg,#1a1e48,#0d1028);border:1.5px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:enter .3s ease}
.sheet h3{margin:0 0 12px;font-family:var(--display);color:var(--gold-hi);font-size:20px}
.sheet p,.sheet li{color:var(--ink);font-size:16px}

.close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--goldline);background:transparent;cursor:pointer;color:var(--gold);font-size:20px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.stat{padding:12px 6px;border-radius:12px;text-align:center;background:rgba(6,13,34,.6);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:26px;color:var(--gold-hi)}
.stat span{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:12px;background:rgba(6,13,34,.6);border:1px solid var(--line);cursor:pointer;font-weight:700}
.toggle small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.toggle input{appearance:none;width:48px;height:28px;border-radius:999px;background:#24356a;border:1.5px solid var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:transform .2s}
.toggle input:checked{background:var(--gold-lo);border-color:var(--gold)}
.toggle input:checked::after{transform:translateX(20px);background:#fff}

footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:14px}
footer b{color:var(--gold-hi)}

@media (max-width:960px){
  .game{grid-template-columns:1fr;grid-template-areas:"play" "side" "act"}

  .score{grid-template-columns:repeat(2,1fr)}

}
@media (max-width:760px){

  .brand{flex-direction:row;align-items:center;gap:10px;grid-column:1;grid-row:1;min-width:0}
  .tools{grid-column:2;grid-row:1}
  .logo{width:92px;margin:-6px 0 -8px -4px;order:-1}
  .feats{display:none}
  .orn{display:none}
  .tag{font-size:17px;text-align:center}
}

  .letter{width:26px;height:26px;font-size:13px}
  .on{font-size:17px}
  .parch{padding:24px 18px 18px}
  .parch .orn{margin-top:10px}
  .dots{gap:5px}.dot{width:14px;height:14px;font-size:8px}
  .scroll-tag{font-size:14px;padding:5px 14px 5px 24px}
  .act{width:100%;justify-content:center;padding:0 20px;font-size:19px}
  .cell{padding:10px 12px;gap:8px}.cell .ci{width:24px;height:24px}.cell .k{font-size:24px}.cell .l{font-size:13px}
  .trophy{width:140px;height:140px}.trophy .disc{width:124px;height:124px}.trophy .big{font-size:52px}
}
@media (max-width:380px){.tools .iconbtn:nth-child(2){display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Estado e utilidades ===== */
const N = 10, KEY = "que-santo-que-disse:", LET = ["A", "B", "C", "D"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow = () => matchMedia("(max-width:960px)").matches;
const scrollTo = el => el.scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"});

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuf(a, r = Math.random) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayLabel(iso) { const [y, m, d] = iso.split("-"); return d + "/" + m; }
function stats() { return store.get("stats", {played: 0, bestScore: 0, bestStreak: 0}); }

function options(qi, r) {
  const q = Q[qi];
  const keys = Object.keys(A).filter(k => k !== q.a);
  const same = shuf(keys.filter(k => A[k].g === A[q.a].g), r);
  const other = shuf(keys.filter(k => A[k].g !== A[q.a].g), r);
  return shuf([q.a, ...[...same.slice(0, 2), ...other].slice(0, 3)], r);
}

let mode = "dia", deck = [], i = 0, sel = null, done = false, hintUsed = false, log = [], streak = 0, best = 0;
let oneTap = store.get("onetap", false);

function makeDeck() {
  if (mode === "dia") {
    const seed = today().split("-").reduce((s, x) => s * 100 + +x, 0);
    const r = rng(seed);
    return shuf(Q.map((_, k) => k), r).slice(0, N).map(qi => ({qi, o: options(qi, r)}));
  }
  return shuf(Q.map((_, k) => k)).slice(0, N).map(qi => ({qi, o: options(qi)}));
}

function setMode(m) {
  mode = m;
  $("m-dia").setAttribute("aria-selected", m === "dia");
  $("m-livre").setAttribute("aria-selected", m === "livre");
  start();
}
$("m-dia").addEventListener("click", () => setMode("dia"));
$("m-livre").addEventListener("click", () => setMode("livre"));

function start() {
  if (mode === "dia") {
    const saved = store.get("dia:" + today(), null);
    if (saved && saved.log && saved.log.length === N) { deck = saved.deck; log = saved.log; best = saved.best; streak = 0; i = N; return end(true); }
  }
  deck = makeDeck(); i = 0; log = []; streak = 0; best = 0;
  render();
}

const hits = () => log.filter(l => l.ok).length;
const cls = l => l.ok ? (l.h ? "hint" : "ok") : "no";

/* ===== Componentes ===== */
const medal = (k, extra = "") => `<span class="med ${extra}">${ICON[A[k].i]}</span>`;
const dotsHTML = () => Array.from({length: N}, (_, k) => {
  const l = log[k]; const c = l ? cls(l) : (k === i ? "cur" : "");
  return `<span class="dot ${c}">${l ? (l.ok ? "✓" : "✕") : ""}</span>`;
}).join("");
const corners = () => ["tl", "tr", "bl", "br"].map(c => `<span class="c ${c}">${ICON.corner}</span>`).join("");
const optHTML = (k, n) => `<button class="opt" data-k="${k}" aria-pressed="false" aria-label="${LET[n]}: ${esc(A[k].n)}">
  <span class="letter" aria-hidden="true">${LET[n]}</span>${medal(k)}
  <span class="ot"><span class="on">${A[k].n}</span><span class="od">${A[k].d}</span></span></button>`;

function updateScore(bump) {
  const set = (id, v) => { const el = $(id); if (el.textContent !== String(v)) { el.textContent = v; if (bump) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } } };
  set("s-hits", hits()); set("s-streak", streak); set("s-best", best); set("s-rec", stats().bestScore);
}

function render() {
  sel = null; done = false; hintUsed = false;
  const it = deck[i], q = Q[it.qi];
  const g = $("game"); g.className = "game";
  g.innerHTML = `
  <div class="play">
    <div class="prog">
      <span class="scroll-tag">Frase ${i + 1} de ${N}</span>
      <div class="dots" role="img" aria-label="Progresso: frase ${i + 1} de ${N}">${dotsHTML()}</div>
    </div>
    <figure class="parch enter" style="margin:0">${corners()}
      <blockquote><span class="q">“</span>${esc(q.t)}<span class="q">”</span></blockquote>
      <div class="orn" aria-hidden="true">${ICON.cross}</div>
    </figure>
    <div class="opts" id="opts" role="group" aria-label="Quem disse a frase?">${it.o.map(optHTML).join("")}</div>
  </div>
  <aside class="side" id="side" aria-live="polite">
    <div class="ribbon">${ICON.openbook}<span id="rib">Dica e contexto</span></div>
    <div class="face mystery" id="face">
      <div class="qmark" aria-hidden="true">?</div>
      <p>Escolha um autor e confirme para revelar quem disse, a fonte e o contexto.</p>
      <div class="hintwrap">
        <button class="hintbtn" id="hint">Mostrar dica</button>
        <small>A dica mostra quem é cada autor. Acerto com dica fica amarelo no resultado.</small>
      </div>
      ${STILL}
    </div>
  </aside>
  <button class="act" id="act"><span class="tri"></span><span id="actt"></span></button>`;
  g.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(b.dataset.k)));
  $("hint").addEventListener("click", useHint);
  $("act").addEventListener("click", act);
  updateScore(false);
  syncAct();
}

function useHint() {
  if (done) return;
  hintUsed = true;
  $("opts").classList.add("reveal");
  $("hint").disabled = true; $("hint").textContent = "Dica usada";
}

function pick(k) {
  if (done) return;
  sel = k;
  document.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", o.dataset.k === k));
  if (oneTap) return answer();
  syncAct();
}

function syncAct() {
  const b = $("act"), t = $("actt");
  if (!b) return;
  if (done) { b.disabled = false; b.hidden = false; t.textContent = i === N - 1 ? "Ver resultado" : "Próxima frase"; return; }
  if (oneTap) { b.hidden = true; return; }
  b.hidden = false; b.disabled = !sel;
  t.textContent = sel ? "Confirmar resposta" : "Escolha um autor";
}

function act() { if (done) next(); else if (sel) answer(); }

function answer() {
  if (!sel || done) return;
  done = true;
  const it = deck[i], q = Q[it.qi], ok = sel === q.a;
  $("opts").classList.add("reveal");
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true; b.setAttribute("aria-pressed", "false");
    if (b.dataset.k === q.a) { b.classList.add("ok"); b.insertAdjacentHTML("beforeend", '<span class="badge">Quem disse</span>'); }
    else if (b.dataset.k === sel) { b.classList.add("no"); b.insertAdjacentHTML("beforeend", '<span class="badge">Sua escolha</span>'); }
  });
  if (ok) { streak++; best = Math.max(best, streak); } else streak = 0;
  const l = {ok, h: hintUsed, p: sel}; log.push(l);
  const dots = document.querySelector(".dots"); dots.innerHTML = dotsHTML(); dots.children[i].classList.add("pop");
  updateScore(true);
  const vc = cls(l);
  $("rib").textContent = "Revelação";
  $("face").outerHTML = `<div class="face revealed" id="face">
    <p class="verdict ${vc}"><span class="mark" aria-hidden="true">${ok ? "✓" : "✕"}</span>${ok ? (hintUsed ? "Acertou com dica!" : "Acertou!") : "Não foi desta vez"}</p>
    ${ok ? "" : `<p class="yours">Você marcou ${esc(A[sel].n)}. Quem disse foi:</p>`}
    <div class="who"><span class="halo">${medal(q.a)}</span><span class="n">${A[q.a].n}</span><span class="d">${A[q.a].d}</span></div>
    <div class="info"><span class="ic">${ICON.source}</span><div><b>Fonte</b>${esc(q.s)}</div></div>
    <div class="info"><span class="ic">${ICON.quote}</span><div><b>Contexto</b>${esc(q.c)}</div></div>
  </div>`;
  syncAct();
  if (narrow()) scrollTo($("side"));
  $("act").focus({preventScroll: true});
}

function next() {
  i++;
  if (i < N) { render(); if (narrow()) scrollTo($("board")); }
  else end(false);
}

function message(s) {
  if (s >= 9) return ["Doutor da Igreja!", "Você conhece os santos de cor."];
  if (s >= 7) return ["Leitor assíduo da Liturgia das Horas!", "Faltou pouco para a pontuação máxima."];
  if (s >= 5) return ["Bom catequista!", "Já dá para ensinar muita gente."];
  if (s >= 3) return ["Bom começo!", "Cada fonte da revisão é um convite para ler mais."];
  return ["Toda caminhada começa assim.", "Leia a revisão e jogue de novo: as frases voltam."];
}

function sparks(host) {
  if (reduce) return;
  const cols = ["#ffe9a8", "#f3c552", "#d23a4f", "#41d483", "#ffffff"];
  for (let k = 0; k < 36; k++) {
    const s = document.createElement("span"); s.className = "spark";
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
    s.style.cssText = `background:${cols[k % cols.length]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d * .7 + 120}px;--r:${Math.random() * 720 - 360}deg;animation-delay:${Math.random() * .25}s`;
    host.appendChild(s); setTimeout(() => s.remove(), 2400);
  }
}

function end(fromSave) {
  const s = hits(), url = location.origin + location.pathname;
  if (!fromSave) {
    const st = stats();
    st.played++; st.bestScore = Math.max(st.bestScore, s); st.bestStreak = Math.max(st.bestStreak, best);
    store.set("stats", st);
    if (mode === "dia") store.set("dia:" + today(), {deck, log, best});
  }
  updateScore(false); foot();
  const [h, sub] = message(s);
  const grid = log.map(l => l.ok ? (l.h ? "🟨" : "🟩") : "🟥").join("");
  const head = mode === "dia" ? `Que santo que disse? · Desafio de ${dayLabel(today())}` : "Que santo que disse?";
  const share = `${head}\n${s}/${N} ${grid}\nMaior sequência: ${best}\n${url}`;
  const g = $("game"); g.className = "game over";
  g.innerHTML = `<div class="end" id="end" aria-live="polite">
    <span class="scroll-tag">${mode === "dia" ? "Desafio de " + dayLabel(today()) : "Partida concluída"}</span>
    <div class="trophy"><div class="disc"><span class="big">${s}</span><small>de ${N}</small></div></div>
    <div class="dots" aria-hidden="true">${dotsHTML()}</div>
    <h2>${h}</h2>
    <p class="sub">${sub} Maior sequência: ${best}.${mode === "dia" ? " Amanhã tem um desafio novo." : ""}</p>
    <div class="share" id="sh">${esc(share)}</div>
    <div class="row">
      <button class="act" id="again"><span class="tri"></span>${mode === "dia" ? "Partida livre" : "Jogar de novo"}</button>
      <button class="ghost" id="cp">Copiar resultado</button>
    </div>
    <p class="legend">🟩 acerto · 🟨 acerto com dica · 🟥 erro</p>
    <ul class="review">${log.map((l, k) => { const q = Q[deck[k].qi]; return `<li><span class="m ${cls(l)}" aria-label="${l.ok ? "acerto" : "erro"}">${l.ok ? "✓" : "✕"}</span><span><i>“${esc(q.t)}”</i> <span class="a">— ${A[q.a].n} · ${esc(q.s)}</span>${l.ok ? "" : `<span class="y">Você marcou: ${esc(A[l.p].n)}</span>`}</span></li>`; }).join("")}</ul>
  </div>`;
  $("again").addEventListener("click", () => setMode("livre"));
  $("cp").addEventListener("click", () => {
    const b = $("cp");
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("sh")); const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r); b.textContent = "Texto selecionado"; };
    try { navigator.clipboard.writeText(share).then(() => b.textContent = "Copiado!").catch(fallback); } catch (e) { fallback(); }
  });
  if (!fromSave) { sparks($("end")); if (narrow()) scrollTo($("board")); }
}

function foot() {
  const st = stats();
  $("foot").innerHTML = st.played
    ? `Seu recorde: <b>${st.bestScore}/${N}</b> · Maior sequência: <b>${st.bestStreak}</b> · Partidas: <b>${st.played}</b>`
    : `Carludix Play · Escolha o autor, confirme e veja a fonte da frase.`;
}

/* ===== Painel suspenso ===== */
let lastFocus = null;
function openSheet(which) {

  if (which === "recorde") body.innerHTML = `<h3>Seus recordes</h3>

function closeSheet() { $("scrim").hidden = true; if (lastFocus) lastFocus.focus(); }
document.querySelectorAll("[data-sheet]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.sheet)));
$("sheet-x").addEventListener("click", closeSheet);

document.addEventListener("keydown", e => {

    const n = "abcd1234".indexOf(e.key.toLowerCase()) % 4, b = document.querySelectorAll(".opt")[n];

  }

/* ===== Vitrais (canvas, desenhados uma vez) ===== */
function drawGlass(cv, flip) {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext("2d"); c.scale(dpr, dpr);
  const r = rng(flip ? 7 : 3), cols = ["#1d4fd6", "#6a1fa8", "#b3182f", "#e9a21a", "#14806a", "#2f74e0", "#8a1c6e"];
  const cell = 34, cx = Math.ceil(w / cell) + 1, cy = Math.ceil(h / cell) + 1, P = [];
  for (let y = 0; y < cy; y++) { P[y] = []; for (let x = 0; x < cx; x++) P[y][x] = [x * cell + (x && x < cx - 1 ? (r() - .5) * cell * .7 : 0), y * cell + (y && y < cy - 1 ? (r() - .5) * cell * .7 : 0)]; }
  c.fillStyle = "#050a1c"; c.fillRect(0, 0, w, h);
  for (let y = 0; y < cy - 1; y++) for (let x = 0; x < cx - 1; x++) {
    const a = P[y][x], b = P[y][x + 1], d = P[y + 1][x], e = P[y + 1][x + 1];
    for (const tri of (r() > .5 ? [[a, b, e], [a, e, d]] : [[a, b, d], [b, e, d]])) {
      c.beginPath(); c.moveTo(...tri[0]); c.lineTo(...tri[1]); c.lineTo(...tri[2]); c.closePath();
      const col = cols[Math.floor(r() * cols.length)];
      const gr = c.createLinearGradient(tri[0][0], tri[0][1], tri[2][0], tri[2][1]);
      gr.addColorStop(0, col); gr.addColorStop(1, "#0a0f2a");
      c.globalAlpha = .55 + r() * .4; c.fillStyle = gr; c.fill();
      c.globalAlpha = 1; c.strokeStyle = "#04060f"; c.lineWidth = 3; c.stroke();
    }
  }
  const lg = c.createRadialGradient(w / 2, h * .25, 10, w / 2, h * .25, h * .6);
  lg.addColorStop(0, "rgba(255,230,160,.22)"); lg.addColorStop(1, "rgba(0,0,0,.35)");
  c.fillStyle = lg; c.fillRect(0, 0, w, h);
}
function glass() { if (innerWidth < 1300) return; document.querySelectorAll(".glass canvas").forEach((cv, k) => drawGlass(cv, k)); }
let gt; addEventListener("resize", () => { clearTimeout(gt); gt = setTimeout(glass, 200); });

$("fq").textContent = Q.length;
glass(); foot(); start();
