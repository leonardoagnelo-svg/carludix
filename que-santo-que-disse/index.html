<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>Que santo que disse?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Quiz católico: leia a frase de um santo ou papa e descubra quem disse. Cada frase com a fonte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Spectral:ital,wght@0,400;1,400;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout do Leo (banner Carludix Play): logo + chamada no topo; jogo com frase e 4 opções, painel de resultado ao lado (embaixo no celular), um botão de ação. Visual único: noite azul-marinho e ouro. */
:root{
  color-scheme:dark;
  --bg:#0a1430; --panel:#101f4a; --panel2:#0c1838;
  --gold:#f2c14e; --gold2:#c98d1a; --goldline:rgba(242,193,78,.55);
  --ink:#f3ecd8; --muted:#b3bcd6; --line:#2a3d73;
  --ok:#3fd07a; --no:#ef6a6a; --hint:#f2c14e;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --quote:"Spectral",Georgia,serif;
  --ui:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;
  background:radial-gradient(1200px 600px at 75% -10%,#1d3a86 0%,transparent 60%),radial-gradient(800px 500px at 0% 30%,rgba(201,141,26,.18),transparent 60%),var(--bg);min-height:100%}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.back{align-self:flex-start;font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:13px;color:var(--gold);text-decoration:none;border:1.5px solid var(--goldline);border-radius:999px;padding:6px 14px}
.back:hover{background:rgba(242,193,78,.12)}
.back:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:24px;align-items:center}
.logo{width:100%;aspect-ratio:1;object-fit:contain;height:auto;display:block;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5))}
.tag{font-weight:800;font-style:italic;font-size:clamp(18px,2.6vw,28px);line-height:1.2;text-wrap:balance;hyphens:none;transform:rotate(-2deg);margin:0}
.tag .nb{white-space:nowrap}
.tag::after{content:"";display:block;width:220px;max-width:60%;height:3px;margin-top:10px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px}
.feats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;color:var(--muted);font-size:13px;font-weight:700}
.feats b{color:var(--gold);font-size:16px}

.board{border:2px solid var(--goldline);border-radius:18px;padding:16px 18px 18px;background:linear-gradient(180deg,rgba(16,31,74,.94),rgba(10,20,48,.94));box-shadow:0 0 0 1px rgba(242,193,78,.12) inset,0 0 40px rgba(242,193,78,.12);display:flex;flex-direction:column;gap:14px;scroll-margin-top:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.modes{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--panel2)}
.mode{background:transparent;border:0;color:var(--muted);font-weight:800;font-size:13.5px;padding:7px 14px;border-radius:999px;cursor:pointer}
.mode[aria-selected="true"]{background:linear-gradient(180deg,#ffd970,var(--gold));color:#1f1400}
.mode:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:700;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:#24356a;border:1.5px solid var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:transform .15s}
.toggle input:checked{background:var(--gold2);border-color:var(--gold)}
.toggle input:checked::after{transform:translateX(16px);background:#fff}
.toggle input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.game{display:grid;grid-template-columns:minmax(0,1fr) 290px;grid-template-areas:"play side" "act side";gap:14px 18px;align-items:start}
.game.over{display:block}
.play{grid-area:play;display:flex;flex-direction:column;gap:14px;min-width:0}
.prog{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.pill{border:1px solid var(--goldline);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.soft{border-color:var(--line);color:var(--muted)}
.pill.soft b{color:var(--gold)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #4a5d93;display:grid;place-items:center;font-size:10px;font-weight:800;color:#0a1430;box-sizing:border-box}
.dot.cur{border-color:var(--gold);box-shadow:0 0 8px rgba(242,193,78,.6)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.hint{background:var(--hint);border-color:var(--hint)}
.dot.no{background:var(--no);border-color:var(--no)}

.qcard{border:1.5px solid var(--goldline);border-radius:14px;padding:26px 24px;background:radial-gradient(400px 200px at 0% 100%,rgba(242,193,78,.14),transparent 70%),var(--panel2)}
.qcard blockquote{margin:0;font-family:var(--quote);font-style:italic;font-weight:500;font-size:clamp(20px,2.7vw,28px);line-height:1.35;text-align:center;text-wrap:balance}
.qcard blockquote::before,.qcard blockquote::after{font-family:Georgia,serif;font-style:normal;color:var(--gold);font-size:1.5em;line-height:0;vertical-align:-.3em}
.qcard blockquote::before{content:"\201C";margin-right:.15em}
.qcard blockquote::after{content:"\201D";margin-left:.1em}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{color:var(--ink);text-align:left;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:12px;border:1.5px solid var(--line);background:linear-gradient(180deg,#14275a,#0f1e48);cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:0;min-height:60px}
.opt:hover:not(:disabled){border-color:var(--goldline)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(242,193,78,.35)}
.opt.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset,0 0 18px rgba(63,208,122,.3)}
.opt.no{border-color:var(--no);box-shadow:0 0 0 1px var(--no) inset}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.78;border-color:#22346a}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#3a2600;background:radial-gradient(circle at 35% 30%,#ffe7a3,var(--gold) 55%,var(--gold2));box-shadow:0 0 0 2px #0a1430,0 0 0 3.5px var(--gold)}
.av svg{width:58%;height:58%}
.ot{display:flex;flex-direction:column;min-width:0}
.on{font-weight:800;font-size:15.5px}
.od{font-size:12.5px;color:var(--muted)}
.opts:not(.reveal) .od{display:none}

.side{grid-area:side;border:1.5px solid var(--goldline);border-radius:14px;background:var(--panel2);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:12px}
.wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:var(--muted);font-size:14px}
.wait .av{width:60px;height:60px;opacity:.55}
.wait h3{margin:0;color:var(--ink);font-size:15px}
.hintbtn{background:transparent;color:var(--gold);border:1.5px dashed var(--goldline);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}
.hintbtn:hover:not(:disabled){background:rgba(242,193,78,.1)}
.hintbtn:disabled{color:var(--muted);border-color:var(--line);cursor:default}
.hintbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wait small{font-size:12.5px;line-height:1.4}
.wait-txt{display:flex;flex-direction:column;gap:8px;align-items:center}
.verdict{font-weight:800;font-size:21px;line-height:1.2;display:flex;align-items:center;gap:10px;justify-content:center;margin:0}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)} .verdict.hint{color:var(--hint)}
.mark{width:30px;height:30px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-size:16px}
.yours{text-align:center;font-size:13.5px;color:var(--muted);margin:-4px 0 0}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.who .av{width:70px;height:70px}
.who .n{font-family:var(--display);font-weight:800;color:var(--gold);font-size:19px;line-height:1.2}
.who .d{font-size:12.5px;color:var(--muted)}
.info{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px}
.info .ic{color:var(--gold);font-weight:800;font-family:Georgia,serif;font-size:20px;line-height:1}
.info b{display:block;color:var(--gold);font-size:13px}

.act{grid-area:act;justify-self:center;color:#1f1400;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;font-weight:800;font-size:17px;background:linear-gradient(180deg,#ffd970,var(--gold) 50%,var(--gold2));box-shadow:0 4px 0 #8a5c08,0 0 22px rgba(242,193,78,.35);display:flex;align-items:center;gap:10px;min-height:48px}
.act:disabled{background:transparent;color:var(--gold);box-shadow:none;border:1.5px dashed var(--goldline);cursor:default;font-size:15px}
.act:focus-visible{outline:2px solid #fff;outline-offset:3px}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #8a5c08}
.tri{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.act:disabled .tri{display:none}
.ghost{color:var(--ink);background:transparent;border:1.5px solid var(--gold);border-radius:999px;padding:11px 20px;cursor:pointer;font-weight:800;min-height:48px}
.ghost:hover{background:rgba(242,193,78,.12)}
.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:6px 0}
.end .big{font-family:var(--display);font-weight:800;font-size:72px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.end h2{font-family:var(--display);margin:0;font-size:24px;text-wrap:balance}
.end .sub{color:var(--muted);margin:-6px 0 0;max-width:520px}
.share{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;white-space:pre-wrap;user-select:all;font-size:14.5px;max-width:100%;overflow-wrap:anywhere}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;text-align:left;font-size:14px;max-width:660px;width:100%}
.review li{display:flex;gap:8px}
.review .m{font-weight:800;width:1.2em;flex:none}
.review .m.ok{color:var(--ok)} .review .m.no{color:var(--no)} .review .m.hint{color:var(--hint)}
.review .a{color:var(--muted)}
.review .y{color:var(--no);display:block;font-size:13px}
.legend{font-size:12.5px;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);text-align:center}
footer b{color:var(--gold)}

@media (max-width:860px){
  .top{grid-template-columns:auto 1fr;gap:12px}
  .logo{width:96px}
  .tag{transform:none;font-size:15px}
  .tag::after,.feats{display:none}
  .board{padding:12px}
  .game{grid-template-columns:1fr;grid-template-areas:"play" "side" "act"}
  .side .wait{flex-direction:row;text-align:left;align-items:center}
  .side .wait .av,.side .wait h3{display:none}
  .wait-txt{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
}
@media (max-width:560px){
  .top{display:none}
  .mob-head{display:flex!important}
  .opts{grid-template-columns:1fr}
  .opt{min-height:54px}
  .dots{gap:5px}
  .dot{width:13px;height:13px;font-size:8px}
  .qcard{padding:18px 14px}
  .bar{gap:8px}
  .modes{width:100%}
  .mode{flex:1}
}
.mob-head{display:none;align-items:center;justify-content:space-between;gap:10px}
.mob-head img{width:64px;height:64px;object-fit:contain}
.mob-head .back{align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <footer id="foot"></footer>
</div>

const N = 10, KEY = "que-santo-que-disse:";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuf(a, r = Math.random) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayLabel(iso) { const [y, m, d] = iso.split("-"); return d + "/" + m; }

function options(qi, r) {
  const q = Q[qi];
  const keys = Object.keys(A).filter(k => k !== q.a);
  const same = shuf(keys.filter(k => A[k].g === A[q.a].g), r);
  const other = shuf(keys.filter(k => A[k].g !== A[q.a].g), r);
  return shuf([q.a, ...[...same.slice(0, 2), ...other].slice(0, 3)], r);
}

let mode = "dia", deck = [], i = 0, sel = null, done = false, hintUsed = false, log = [], streak = 0, best = 0;
let oneTap = store.get("onetap", false);
$("onetap").checked = oneTap;
$("onetap").addEventListener("change", e => { oneTap = e.target.checked; store.set("onetap", oneTap); if (!done && deck.length && i < N) syncAct(); });

function makeDeck() {
  if (mode === "dia") {
    const d = today(), seed = d.split("-").reduce((s, x) => s * 100 + +x, 0);
    const r = rng(seed);
    return shuf(Q.map((_, k) => k), r).slice(0, N).map(qi => ({qi, o: options(qi, r)}));
  }
  return shuf(Q.map((_, k) => k)).slice(0, N).map(qi => ({qi, o: options(qi)}));
}

function setMode(m) {
  mode = m;
  $("m-dia").setAttribute("aria-selected", m === "dia");
  $("m-livre").setAttribute("aria-selected", m === "livre");
  start();
}
$("m-dia").addEventListener("click", () => setMode("dia"));
$("m-livre").addEventListener("click", () => setMode("livre"));

function start() {
  if (mode === "dia") {
    const saved = store.get("dia:" + today(), null);
    if (saved && saved.log && saved.log.length === N) { deck = saved.deck; log = saved.log; best = saved.best; i = N; return end(true); }
  }
  deck = makeDeck(); i = 0; log = []; streak = 0; best = 0;
  render();
}

function hits() { return log.filter(l => l.ok).length; }
function cls(l) { return l.ok ? (l.h ? "hint" : "ok") : "no"; }
function dots() {
  return Array.from({length: N}, (_, k) => {
    const l = log[k]; const c = l ? cls(l) : (k === i ? "cur" : "");
    return `<span class="dot ${c}" aria-hidden="true">${l ? (l.ok ? "✓" : "✕") : ""}</span>`;
  }).join("");
}
function av(k, extra = "") { return `<span class="av ${extra}">${ICON[A[k].i]}</span>`; }

function render() {
  sel = null; done = false; hintUsed = false;
  const it = deck[i], q = Q[it.qi];
  const g = $("game"); g.className = "game";
  g.innerHTML = `
  <div class="play">
    <div class="prog">
      <span class="pill">Frase ${i + 1} de ${N}</span>
      <div class="dots">${dots()}</div>
      <span class="pill soft">Acertos <b>${hits()}</b> · Sequência <b>${streak}</b></span>
    </div>
    <div class="qcard"><blockquote>${esc(q.t)}</blockquote></div>
    <div class="opts" id="opts" role="group" aria-label="Quem disse a frase?">${it.o.map(k => `<button class="opt" data-k="${k}" aria-pressed="false">${av(k)}<span class="ot"><span class="on">${A[k].n}</span><span class="od">${A[k].d}</span></span></button>`).join("")}</div>
  </div>
  <aside class="side" id="side" aria-live="polite">
    <div class="wait"><span class="av">${ICON.q}</span><h3>Quem disse?</h3>
      <div class="wait-txt"><button class="hintbtn" id="hint">Mostrar dica</button><small>A dica mostra quem é cada autor. Se acertar com ela, a frase fica amarela no resultado.</small></div>
    </div>
  </aside>
  <button class="act" id="act"><span class="tri"></span><span id="actt"></span></button>`;
  g.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(b.dataset.k)));
  $("hint").addEventListener("click", useHint);
  $("act").addEventListener("click", act);
  syncAct();
}

function useHint() {
  if (done) return;
  hintUsed = true;
  $("opts").classList.add("reveal");
  $("hint").disabled = true; $("hint").textContent = "Dica usada";
}

function pick(k) {
  if (done) return;
  sel = k;
  document.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", o.dataset.k === k));
  if (oneTap) return answer();
  syncAct();
}

function syncAct() {
  const b = $("act"), t = $("actt");
  if (done) { b.disabled = false; b.hidden = false; t.textContent = i === N - 1 ? "Ver resultado" : "Próxima frase"; return; }
  if (oneTap) { b.hidden = true; return; }
  b.hidden = false; b.disabled = !sel;
  t.textContent = sel ? "Confirmar resposta" : "Escolha um autor";
}

function act() { if (done) next(); else if (sel) answer(); }

function answer() {
  if (!sel || done) return;
  done = true;
  const it = deck[i], q = Q[it.qi], ok = sel === q.a;
  $("opts").classList.add("reveal");
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true; b.setAttribute("aria-pressed", "false");
    if (b.dataset.k === q.a) b.classList.add("ok");
    else if (b.dataset.k === sel) b.classList.add("no");
  });
  if (ok) { streak++; best = Math.max(best, streak); } else streak = 0;
  const l = {ok, h: hintUsed, p: sel}; log.push(l);
  document.querySelector(".dots").innerHTML = dots();
  const pills = document.querySelectorAll(".pill.soft b"); pills[0].textContent = hits(); pills[1].textContent = streak;
  const vc = cls(l);
  $("side").innerHTML = `
    <p class="verdict ${vc}"><span class="mark" aria-hidden="true">${ok ? "✓" : "✕"}</span>${ok ? (hintUsed ? "Acertou com dica!" : "Acertou!") : "Errou!"}</p>
    ${ok ? "" : `<p class="yours">Você marcou ${esc(A[sel].n)}. Quem disse foi:</p>`}
    <div class="who">${av(q.a)}<span class="n">${A[q.a].n}</span><span class="d">${A[q.a].d}</span></div>
    <div class="info"><span class="ic" aria-hidden="true">§</span><div><b>Fonte</b>${esc(q.s)}</div></div>
    <div class="info"><span class="ic" aria-hidden="true">“</span><div><b>Contexto</b>${esc(q.c)}</div></div>`;
  syncAct();
  if (matchMedia("(max-width:860px)").matches) $("side").scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"});
  $("act").focus({preventScroll: true});
}

function next() {
  i++;
  if (i < N) { render(); if (matchMedia("(max-width:860px)").matches) $("board").scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"}); }
  else end(false);
}

function message(s) {
  if (s >= 9) return ["Doutor da Igreja!", "Você conhece os santos de cor."];
  if (s >= 7) return ["Leitor assíduo da Liturgia das Horas!", "Faltou pouco para a pontuação máxima."];
  if (s >= 5) return ["Bom catequista!", "Já dá para ensinar muita gente."];
  if (s >= 3) return ["Bom começo!", "Cada fonte da revisão é um convite para ler mais."];
  return ["Toda caminhada começa assim.", "Leia a revisão e jogue de novo: as frases voltam."];
}

function end(fromSave) {
  const s = hits(), url = location.origin + location.pathname;
  if (!fromSave) {
    const st = store.get("stats", {played: 0, bestScore: 0, bestStreak: 0});
    st.played++; st.bestScore = Math.max(st.bestScore, s); st.bestStreak = Math.max(st.bestStreak, best);
    store.set("stats", st);
    if (mode === "dia") store.set("dia:" + today(), {deck, log, best});
  }
  foot();
  const [h, sub] = message(s);
  const grid = log.map(l => l.ok ? (l.h ? "🟨" : "🟩") : "🟥").join("");
  const head = mode === "dia" ? `Que santo que disse? · Desafio de ${dayLabel(today())}` : "Que santo que disse?";
  const share = `${head}\n${s}/${N} ${grid}\nMaior sequência: ${best}\n${url}`;
  const g = $("game"); g.className = "game over";
  g.innerHTML = `<div class="end" aria-live="polite">
    <span class="pill">${mode === "dia" ? "Desafio de " + dayLabel(today()) : "Resultado"}</span>
    <div class="dots">${dots()}</div>
    <div class="big">${s}<span style="font-size:.4em;color:var(--muted)">/${N}</span></div>
    <h2>${h}</h2>
    <p class="sub">${sub} Maior sequência: ${best}.${mode === "dia" ? " Amanhã tem um desafio novo." : ""}</p>
    <div class="share" id="sh">${esc(share)}</div>
    <div class="row">
      <button class="act" id="again"><span class="tri"></span>${mode === "dia" ? "Partida livre" : "Jogar de novo"}</button>
      <button class="ghost" id="cp">Copiar resultado</button>
    </div>
    <p class="legend">🟩 acerto · 🟨 acerto com dica · 🟥 erro</p>
    <ul class="review">${log.map((l, k) => { const q = Q[deck[k].qi]; return `<li><span class="m ${cls(l)}" aria-label="${l.ok ? "acerto" : "erro"}">${l.ok ? "✓" : "✕"}</span><span><i>${esc(q.t)}</i> <span class="a">— ${A[q.a].n} · ${esc(q.s)}</span>${l.ok ? "" : `<span class="y">Você marcou: ${esc(A[l.p].n)}</span>`}</span></li>`; }).join("")}</ul>
  </div>`;
  $("again").addEventListener("click", () => setMode("livre"));
  $("cp").addEventListener("click", () => {
    const b = $("cp");
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("sh")); const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r); b.textContent = "Texto selecionado"; };
    try { navigator.clipboard.writeText(share).then(() => b.textContent = "Copiado!").catch(fallback); } catch (e) { fallback(); }
  });
  if (!fromSave && matchMedia("(max-width:860px)").matches) $("board").scrollIntoView({block: "start", behavior: reduce ? "auto" : "smooth"});
}

function foot() {
  const st = store.get("stats", {played: 0, bestScore: 0, bestStreak: 0});
  $("foot").innerHTML = st.played
    ? `Seu recorde: <b>${st.bestScore}/${N}</b> · Maior sequência: <b>${st.bestStreak}</b> · Partidas: <b>${st.played}</b>`
    : `Carludix Play · Escolha o autor, confirme e veja a fonte da frase.`;
}

$("fq").textContent = Q.length;
foot();
start();
</script>
